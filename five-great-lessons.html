<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Lima Pelajaran Besar — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--cream:#FFF8F0;--shadow:0 4px 24px rgba(0,0,0,.35);--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 20px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.8rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.82rem;opacity:.5}
.lesson-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px 100px;position:relative;z-index:1}
.lesson-card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s}
.lesson-card:active{transform:scale(.97)}
.lesson-icon{font-size:2.5rem;flex-shrink:0}
.lesson-name{font-family:var(--font-h);font-size:1.1rem;margin-bottom:2px}
.lesson-desc{font-size:.78rem;opacity:.5;line-height:1.3}
.lesson-badge{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lesson-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.lesson-header{padding:12px 16px 8px;position:relative;z-index:1}
.lesson-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.lesson-back:active{transform:scale(.95)}
.lesson-title-bar{font-family:var(--font-h);font-size:1.3rem;color:var(--gold);text-align:center;margin:8px 0 12px}
.exp-grid{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.exp-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;color:var(--cream);transition:all .15s}
.exp-card:active{background:rgba(255,255,255,.1);transform:scale(.98)}
.exp-card.done{border-color:var(--green)}
.exp-num{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);font-family:var(--font-h);font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.exp-card.done .exp-num{background:var(--green);border-color:var(--green)}
.exp-name{font-weight:700;font-size:.9rem}
.exp-tagline{font-size:.75rem;opacity:.5}
.exp-header{padding:10px 16px 6px;position:relative;z-index:1}
.exp-title{font-family:var(--font-h);font-size:1.2rem;color:var(--gold);text-align:center;margin-bottom:4px}
.exp-prompt{font-size:.85rem;opacity:.7;text-align:center;margin-bottom:16px;padding:0 16px}
.exp-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.exp-instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;margin:12px 0;font-size:.88rem;line-height:1.6;text-align:center;border:1px solid rgba(255,255,255,.08)}
.exp-success{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);border-radius:12px;padding:12px 16px;text-align:center;color:var(--green);font-weight:700;margin:10px 0}
.demo-box{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;text-align:center;margin:10px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.demo-label{font-size:.78rem;opacity:.5;margin-bottom:4px}
.animal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0}
.animal-card{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;border:none;color:var(--cream);transition:transform .12s;font-size:.7rem;line-height:1.3}
.animal-card:active{transform:scale(.9)}
.animal-card .emoji{font-size:1.8rem;display:block;margin-bottom:4px}
.animal-card .label{font-size:.65rem;opacity:.6}
.animal-card.selected{background:rgba(255,215,0,.15);border:2px solid var(--gold)}
.btn{padding:12px 24px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.9rem;transition:transform .12s;display:inline-block}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.offline-mission{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25);border-radius:14px;padding:12px 14px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.offline-mission .emoji{font-size:1.5rem;flex-shrink:0}
.offline-mission .title{font-family:var(--font-h);font-size:.75rem;color:var(--green);margin-bottom:2px}
.offline-mission .text{font-size:.78rem;color:rgba(255,255,255,.7);line-height:1.5}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s ease}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.panel-missions{font-size:.73rem;color:#666;margin-top:3px}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
.symbol-canvas{background:#1a1a2e;border-radius:12px;border:2px solid rgba(255,255,255,.1);touch-action:none;cursor:crosshair;width:100%;max-width:360px;height:160px;display:block;margin:0 auto}
.symbol-tools{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.symbol-btn{padding:8px 14px;border-radius:10px;border:none;cursor:pointer;font-size:.85rem;font-family:var(--font-b);font-weight:600;background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.particle-area{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 0}
.particle{width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border:none;transition:transform .15s}
.particle:active{transform:scale(.85)}
.particle.selected{box-shadow:0 0 0 3px var(--gold);transform:scale(1.1)}
.chain-area{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 0}
.chain-item{padding:10px 14px;border-radius:14px;text-align:center;font-size:.8rem;cursor:pointer;border:none;transition:transform .15s;background:rgba(255,255,255,.07)}
.chain-item:active{transform:scale(.93)}
.chain-arrow{font-size:1.2rem;opacity:.4}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="top-bar">
    <div></div>
    <div style="font-family:var(--font-h);color:var(--gold);font-size:.9rem;">Lima Pelajaran Besar</div>
    <button class="top-btn" onclick="toggleParent()">👤</button>
  </div>
  <div class="hero">
    <div style="font-size:3rem;margin-bottom:6px;">🐰</div>
    <div class="hero-title">Kita Semua Terhubung</div>
    <div class="hero-sub">Lima Pelajaran Besar</div>
  </div>
  <div class="lesson-grid" id="lesson-grid"></div>
</div>

<!-- LESSON -->
<div class="screen" id="screen-lesson">
  <div class="lesson-header">
    <button class="lesson-back" onclick="showScreen('home')">← Kembali</button>
    <div class="lesson-title-bar" id="lesson-title-bar"></div>
  </div>
  <div class="exp-grid" id="exp-grid"></div>
</div>

<!-- EXPERIENCE -->
<div class="screen" id="screen-exp">
  <div class="exp-header">
    <button class="lesson-back" onclick="goBack()">← Kembali</button>
    <div class="exp-title" id="exp-title"></div>
    <div class="exp-prompt" id="exp-prompt"></div>
  </div>
  <div class="exp-area" id="exp-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<!-- Parent Panel -->
<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Progress Belajar</div>
  <div id="parent-content"></div>
</div>

<!-- Confetti -->
<div class="confetti-container" id="confetti-container"></div>

<script>
const LESSONS=[
  {id:'universe',emoji:'✨',title:'Alam Semesta',desc:'Partikel, gravitasi, tata surya, dan Bumi',missions:['Buat awan dari kapas!','Gambar planet!','Jatuhkan pensil dan lihat gravitasi!'],exps:[
    {id:'particles',name:'Partikel Tersebar',tagline:'Semua terbuat dari partikel kecil',type:'particles'},
    {id:'gravity',name:'Gravitasi',tagline:'Benda jatuh ke bawah, bukan ke atas',type:'gravity'},
    {id:'solar',name:'Tata Surya',tagline:'Bumi mengelilingi Matahari',type:'solar'},
    {id:'earth',name:'Sejarah Bumi',tagline:'4.5 miliar tahun dalam sekejap',type:'earth'},
    {id:'water',name:'Air dan Erosi',tagline:'Air membentuk bumi selama jutaan tahun',type:'water'},
  ]},
  {id:'life',emoji:'🌱',title:'Kehidupan',desc:'Hidup, kebutuhan tanaman, dan klasifikasi',missions:['Tanam kacang!','Amati semut!','Bandingkan 2 daun!'],exps:[
    {id:'alive',name:'Apa Itu Hidup?',tagline:'Bergerak, makan, tumbuh',type:'alive'},
    {id:'plant',name:'Kebutuhan Tanaman',tagline:'Air, cahaya, udara',type:'plant'},
    {id:'timeline',name:'Garis Kehidupan',tagline:'Dari sel pertama ke sekarang',type:'timeline'},
    {id:'classify',name:'Klasifikasi',tagline:'Kumpulkan dan kelompokkan',type:'classify'},
    {id:'foodchain',name:'Rantai Makanan',tagline:'Energi mengalir dari Matahari',type:'foodchain'},
  ]},
  {id:'humans',emoji:'🧒',title:'Manusia',desc:'Kebutuhan dasar, tempat tinggal, dan kerja sama',missions:['Gambar rumahmu!','Coba masak dengan satu tangan!','Hitung teman sekelas!'],exps:[
    {id:'needs',name:'Kebutuhan Manusia',tagline:'Makan, minum, tempat tinggal, teman',type:'needs'},
    {id:'shelter',name:'Tempat Tinggal',tagline:'Dari gua ke rumah pintar',type:'shelter'},
    {id:'tools',name:'Alat dan Teknologi',tagline:'Tangan, alat, mesin',type:'tools'},
    {id:'cooperate',name:'Kerja Sama',tagline:'Bersama lebih baik',type:'cooperate'},
  ]},
  {id:'language',emoji:'✍️',title:'Komunikasi',desc:'Simbol, tulisan, dan pesan',missions:['Tulis namamu!','Kirim pesan rahasia ke teman!','Bicara tanpa kata!'],exps:[
    {id:'symbols',name:'Simbol dan Tanda',tagline:'Gambar, simbol, huruf',type:'symbols'},
    {id:'encoding',name:'Menyandikan Pesan',tagline:'Kirim pesan pakai kode!',type:'encoding'},
    {id:'messages',name:'Rantai Pesan',tagline:'Dari otak ke otak dalam detik',type:'messages'},
  ]},
  {id:'numbers',emoji:'🔢',title:'Angka',desc:'Angka, pola, dan matematika',missions:['Hitung langkah dari kamar ke dapur!','Buat pola dari balok!','Bagikan 6 permen ke 2 orang!'],exps:[
    {id:'counting',name:'Menghitung Benda',tagline:'Satukan angka dan jumlah',type:'counting'},
    {id:'skipcount',name:'Loncat Berhitung',tagline:'2, 4, 6, 8... loncat kelipatan!',type:'skipcount'},
    {id:'decimal',name:'Angka dan Nol',tagline:'Nol mengubah segalanya!',type:'decimal'},
  ]},
];

let state={currentLesson:null,currentExp:null,history:['home'],progress:{},profile:{}};

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function initState(){
  state.progress=lsGet('fgl-progress',{});
  state.profile=lsGet('fgl-profile',{name:'',avatar:'🐰'});
}

function genStars(){
  const el=document.getElementById('stars');
  el.innerHTML='';
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(Math.random()*2+2).toFixed(1)}s`;
    el.appendChild(s);
  }
}

function markDone(expId){
  if(!state.progress[expId]){
    state.progress[expId]=true;
    lsSet('fgl-progress',state.progress);
    const lesson=LESSONS.find(l=>l.exps.some(e=>e.id===expId));
    if(lesson&&lesson.exps.every(e=>state.progress[e.id])){
      state.progress[lesson.id]=true;
      lsSet('fgl-progress',state.progress);
    }
    confetti();
    say('Hebat! Kamu sudah selesai.');
  }
}

function isDone(id){return !!state.progress[id]}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+name);
  if(el)el.classList.add('active');
  if(name!=='home')state.history.push(name);
  if(name==='home')state.history=['home'];
  if(name==='home')closeParent();
}

function goBack(){
  if(state.history.length>1)state.history.pop();
  showScreen(state.history[state.history.length-1]||'home');
}

function renderHome(){
  const grid=document.getElementById('lesson-grid');
  grid.innerHTML='';
  LESSONS.forEach((l,i)=>{
    const done=!!state.progress[l.id];
    const doneCount=l.exps.filter(e=>isDone(e.id)).length;
    const card=document.createElement('button');
    card.className='lesson-card';
    card.onclick=()=>openLesson(l);
    card.innerHTML=`
      <div class="lesson-icon">${l.emoji}</div>
      <div>
        <div class="lesson-name">${l.title}</div>
        <div class="lesson-desc">${l.desc}</div>
        <div style="font-size:.7rem;opacity:.4;margin-top:4px;">${doneCount}/${l.exps.length} aktivitas</div>
      </div>
      <div class="lesson-badge ${done?'done':''}">${done?'✓':(i+1)}</div>
    `;
    grid.appendChild(card);
  });
}

function openLesson(lesson){
  state.currentLesson=lesson;
  document.getElementById('lesson-title-bar').textContent=lesson.emoji+' '+lesson.title;
  const grid=document.getElementById('exp-grid');
  grid.innerHTML='';
  lesson.exps.forEach((e,i)=>{
    const done=isDone(e.id);
    const card=document.createElement('button');
    card.className='exp-card'+(done?' done':'');
    card.onclick=()=>openExp(e,lesson);
    card.innerHTML=`<div class="exp-num">${done?'✓':(i+1)}</div><div><div class="exp-name">${e.name}</div><div class="exp-tagline">${e.tagline}</div></div>`;
    grid.appendChild(card);
  });
  const missDiv=document.createElement('div');
  missDiv.className='offline-mission';
  missDiv.innerHTML=`<div class="emoji">🌍</div><div><div class="title">Misi di Dunia Nyata</div><div class="text">${lesson.missions.map(m=>'• '+m).join('<br>')}</div></div>`;
  grid.appendChild(missDiv);
  showScreen('lesson');
}

function openExp(exp,lesson){
  state.currentExp=exp;
  state.currentLesson=lesson;
  document.getElementById('exp-title').textContent=lesson.emoji+' '+exp.name;
  document.getElementById('exp-prompt').textContent=exp.tagline;
  const area=document.getElementById('exp-area');
  area.innerHTML='';
  switch(exp.type){
    case'particles':renderParticles(area);break;
    case'gravity':renderGravity(area);break;
    case'solar':renderSolar(area);break;
    case'earth':renderEarth(area);break;
    case'water':renderWater(area);break;
    case'alive':renderAlive(area);break;
    case'plant':renderPlant(area);break;
    case'timeline':renderTimeline(area);break;
    case'classify':renderClassify(area);break;
    case'foodchain':renderFoodChain(area);break;
    case'needs':renderNeeds(area);break;
    case'shelter':renderShelter(area);break;
    case'tools':renderTools(area);break;
    case'cooperate':renderCooperate(area);break;
    case'symbols':renderSymbols(area);break;
    case'encoding':renderEncoding(area);break;
    case'messages':renderMessages(area);break;
    case'counting':renderCounting(area);break;
    case'skipcount':renderSkipCount(area);break;
    case'decimal':renderDecimal(area);break;
    default:area.innerHTML='<div class="demo-box"><div style="font-size:2rem;">🔭</div><div>Segera hadir!</div></div>';
  }
  showScreen('exp');
}

// ── PARTICLES ──
function renderParticles(area){
  const types=[
    {label:'Air',color:'#42A5F5',icon:'💧',fact:'Air: partikel sangat rapat, mengalir dan mengisi ruang'},
    {label:'Batu',color:'#78909C',icon:'🪨',fact:'Batu: partikel sangat rapat, tidak bisa ditekan'},
    {label:'Logam',color:'#FFB300',icon:'🔩',fact:'Logam: partikel rapat dan bisa menghantarkan panas'},
    {label:'Uap',color:'#90CAF9',icon:'🌫️',fact:'Uap: partikel berjauhan, bergerak cepat'},
    {label:'Cahaya',color:'#FFF176',icon:'💡',fact:'Cahaya: partikel energi tanpa massa, bergerak sangat cepat'},
    {label:'Suara',color:'#CE93D8',icon:'🔊',fact:'Suara: getaran partikel, butuh medium untuk jalan'},
  ];
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Pilih partikel dan amati!</div>
      <div class="particle-area">
        ${types.map((t,i)=>`<button class="particle" id="p${i}" style="background:${t.color}" onclick="selectParticle(${i})">${t.icon}</button>`).join('')}
      </div>
      <div class="exp-instruction" id="particle-fact" style="display:none;"></div>
    </div>

function renderSolar(area){
  const planets=[
    {name:'Merkurius',emoji:'⚫',orbit:55,speed:3,fact:'Planet terkecil, sangat panas siang dan sangat dingin malam'},
    {name:'Venus',emoji:'🟡',orbit:80,speed:5,fact:'Planet terpanas, atmosfer tebal'},

    {name:'Jupiter',emoji:'🟤',orbit:175,speed:20,fact:'Planet terbesar, muat 1300 Bumi di dalamnya!'},
    {name:'Saturnus',emoji:'🥔',orbit:210,speed:30,fact:'Terkenal dengan cincinnya yang cantik'},
  ];

  let angles=planets.map(()=>Math.random()*Math.PI*2);
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Sentuh planet untuk fakta!</div>
      <div style="position:relative;width:260px;height:260px;margin:10px auto;" id="solar-orbits">

        ${planets.map((p,i)=>`<div style="position:absolute;left:50%;top:50%;width:${p.orbit*2}px;height:${p.orbit*2}px;margin:${-p.orbit}px 0 0 ${-p.orbit}px;border-radius:50%;border:1px solid rgba(255,255,255,.06);pointer-events:none;"></div>`).join('')}
        ${planets.map((p,i)=>`<div id="planet-${i}" style="position:absolute;left:50%;top:50%;width:24px;height:24px;margin:${-12}px 0 0 ${-12}px;font-size:1.1rem;cursor:pointer;border-radius:50%;transition:transform .3s;" onclick="showPlanetFact(${i})">${p.emoji}</div>`).join('')}
      </div>
      <div class="exp-instruction" id="planet-fact">Sentuh planet untuk tahu fakta menarik!</div>
    </div>
    <button class="btn btn-primary" onclick="markDone('solar');say('Tata surya kita luar biasa!')" style="width:100%;max-width:320px;display:block;margin:12px auto;">✅ Paham!</button>
  `;
  window._planetFacts=planets.map(p=>p.fact);
  if(!reduced){
    const iv=setInterval(()=>{
      angles=angles.map((a,i)=>{
        const p=planets[i];
        const x=Math.cos(a)*p.orbit;
        const y=Math.sin(a)*p.orbit;
        const el=document.getElementById('planet-'+i);
        if(el)el.style.transform=`translate(${x}px,${y}px)`;
        return a+(.02*p.speed/10);
      });
    },80);
    state._solarTimer=iv;
  } else {
    angles.forEach((a,i)=>{
      const p=planets[i];
      const x=Math.cos(a)*p.orbit;
      const y=Math.sin(a)*p.orbit;
      const el=document.getElementById('planet-'+i);
      if(el)el.style.transform=`translate(${x}px,${y}px)`;
    });
  }
}
function showPlanetFact(i){
  const el=document.getElementById('planet-fact');
  if(el)el.textContent=window._planetFacts[i];

        <div style="background:rgba(255,255,255,.07);border-radius:12px;padding:14px;text-align:center;"><div style="font-size:1.5rem;">𒀕</div><div style="font-size:.7rem;opacity:.5;">Simbol</div></div>

      </div>
      <canvas class="symbol-canvas" id="symbol-canvas"></canvas>
      <div class="symbol-tools"><button class="symbol-btn" onclick="clearCanvas()">🗑️ Hapus</button></div>
    </div>
    <button class="btn btn-primary" onclick="markDone('symbols');say('Kamu sudah belajar sejarah tulisan!')" style="width:100%;max-width:320px;display:block;margin:12px auto;">✅ Paham!</button>
  `;
  initCanvas();

function initCanvas(){
  const canvas=document.getElementById('symbol-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;canvas.height=160;
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false,lastX=0,lastY=0;
  function getPos(e){const r=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:src.clientX-r.left,y:src.clientY-r.top};}
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();lastX=p.x;lastY=p.y;});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();lastX=p.x;lastY=p.y;},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}
function clearCanvas(){
  const canvas=document.getElementById('symbol-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,canvas.width,canvas.height);
}

function say(text){
  const b=document.getElementById('rabbity-bubble');
  if(b){b.textContent='🐰 '+text;b.classList.add('show');}
  if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u);}
  setTimeout(()=>{if(b)b.classList.remove('show')},3500);
}

// ── CONFETTI ──
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti-container');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#EF5350','#66BB6A','#42A5F5','#AB47BC','#FF9800'];
  for(let i=0;i<35;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(p);}
  setTimeout(()=>c.innerHTML='',3500);
}

// ── PARENT PANEL ──
function toggleParent(){
  const p=document.getElementById('parent-panel');
  if(!p)return;
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderParentPanel();
}
function closeParent(){
  const p=document.getElementById('parent-panel');
  if(p)p.classList.remove('open');
}
function renderParentPanel(){
  const c=document.getElementById('parent-content');
  if(!c)return;
  c.innerHTML='';
  LESSONS.forEach(l=>{
    const done=l.exps.filter(e=>isDone(e.id)).length;
    const total=l.exps.length;
    const pct=Math.round((done/total)*100);
    const color=['#FFD700','#4CAF50','#42A5F5','#AB47BC','#FF9800'][LESSONS.indexOf(l)%5];
    const missions=l.missions.slice(0,2).map(m=>'• '+m).join('<br>');
    c.innerHTML+=`<div class="panel-row"><div class="panel-row-label">${l.emoji} ${l.title} <span>${pct}%</span></div><div class="panel-bar"><div class="panel-bar-fill" style="width:${pct}%;background:${color};"></div></div><div class="panel-missions">${done}/${total} aktivitas<br><span style="font-size:.7rem">${missions}</span></div></div>`;
  });
}
