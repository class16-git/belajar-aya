<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Five Great Lessons — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;--purple:#7C4DFF;--cream:#FFF8F0;--shadow:0 4px 24px rgba(0,0,0,.35);--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 20px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.8rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.82rem;opacity:.5}
.lesson-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px 100px;position:relative;z-index:1}
.lesson-card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s;font-family:var(--font-b)}
.lesson-card:active{transform:scale(.97)}
.lesson-icon{font-size:2.5rem;flex-shrink:0}
.lesson-name{font-family:var(--font-h);font-size:1.1rem;margin-bottom:2px}
.lesson-desc{font-size:.78rem;opacity:.5;line-height:1.3}
.lesson-badge{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.lesson-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.exp-grid{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.exp-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;cursor:pointer;border:none;color:var(--cream);width:100%;text-align:left;font-family:var(--font-b);transition:all .2s}
.exp-card:active{transform:scale(.97);background:rgba(255,255,255,.12)}
.exp-card.done{border-color:var(--green)}
.exp-num{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:.9rem;flex-shrink:0}
.exp-card.done .exp-num{background:var(--green);border-color:var(--green);color:#fff}
.exp-name{font-weight:700;font-size:.9rem}
.exp-tagline{font-size:.75rem;opacity:.5}
.exp-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.exp-header{padding:12px 16px 8px;position:relative;z-index:1}
.exp-title{font-family:var(--font-h);font-size:1.2rem;color:var(--gold);text-align:center;margin-bottom:4px}
.exp-prompt{font-size:.85rem;opacity:.7;text-align:center;margin-bottom:14px;padding:0 16px}
.instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;margin:12px 0;font-size:.85rem;line-height:1.6;text-align:center;border:1px solid rgba(255,255,255,.08)}
.demo-box{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:10px 0}
.demo-label{font-size:.78rem;opacity:.5;margin-bottom:8px}
.btn{padding:12px 24px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s;display:inline-block}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.lesson-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;width:fit-content}
.lesson-back:active{transform:scale(.95)}
.particle-area{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:16px 0}
.particle{width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.4rem;border:none;transition:transform .2s;flex-shrink:0}
.particle:active{transform:scale(.85)}
.particle.selected{box-shadow:0 0 0 4px var(--gold);transform:scale(1.1)}
.fact-box{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25);border-radius:14px;padding:14px 16px;margin:10px 0;font-size:.85rem;text-align:center;display:none;line-height:1.6}
.fact-box.show{display:block}
.animal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 0}
.animal-card{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;border:none;color:var(--cream);font-family:var(--font-b);transition:transform .15s}
.animal-card:active{transform:scale(.9)}
.animal-card .emoji{font-size:1.8rem;display:block;margin-bottom:4px}
.animal-card .label{font-size:.65rem;opacity:.6}
.animal-card.selected{background:rgba(255,215,0,.15);border:2px solid var(--gold)}
.animal-card.correct{background:rgba(76,175,80,.2);border:2px solid var(--green)}
.animal-card.wrong{background:rgba(239,83,80,.2);border:2px solid #EF5350}
.food-chain{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:16px 0}
.chain-item{padding:12px 16px;border-radius:14px;text-align:center;font-size:.8rem;cursor:pointer;border:none;font-family:var(--font-b);color:var(--cream);transition:all .2s;min-width:80px}
.chain-item:active{transform:scale(.93)}
.chain-item.done{opacity:.4;cursor:default}
.chain-arrow{font-size:1.4rem;opacity:.4}
.mission-card{background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.25);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer}
.mission-card:active{transform:scale(.98)}
.mission-card .emoji{font-size:1.5rem;margin-bottom:6px}
.mission-card .title{font-family:var(--font-h);font-size:.85rem;color:var(--green);margin-bottom:4px}
.mission-card .text{font-size:.78rem;color:rgba(255,255,255,.7);line-height:1.5}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="screen active" id="screen-home">
  <div class="top-bar">
    <a href="index.html" class="top-btn">←</a>
    <div class="top-title">Five Great Lessons</div>
    <div style="width:44px"></div>
  </div>
  <div class="hero">
    <div style="font-size:2.5rem;margin-bottom:4px;">🌍</div>
    <div class="hero-title">We Are All Connected</div>
    <div class="hero-sub">Five Great Lessons — explore the universe</div>
  </div>
  <div class="lesson-grid" id="lesson-grid"></div>
</div>

<div class="screen" id="screen-lessons">
  <div class="exp-header">
    <button class="lesson-back" onclick="goBack()">← Back</button>
    <div class="exp-title" id="lesson-title"></div>
    <div class="exp-prompt" id="lesson-prompt"></div>
  </div>
  <div class="exp-grid" id="exp-grid"></div>
</div>

<div class="screen" id="screen-exp">
  <div class="exp-header">
    <button class="lesson-back" onclick="goBack()">← Back</button>
    <div class="exp-title" id="exp-title"></div>
    <div class="exp-prompt" id="exp-prompt"></div>
  </div>
  <div class="exp-area" id="exp-area"></div>
</div>

<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Learning Progress</div>
  <div id="parent-content"></div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
var LESSONS = [
  {
    id: "universe", emoji: "✨", title: "The Universe",
    desc: "Particles, gravity, solar system, and Earth",
    missions: ["Make a cloud from cotton!", "Drop a pencil and see gravity in action!", "Name the planets!"],
    exps: [
      { id: "particles", name: "Particles Spread", tagline: "Everything is made of tiny particles", type: "particles" },
      { id: "gravity", name: "Gravity", tagline: "Things fall down, not up", type: "gravity" },
      { id: "solar", name: "Solar System", tagline: "Earth orbits the Sun", type: "solar" },
      { id: "earth", name: "Earth History", tagline: "4.5 billion years in a flash", type: "earth" },
      { id: "water", name: "Water and Erosion", tagline: "Water shapes Earth over millions of years", type: "water" }
    ]
  },
  {
    id: "life", emoji: "🌱", title: "Life",
    desc: "Living things, plant needs, and classification",
    missions: ["Plant a bean seed!", "Watch ants outside!", "Compare 2 different leaves!"],
    exps: [
      { id: "alive", name: "What is Alive?", tagline: "Moves, eats, grows", type: "alive" },
      { id: "plant", name: "Plant Needs", tagline: "Air, light, and water", type: "plant" },
      { id: "timeline", name: "Timeline of Life", tagline: "From the first cell to now", type: "timeline" },
      { id: "classify", name: "Classification", tagline: "Collect and classify", type: "classify" },
      { id: "foodchain", name: "Food Chain", tagline: "Energy flows from the Sun", type: "foodchain" }
    ]
  },
  {
    id: "humans", emoji: "🧒", title: "Humans",
    desc: "Basic needs, shelter, and cooperation",
    missions: ["Draw your home!", "Try cooking using only one hand!", "Count your classmates!"],
    exps: [
      { id: "needs", name: "Human Needs", tagline: "Food, water, shelter, friends", type: "needs" },
      { id: "shelter", name: "Shelter", tagline: "From caves to smart homes", type: "shelter" },
      { id: "tools", name: "Tools and Technology", tagline: "Hands, tools, and machines", type: "tools" },
      { id: "cooperate", name: "Working Together", tagline: "Together is better", type: "cooperate" }
    ]
  },
  {
    id: "language", emoji: "✍️", title: "Communication",
    desc: "Symbols, writing, and messages",
    missions: ["Write your name!", "Send a secret message to a friend!", "Talk without words!"],
    exps: [
      { id: "symbols", name: "Symbols and Signs", tagline: "Pictures, symbols, letters", type: "symbols" },
      { id: "encoding", name: "Encoding Messages", tagline: "Send secret messages with codes!", type: "encoding" },
      { id: "messages", name: "Message Chain", tagline: "From brain to brain in seconds", type: "messages" }
    ]
  },
  {
    id: "numbers", emoji: "🔢", title: "Numbers",
    desc: "Numbers, patterns, and mathematics",
    missions: ["Count steps to the kitchen!", "Make a pattern with blocks!", "Share 6 candies with 2 friends!"],
    exps: [
      { id: "counting", name: "Counting Objects", tagline: "Match numbers to amounts", type: "counting" },
      { id: "skipcount", name: "Skip Counting", tagline: "2, 4, 6, 8 — skipping in multiples!", type: "skipcount" },
      { id: "decimal", name: "Numbers and Zero", tagline: "Zero changes everything!", type: "decimal" }
    ]
  }
];

var state = { currentLesson: null, currentExp: null, history: ["home"], progress: {} };

function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

function init() {
  state.progress = lsGet("fgl-progress", {});
  genStars();
  renderLessonSelect();
  setTimeout(function() { say("Let's explore the universe!"); }, 800);
}

function genStars() {
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for (var i = 0; i < 60; i++) {
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random() * 2 + 1;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + sz + "px;animation-delay:" + (Math.random() * 3).toFixed(1) + "s;animation-duration:" + (Math.random() * 2 + 2).toFixed(1) + "s";
    el.appendChild(s);
  }
}

function isDone(id) { return !!state.progress[id]; }

function markDone(id) {
  if (!state.progress[id]) {
    state.progress[id] = true;
    lsSet("fgl-progress", state.progress);
    confetti();
    say("You really know this! Amazing!");
  }
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  var el = document.getElementById("screen-" + name);
  if (el) el.classList.add("active");
  if (name !== "home") state.history.push(name);
  if (name === "home") { state.history = ["home"]; closeParent(); }
}

function goBack() {
  if (state.history.length > 1) state.history.pop();
  showScreen(state.history[state.history.length - 1] || "home");
}

function renderLessonSelect() {
  var grid = document.getElementById("lesson-grid");
  grid.innerHTML = "";
  LESSONS.forEach(function(l, i) {
    var doneCount = l.exps.filter(function(e) { return isDone(l.id + "-" + e.id); }).length;
    var allDone = doneCount === l.exps.length;
    var card = document.createElement("button");
    card.className = "lesson-card";
    card.onclick = function() { openLesson(l); };
    card.innerHTML = '<div class="lesson-icon">' + l.emoji + '</div><div><div class="lesson-name">' + l.title + '</div><div class="lesson-desc">' + l.desc + '</div><div style="font-size:.7rem;opacity:.4;margin-top:4px;">' + doneCount + '/' + l.exps.length + ' done</div></div><div class="lesson-badge ' + (allDone ? "done" : "") + '">' + (allDone ? "✓" : (i + 1)) + '</div>';
    grid.appendChild(card);
  });
}

function openLesson(l) {
  state.currentLesson = l;
  document.getElementById("lesson-title").textContent = l.emoji + " " + l.title;
  document.getElementById("lesson-prompt").textContent = l.desc;
  var grid = document.getElementById("exp-grid");
  grid.innerHTML = "";
  l.exps.forEach(function(e, i) {
    var done = isDone(l.id + "-" + e.id);
    var card = document.createElement("button");
    card.className = "exp-card" + (done ? " done" : "");
    card.onclick = function() { openExp(l, e); };
    card.innerHTML = '<div class="exp-num">' + (done ? "✓" : (i + 1)) + '</div><div class="exp-name">' + e.name + '</div><div class="exp-tagline">' + e.tagline + '</div>';
    grid.appendChild(card);
  });
  // Missions
  if (l.missions && l.missions.length > 0) {
    var missDiv = document.createElement("div");
    missDiv.className = "mission-card";
    missDiv.innerHTML = '<div class="emoji">🌍</div><div class="title">Real World Mission</div>';
    l.missions.forEach(function(m) {
      missDiv.innerHTML += '<div class="text">• ' + m + '</div>';
    });
    grid.appendChild(missDiv);
  }
  showScreen("lessons");
}

function openExp(l, e) {
  state.currentExp = e;
  document.getElementById("exp-title").textContent = e.name;
  document.getElementById("exp-prompt").textContent = e.tagline;
  var area = document.getElementById("exp-area");
  area.innerHTML = "";
  switch (e.type) {
    case "particles": renderParticles(area, l, e); break;
    case "gravity": renderGravity(area, l, e); break;
    case "solar": renderSolar(area, l, e); break;
    case "earth": renderEarth(area, l, e); break;
    case "water": renderWater(area, l, e); break;
    case "alive": renderAlive(area, l, e); break;
    case "plant": renderPlant(area, l, e); break;
    case "timeline": renderTimeline(area, l, e); break;
    case "classify": renderClassify(area, l, e); break;
    case "foodchain": renderFoodChain(area, l, e); break;
    default: area.innerHTML = '<div class="instruction">Explore and learn!</div><button class="btn btn-primary" onclick="markDoneExp()">I understand!</button>';
  }
  showScreen("exp");
}

function markDoneExp() {
  var l = state.currentLesson, e = state.currentExp;
  if (l && e) {
    markDone(l.id + "-" + e.id);
    setTimeout(function() { goBack(); }, 1500);
  }
}

// PARTICLES
function renderParticles(area, l, e) {
  var types = [
    { label: "Air", color: "#42A5F5", icon: "💧", fact: "Air: particles are far apart, they flow and fill any space" },
    { label: "Stone", color: "#78909C", icon: "🪨", fact: "Stone: particles are packed tight, cannot be squished" },
    { label: "Metal", color: "#FFB300", icon: "🔩", fact: "Metal: particles are packed and conduct heat well" },
    { label: "Steam", color: "#90CAF9", icon: "🌫️", fact: "Steam: particles are far apart, moving fast" },
    { label: "Light", color: "#FFF176", icon: "💡", fact: "Light: energy particles with no mass, move very fast" },
    { label: "Sound", color: "#CE93D8", icon: "🔊", fact: "Sound: vibration of particles, needs a medium to travel" }
  ];
  area.innerHTML = '<div class="instruction">Tap each particle type to learn about it!</div><div class="particle-area" id="particle-area"></div><div class="fact-box" id="fact-box"></div><button class="btn btn-primary" onclick="if(state.selectedParticle!==undefined){markDoneExp()}else{say(\'Tap a particle first!\')}">I understand!</button>';
  var par = document.getElementById("particle-area");
  types.forEach(function(t, i) {
    var btn = document.createElement("button");
    btn.className = "particle";
    btn.style.background = t.color + "33";
    btn.style.border = "2px solid " + t.color;
    btn.textContent = t.icon;
    btn.dataset.idx = i;
    btn.onclick = function() {
      document.querySelectorAll(".particle").forEach(function(p) { p.classList.remove("selected"); });
      btn.classList.add("selected");
      state.selectedParticle = i;
      var fb = document.getElementById("fact-box");
      if (fb) { fb.textContent = t.fact; fb.classList.add("show"); }
      say(t.fact.substring(0, 80));
    };
    par.appendChild(btn);
  });
}

// GRAVITY
function renderGravity(area, l, e) {
  area.innerHTML = '<div class="instruction">Tap the ball to drop it — gravity pulls everything down!</div><div class="demo-box"><div class="demo-label">Tap the ball to drop it!</div><div id="drop-area" style="height:180px;position:relative;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;"><div id="gravity-ball" style="font-size:3.5rem;cursor:pointer;transition:transform .5s ease-in;display:inline-block;user-select:none;" onclick="dropBall()">⚽</div></div></div><button class="btn btn-primary" onclick="if(state.dropped){markDoneExp()}else{say(\'Tap the ball first!\')}">I understand!</button>';
  state.dropped = false;
}

function dropBall() {
  var ball = document.getElementById("gravity-ball");
  if (!ball || state.dropped) return;
  state.dropped = true;
  ball.style.transform = "translateY(120px)";
  ball.style.transition = "transform 0.6s ease-in";
  var msg = ball.parentElement.parentElement.querySelector(".instruction");
  if (msg) msg.textContent = "Gravity pulled the ball down! Everything falls toward Earth!";
  setTimeout(function() { say("Gravity pulls everything toward Earth!"); }, 600);
}

// SOLAR SYSTEM
function renderSolar(area, l, e) {
  var planets = [
    { name: "Mercury", emoji: "⚫", orbit: 55, speed: 3, fact: "Smallest planet, very hot during day, very cold at night" },
    { name: "Venus", emoji: "🟡", orbit: 80, speed: 5, fact: "Hottest planet, thick atmosphere traps heat" },
    { name: "Earth", emoji: "🔵", orbit: 110, speed: 8, fact: "Only planet known to have life" },
    { name: "Mars", emoji: "🔴", orbit: 140, speed: 13, fact: "Red planet, humans might live here someday" },
    { name: "Jupiter", emoji: "🟤", orbit: 175, speed: 20, fact: "Largest planet, could fit 1300 Earths inside!" },
    { name: "Saturn", emoji: "🥔", orbit: 210, speed: 30, fact: "Famous for its beautiful rings" }
  ];
  area.innerHTML = '<div class="instruction">Tap a planet to learn about it!</div><div class="demo-box"><div class="demo-label">Our Solar System</div><div id="solar-area" style="height:220px;position:relative;display:flex;align-items:center;justify-content:center;"><div style="width:24px;height:24px;background:#FFD700;border-radius:50%;position:absolute;"></div></div></div><div class="fact-box" id="solar-fact"></div>';
  var solar = document.getElementById("solar-area");
  planets.forEach(function(p, i) {
    (function(idx, planet) {
      var el = document.createElement("div");
      el.textContent = planet.emoji;
      el.style.cssText = "position:absolute;left:50%;top:50%;font-size:1.2rem;cursor:pointer;transform:translate(-50%,-50%);z-index:2";
      el.onclick = function() {
        var fb = document.getElementById("solar-fact");
        if (fb) { fb.textContent = planet.name + ": " + planet.fact; fb.classList.add("show"); }
        say(planet.name + ": " + planet.fact.substring(0, 80));
        markDoneExp();
      };
      solar.appendChild(el);
      // Animate orbit
      var angle = (i / planets.length) * Math.PI * 2;
      var centerX = solar.offsetWidth / 2;
      var centerY = solar.offsetHeight / 2;
      function move() {
        angle += 0.005 * planet.speed;
        var x = centerX + Math.cos(angle) * planet.orbit - 10;
        var y = centerY + Math.sin(angle) * planet.orbit * 0.4 - 10;
        el.style.left = x + "px";
        el.style.top = y + "px";
        requestAnimationFrame(move);
      }
      setTimeout(move, i * 200);
    })(i, p);
  });
}

// ENCODING
function renderEncoding(area, l, e) {
  area.innerHTML = '<div class="instruction">Send a secret message using a code!</div><div class="demo-box"><div class="demo-label">Tap letters to spell the secret word: CAT</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 0;" id="encode-pool"></div><div style="display:flex;gap:8px;justify-content:center;padding:10px 0;" id="encode-slots"></div></div>';
  var pool = document.getElementById("encode-pool");
  var slots = document.getElementById("encode-slots");
  var letters = ["C", "A", "T", "B", "D", "E", "O"];
  var secret = ["C", "A", "T"];
  state.encodeSlots = [];
  letters.forEach(function(letter) {
    var btn = document.createElement("button");
    btn.textContent = letter;
    btn.style.cssText = "width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);color:#fff;font-family:var(--font-h);font-size:1.2rem;cursor:pointer";
    btn.onclick = function() {
      if (state.encodeSlots.length < 3) {
        btn.style.opacity = "0.3";
        state.encodeSlots.push(letter);
        var slot = document.createElement("button");
        slot.textContent = letter;
        slot.style.cssText = "width:48px;height:48px;border-radius:10px;background:rgba(76,175,80,.2);border:2px solid #4CAF50;color:#fff;font-family:var(--font-h);font-size:1.2rem;cursor:pointer";
        slot.onclick = function() {
          btn.style.opacity = "1";
          state.encodeSlots = state.encodeSlots.filter(function(x) { return x !== letter; });
          slot.remove();
        };
        slots.appendChild(slot);
        if (state.encodeSlots.length === 3) {
          var correct = state.encodeSlots[0] === "C" && state.encodeSlots[1] === "A" && state.encodeSlots[2] === "T";
          if (correct) {
            say("You decoded the message! CAT!");
            markDoneExp();
          } else {
            say("Not quite! Try again!");
            slots.innerHTML = "";
            state.encodeSlots = [];
            document.querySelectorAll("#encode-pool button").forEach(function(b) { b.style.opacity = "1"; });
          }
        }
      }
    };
    pool.appendChild(btn);
  });
}

  area.innerHTML = '<div class="instruction">Everything in the universe can be counted and measured with numbers!</div><div class="demo-box"><div class="demo-label">Count the stars!</div><div style="font-size:4rem;margin:10px 0;">⭐⭐⭐</div><div style="font-size:2rem;margin:8px 0;">= 3 stars</div></div><button class="btn btn-primary" onclick="markDoneExp();say(\"Numbers help us understand the world!\")">Numbers are everywhere!</button>';
}

// SKIP COUNTING
function renderSkipCounting(area, l, e) {
  area.innerHTML = '<div class="instruction">Skip counting: 2, 4, 6, 8, 10 — we skip numbers as we count!</div><div class="demo-box"><div class="demo-label">Count by 2s!</div><div style="font-size:1.8rem;margin:10px 0;font-family:var(--font-h);color:var(--gold);">2 — 4 — 6 — 8 — 10</div></div><button class="btn btn-primary" onclick="markDoneExp();say(\"Skip counting is like jumping on a number line!\")">I can skip count!</button>';
}

// ZERO
function renderZero(area, l, e) {
  area.innerHTML = '<div class="instruction">Zero is a powerful idea — it means NOTHING. But it changes everything in math!</div><div class="demo-box"><div class="demo-label">Without zero, we could not write the number 10!</div><div style="font-size:2rem;margin:10px 0;font-family:var(--font-h);">1 → 10 = 1 and 0</div></div><button class="btn btn-primary" onclick="markDoneExp();say(\"Zero changed the history of mathematics!\")">Zero is amazing!</button>';
}

// TALK without words
function renderMessages(area, l, e) {
  var expressions = ["😊", "😢", "😠", "😮", "🥰", "🤔"];
  area.innerHTML = '<div class="instruction">We can communicate without words! Tap each expression!</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 0;">';
  expressions.forEach(function(exp) {
    var btn = document.createElement("button");
    btn.style.cssText = "background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:20px;font-size:2.5rem;cursor:pointer";
    btn.textContent = exp;
    var meanings = ["Happy!", "Sad", "Angry", "Surprised", "Love", "Thinking"];
    var idx = expressions.indexOf(exp);
    btn.onclick = function() {
      btn.style.background = "rgba(255,215,0,.15)";
      btn.style.borderColor = "#FFD700";
      say(meanings[idx]);
      state.exprClicked = state.exprClicked || 0;
      state.exprClicked++;
      if (state.exprClicked >= expressions.length) markDoneExp();
    };
    area.appendChild(btn);
  });
}

function rabbitySpeak() {
  var msgs = ["Let's explore!", "You're amazing!", "Keep going!", "There is nothing wrong with trying again!"];
  say(msgs[Math.floor(Math.random() * msgs.length)]);
}

function say(text) {
  var b = document.getElementById("rabbity-bubble");
  if (b) { b.textContent = "🐰 " + text; b.classList.add("show"); }
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function() { if (b) b.classList.remove("show"); }, 3500);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.getElementById("confetti-container");
  if (!c) return;
  c.innerHTML = "";
  var colors = ["#FFD700", "#EF5350", "#66BB6A", "#42A5F5", "#AB47BC", "#FF9800"];
  for (var i = 0; i < 40; i++) {
    var p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    p.style.animationDuration = "2.5s";
    c.appendChild(p);
  }
  setTimeout(function() { c.innerHTML = ""; }, 3500);
}

function toggleParent() {
  var p = document.getElementById("parent-panel");
  if (!p) return;
  p.classList.toggle("open");
  if (p.classList.contains("open")) renderParentPanel();
}

function closeParent() {
  var p = document.getElementById("parent-panel");
  if (p) p.classList.remove("open");
}

function renderParentPanel() {
  var c = document.getElementById("parent-content");
  if (!c) return;
  c.innerHTML = "";
  LESSONS.forEach(function(l) {
    var done = l.exps.filter(function(e) { return isDone(l.id + "-" + e.id); }).length;
    var pct = Math.round((done / l.exps.length) * 100);
    c.innerHTML += "<div class=\"panel-row\"><div class=\"panel-row-label\">" + l.emoji + " " + l.title + " <span>" + pct + "%</span></div><div class=\"panel-bar\"><div class=\"panel-bar-fill\" style=\"width:" + pct + "%;background:#FFD700;\"></div></div></div>";
  });
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") { closeParent(); goBack(); }
});
window.addEventListener("load", init);
</script>
</body>
