<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Five Great Lessons — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07071A;--card:#12123A;--gold:#FFD700;
  --green:#4CAF50;--blue:#42A5F5;--red:#EF5350;
  --purple:#AB47BC;--orange:#FF7043;--cyan:#26C6DA;
  --cream:#FFF8F0;--font-h:'Fredoka One',cursive;
  --font-b:'Quicksand',sans-serif;
}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--bg);font-family:var(--font-b);
  color:var(--cream);touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* Stars */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

/* Top bar */
.tbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.tbar-back,.tbar-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.tbar-back:active,.tbar-btn:active{transform:scale(.9)}
.tbar-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}

/* Universe home */
.cosmic-hero{padding:16px 16px 8px;position:relative;z-index:1;text-align:center}
.cosmic-title{font-family:var(--font-h);font-size:1.6rem;color:var(--gold);margin-bottom:4px}
.cosmic-sub{font-size:.78rem;opacity:.5}
.universe-visual{
  position:relative;z-index:1;display:flex;justify-content:center;
  align-items:center;padding:12px 0 4px;
}
.universe-svg{width:280px;height:200px}

/* Lesson cards */
.lesson-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.lcard{
  background:var(--card);border-radius:18px;padding:14px 16px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);display:flex;
  gap:12px;align-items:center;transition:transform .15s;
  font-family:var(--font-b);
}
.lcard:active{transform:scale(.97)}
.lcard-icon{font-size:2.2rem;flex-shrink:0}
.lcard-name{font-family:var(--font-h);font-size:1rem}
.lcard-sub{font-size:.72rem;opacity:.5;line-height:1.3}
.lcard-arrow{margin-left:auto;font-size:.85rem;opacity:.4}

/* Experience view */
.xp-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.xp-card{
  background:var(--card);border-radius:18px;padding:14px;
  margin:8px 0;box-shadow:0 4px 16px rgba(0,0,0,.35);
  cursor:pointer;border:none;width:100%;text-align:left;
  color:var(--cream);transition:transform .15s;font-family:var(--font-b);
  display:flex;gap:12px;align-items:center;
}
.xp-card:active{transform:scale(.97)}
.xp-num{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-size:.9rem;flex-shrink:0;
}
.xp-name{font-family:var(--font-h);font-size:.95rem}
.xp-done{opacity:.4;text-decoration:line-through}

/* Story view */
.story-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.story-card{
  background:var(--card);border-radius:20px;padding:20px;
  margin:12px 0;box-shadow:0 4px 16px rgba(0,0,0,.35);
  border:none;width:100%;text-align:left;color:var(--cream);
  font-family:var(--font-b);
}
.story-q{
  font-family:var(--font-h);font-size:1.1rem;
  color:var(--gold);margin-bottom:10px;
}
.story-text{
  font-size:.9rem;line-height:1.7;margin-bottom:14px;
  min-height:60px;
}
.story-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.snav{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:var(--cream);border-radius:10px;padding:8px 14px;
  font-family:var(--font-b);font-weight:600;font-size:.82rem;
  cursor:pointer;transition:all .15s;flex:1;min-width:100px;text-align:center;
}
.snav:active{transform:scale(.95)}
.snav.primary{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold)}
.snav.done{background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green)}

/* Interactive scene */
.scene{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.scene-viz{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:16px;padding:20px;min-height:200px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;margin:10px 0;
  position:relative;overflow:hidden;
}
.scene-q{
  background:rgba(255,255,255,.07);border-radius:14px;
  padding:10px 14px;margin:8px 0;font-size:.82rem;text-align:center;
  line-height:1.5;border:1px solid rgba(255,255,255,.08);
}
.scene-choices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.schoice{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:10px 16px;font-family:var(--font-b);
  font-weight:600;font-size:.85rem;cursor:pointer;color:var(--cream);
  transition:all .15s;min-width:100px;text-align:center;
}
.schoice:active{transform:scale(.95)}
.schoice.right{background:rgba(76,175,80,.2);border-color:var(--green);color:var(--green)}
.schoice.wrong{background:rgba(239,83,80,.2);border-color:var(--red);color:var(--red)}

/* Observation */
.obs-panel{
  background:rgba(76,175,80,.1);border:1px solid rgba(76,175,80,.3);
  border-radius:14px;padding:12px 16px;margin:10px 0;
}
.obs-panel .obs-title{font-family:var(--font-h);color:var(--green);font-size:.9rem;margin-bottom:4px}
.obs-panel .obs-text{font-size:.82rem;line-height:1.5;color:var(--cream)}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.conf{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 2.5s ease-out forwards}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* FABs */
.fab{position:fixed;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fab:active{transform:scale(.9)}
.fab-home{left:20px;bottom:20px;background:var(--green);color:#fff}
.fab-parent{right:20px;bottom:20px;background:var(--gold);color:var(--bg)}
.fab-rabbity{right:20px;bottom:80px;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream)}
.bubble{position:fixed;bottom:138px;right:20px;z-index:99;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;max-width:210px;font-size:.8rem;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.bubble.on{opacity:1}

/* Parent panel */
.ppanel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.ppanel.on{transform:translateY(0)}
.phan-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.phan-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.prow{margin-bottom:12px}
.prow-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- HOME: Universe Map -->
<div class="screen on" id="s-home">
  <div class="tbar">
    <a href="index.html" class="tbar-btn">&#8592;</a>
    <div class="tbar-title">Five Great Lessons</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="cosmic-hero">
    <div class="cosmic-title">The Story of Everything</div>
    <div class="cosmic-sub">Everything has a story. Everything is connected.</div>
    <div class="universe-visual">
      <svg class="universe-svg" viewBox="0 0 280 200">
        <!-- Sun -->
        <circle cx="140" cy="30" r="16" fill="#FFD700" opacity="0.9">
          <animate attributeName="r" values="16;18;16" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
        </circle>
        <!-- Mercury -->
        <circle cx="168" cy="42" r="4" fill="#aaa">
          <animateTransform attributeName="transform" type="rotate" from="0 140 30" to="360 140 30" dur="4s" repeatCount="indefinite"/>
        </circle>
        <!-- Venus -->
        <circle cx="182" cy="52" r="6" fill="#FFB74D">
          <animateTransform attributeName="transform" type="rotate" from="30 140 30" to="390 140 30" dur="6s" repeatCount="indefinite"/>
        </circle>
        <!-- Earth orbit -->
        <ellipse cx="140" cy="30" rx="70" ry="70" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <!-- Earth -->
        <circle cx="210" cy="30" r="7" fill="#42A5F5">
          <animateTransform attributeName="transform" type="rotate" from="0 140 30" to="360 140 30" dur="8s" repeatCount="indefinite"/>
        </circle>
        <!-- Mars -->
        <circle cx="195" cy="80" r="5" fill="#EF5350">
          <animateTransform attributeName="transform" type="rotate" from="60 140 30" to="420 140 30" dur="12s" repeatCount="indefinite"/>
        </circle>
        <!-- Stars scattered -->
        <circle cx="20" cy="120" r="1.5" fill="#fff" opacity="0.5"/>
        <circle cx="60" cy="80" r="1" fill="#fff" opacity="0.3"/>
        <circle cx="240" cy="100" r="1.5" fill="#fff" opacity="0.4"/>
        <circle cx="260" cy="150" r="1" fill="#fff" opacity="0.5"/>
        <circle cx="30" cy="170" r="1.5" fill="#fff" opacity="0.3"/>
        <circle cx="250" cy="40" r="1" fill="#fff" opacity="0.4"/>
        <circle cx="10" cy="60" r="1" fill="#fff" opacity="0.3"/>
        <circle cx="270" cy="180" r="1.5" fill="#fff" opacity="0.4"/>
        <!-- Connection lines -->
        <line x1="140" y1="46" x2="140" y2="75" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="148" y="68" fill="rgba(255,255,255,0.3)" font-size="9" font-family="Quicksand,sans-serif">Earth has life</text>
      </svg>
    </div>
  </div>
  <div class="lesson-list" id="lesson-list"></div>
</div>

<!-- LESSON: list of experiences -->
<div class="screen" id="s-lesson">
  <div class="tbar">
    <button class="tbar-back" id="lesson-back">&#8592;</button>
    <div class="tbar-title" id="lesson-title">Lesson</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="xp-area" id="xp-area"></div>
</div>

<!-- STORY: read the big story -->
<div class="screen" id="s-story">
  <div class="tbar">
    <button class="tbar-back" onclick="goBack()">&#8592;</button>
    <div class="tbar-title" id="story-lesson-title">Story</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="story-area">
    <div class="story-card">
      <div class="story-q" id="story-q">The Big Question</div>
      <div class="story-text" id="story-text">...</div>
      <div class="story-nav">
        <button class="snav" onclick="prevStory()">&#8592; Back</button>
        <button class="snav primary" id="story-next" onclick="nextStory()">Next &#8594;</button>
      </div>
      <div style="margin-top:10px">
        <button class="snav" id="story-explore" onclick="goExplore()">Explore &#128269;</button>
      </div>
    </div>
  </div>
</div>

<!-- EXPLORE: interactive experience -->
<div class="screen" id="s-explore">
  <div class="tbar">
    <button class="tbar-back" onclick="goBack()">&#8592;</button>
    <div class="tbar-title" id="exp-title">Experience</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="scene" id="scene-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="fab fab-home">&#127968;</a>
<button class="fab fab-parent" onclick="togglePanel()">&#128100;</button>
<button class="fab fab-rabbity" onclick="rabbitySpeak()">&#128049;</button>
<div class="bubble" id="bubble"></div>

<!-- Parent Panel -->
<div class="ppanel" id="ppanel">
  <div class="phan-handle"></div>
  <button onclick="togglePanel()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">&#10005;</button>
  <div class="phan-title">&#128202; Cosmic Journey</div>
  <div id="pcontent"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
// ─────────────────────────────────────────────
// DATA: Five Great Lessons
// Architecture: WONDER → STORY → EXPERIENCE → OBSERVATION → QUESTION
// ─────────────────────────────────────────────
var LESSONS = [
  {
    id: 1, emoji: "&#127756;", color: "#FFD700",
    name: "The Coming of the Universe",
    shortName: "Universe",
    question: "Where did everything around us come from?",
    story: [
      { q: "Where did everything come from?", text: "Long before there were people, animals, trees, oceans, or mountains, there was a universe. It started with a tiny, tiny point — smaller than anything you can imagine. Then it grew. Stars formed. Our Sun was born. And one special planet — Earth — began to take shape." },
      { q: "What is the Sun?", text: "The Sun looks like a bright light in the sky. But it is actually a star — just much, much closer to us than other stars. It is so far away that light from the Sun takes 8 minutes to reach Earth. The Sun gives Earth almost all of its light and warmth." },
      { q: "How did Earth change?", text: "Earth was not always the way it looks today. Long ago, it was so hot that rock melted like lava. Slowly, over an enormous amount of time, Earth cooled down. Mountains pushed up. Water collected in oceans. The air became something we could breathe. And then — something amazing happened." }
    ],
    experiences: [
      {
        id: "particles", emoji: "&#129514;", name: "Hot, Warm, Cold — Particles",
        color: "#FF7043",
        scene: "particles"
      },
      {
        id: "gravity", emoji: "&#127755;", name: "Gravity — Why Things Fall",
        color: "#26C6DA",
        scene: "gravity"
      },
      {
        id: "solar", emoji: "&#127775;", name: "Solar System — Earth Orbits the Sun",
        color: "#FFD700",
        scene: "solar"
      },
      {
        id: "volcano", emoji: "&#128293;", name: "Volcano — Hot Rock Inside Earth",
        color: "#EF5350",
        scene: "volcano"
      },
      {
        id: "erosion", emoji: "&#127754;", name: "Water Changes Land — Erosion",
        color: "#42A5F5",
        scene: "erosion"
      }
    ]
  },
  {
    id: 2, emoji: "&#127807;", color: "#66BB6A",
    name: "The Coming of Life",
    shortName: "Life",
    question: "How did Earth become full of living things?",
    story: [
      { q: "When did life appear?", text: "Earth existed for a very, very long time before there was any life at all. No plants. No animals. Just rock, water, and air. Then, somewhere, in the ocean or in warm mud, the very first living thing appeared. It was so tiny you could not see it without a microscope. But it was alive." },
      { q: "How did life become so different?", text: "Over millions and millions of years, life changed and diversified. Simple life became more complex. Some creatures lived in water. Some crawled onto land. Some grew wings. Some grew tall like trees. Life spread into every corner of Earth — deserts, oceans, mountains, ice." },
      { q: "Are humans the most important?", text: "Humans appeared very, very recently in Earths history. Dinosaurs lived for 165 million years. Humans have existed for only about 200,000 years. Life is not a ladder with humans at the top. Life is a branching tree — and every branch is equally part of the story." }
    ],
    experiences: [
      {
        id: "alive", emoji: "&#128054;", name: "Is It Alive? — Living vs Nonliving",
        color: "#66BB6A",
        scene: "alive"
      },
      {
        id: "timeline", emoji: "&#128197;", name: "Timeline of Life — Who Came First?",
        color: "#AB47BC",
        scene: "timeline"
      },
      {
        id: "classify", emoji: "&#128024;", name: "Sort the Animals — Classification",
        color: "#FF9800",
        scene: "classify"
      },
      {
        id: "ecosystem", emoji: "&#127795;", name: "Build an Ecosystem — Everything Connects",
        color: "#4CAF50",
        scene: "ecosystem"
      }
    ]
  },
  {
    id: 3, emoji: "&#128104;", color: "#FF7043",
    name: "The Coming of Human Beings",
    shortName: "Humans",
    question: "What makes humans special?",
    story: [
      { q: "How are humans part of life?", text: "Humans are one branch in the story of life. Like all living things, we need food, water, shelter, and safety. But humans also have remarkable gifts — the ability to think, imagine, create, communicate, and cooperate across generations." },
      { q: "What do humans need?", text: "Every human community shares the same fundamental needs: food, water, shelter, clothing, safety, love, belonging, and learning. But different communities meet these needs in different ways — and that is what makes human culture so wonderfully varied." },
      { q: "How does knowledge grow?", text: "No human has to discover everything from scratch. A person who lived 300 years ago discovered something. They shared it. Someone else learned it, improved it, and shared it again. Today you benefit from millions of discoveries made by people you will never meet. Knowledge grows because humans cooperate." }
    ],
    experiences: [
      {
        id: "needs", emoji: "&#127774;", name: "What Do Humans Need?",
        color: "#FF7043",
        scene: "needs"
      },
      {
        id: "tools", emoji: "&#128296;", name: "Tool Evolution — Problem Solving",
        color: "#78909C",
        scene: "tools"
      },
      {
        id: "cooperate", emoji: "&#128170;", name: "Cooperation — Together Is Better",
        color: "#AB47BC",
        scene: "cooperate"
      }
    ]
  },
  {
    id: 4, emoji: "&#9997;", color: "#42A5F5",
    name: "The Story of Communication",
    shortName: "Communication",
    question: "How can thoughts travel to other people?",
    story: [
      { q: "How do we share ideas?", text: "Imagine you discover where delicious fruit grows, but your best friend lives far away. How could you tell them? You could go there. You could make a sound. You could draw a picture. But what if you want someone who lives 1000 years from now to know your idea?" },
      { q: "What is writing?", text: "Writing is a way to put thoughts into marks that can be seen and understood later — even by people you will never meet. The earliest writing was pictures drawn on cave walls. Over time, pictures became symbols. Symbols became letters. Letters could represent the sounds of any word." },
      { q: "Why does writing matter?", text: "Before writing, knowledge had to be passed from person to person by speaking. It was easily forgotten or changed. Writing allowed knowledge to survive across time and distance. Every book, every map, every recipe, every letter — all of it connects us to the thoughts of people we will never meet." }
    ],
    experiences: [
      {
        id: "symbols", emoji: "&#128270;", name: "Invent a Symbol — Shared Meaning",

      {
        id: "picturemsg", emoji: "&#128444;", name: "Picture Message — From Drawing to Symbol",
        color: "#FFCA28",
        scene: "picturemsg"
      },
      {
        id: "timetravel", emoji: "&#128640;", name: "Message Through Time — Writing Survives",
        color: "#AB47BC",
        scene: "timetravel"
      }
    ]
  },
  {
    id: 5, emoji: "&#128200;", color: "#AB47BC",
    name: "The Story of Numbers",

// ─────────────────────────────────────────────
// SCENES — interactive experiences
// ─────────────────────────────────────────────
var SCENES = {

  // LESSON 1 — Universe
  particles: {
    title: "Hot, Warm, Cold — Particles",
    bg: "#1a0a00",
    init: function(container) {
      container.innerHTML = '<div class="scene-q">Tap Hot, Warm, or Cold to change the temperature. What do you notice about how the particles move?</div>' +
        '<div class="scene-viz" id="particle-viz" style="background:#1a0a00;min-height:160px">' +

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
var STATE = {
  history: ["home"],
  currentLesson: null,
  currentExp: null,
  storyPage: 0,
  progress: {}
};

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  STATE.progress = lg("fgl-progress", {});
  genStars();
  renderHome();
}

function genStars(){
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for(var i=0;i<65;i++){
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random()*2+1;
    s.style.cssText = "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+sz+"px;height:"+sz+"px;--d:"+(Math.random()*2+2).toFixed(1)+"s;--dl:"+(Math.random()*3).toFixed(1)+"s";
    el.appendChild(s);
  }
}

// ─────────────────────────────────────────────
// SCREEN SWITCHING
// ─────────────────────────────────────────────
function sc(name){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on");});
  document.getElementById("s-"+name).classList.add("on");
  if(name !== "home") STATE.history.push(name);
  if(name === "home") STATE.history = ["home"];
}

function goBack(){
  if(STATE.history.length > 1) STATE.history.pop();
  var prev = STATE.history[STATE.history.length-1] || "home";
  sc(prev);
}

// ─────────────────────────────────────────────
// HOME
// ─────────────────────────────────────────────
function renderHome(){
  var list = document.getElementById("lesson-list");
  list.innerHTML = "";
  LESSONS.forEach(function(lesson){
    var done = STATE.progress["lesson-"+lesson.id] === true;
    var card = document.createElement("button");
    card.className = "lcard";
    card.onclick = function(){ openLesson(lesson); };
    card.innerHTML =
      '<div class="lcard-icon">'+lesson.emoji+'</div>'+
      '<div><div class="lcard-name">'+lesson.name+'</div>'+
      '<div class="lcard-sub">'+lesson.question+'</div></div>'+
      '<div class="lcard-arrow">'+(done?"&#10003;":"&#8594;")+'</div>';
    if(done) card.style.opacity = "0.7";
    list.appendChild(card);
  });
}

function openLesson(lesson){
  STATE.currentLesson = lesson;
  STATE.storyPage = 0;
  document.getElementById("lesson-title").textContent = lesson.name;
  renderLessonXPs(lesson);
  sc("lesson");
}

function renderLessonXPs(lesson){
  var area = document.getElementById("xp-area");
  area.innerHTML = '<div style="padding:10px 0 4px;text-align:center"><div style="font-family:var(--font-h);color:var(--gold);font-size:.95rem;margin-bottom:2px">'+lesson.emoji+' '+lesson.name+'</div><div style="font-size:.8rem;opacity:.6">'+lesson.question+'</div></div>';

  // Story button
  var storyBtn = document.createElement("button");
  storyBtn.className = "xp-card";
  storyBtn.style.borderLeft = "3px solid "+lesson.color;
  storyBtn.innerHTML = '<div class="xp-num" style="background:'+lesson.color+'22;color:'+lesson.color+';border:2px solid '+lesson.color+'">&#128214;</div><div><div class="xp-name">The Big Story</div><div style="font-size:.72rem;opacity:.5">Read the story first</div></div><div style="margin-left:auto;font-size:.8rem;opacity:.4">&#8594;</div>';
  storyBtn.onclick = function(){ openStory(lesson); };
  area.appendChild(storyBtn);

  // Experience cards
  lesson.experiences.forEach(function(exp, i){
    var done = !!STATE.progress[exp.id];
    var btn = document.createElement("button");
    btn.className = "xp-card";
    btn.style.borderLeft = "3px solid "+exp.color;
    btn.innerHTML = '<div class="xp-num" style="background:'+exp.color+'22;color:'+exp.color+';border:2px solid '+exp.color+'">'+(done?"&#10003;":(i+1))+'</div><div><div class="xp-name '+(done?'xp-done':'')+'">'+exp.emoji+' '+exp.name+'</div></div><div style="margin-left:auto;font-size:.8rem;opacity:.4">&#8594;</div>';
    btn.onclick = function(){ openExperience(lesson, exp); };
    area.appendChild(btn);
  });
}

function openStory(lesson){
  STATE.currentLesson = lesson;
  STATE.storyPage = 0;
  STATE.history.push("lesson");
  document.getElementById("story-lesson-title").textContent = lesson.shortName;
  renderStoryPage();
  sc("story");
}

function renderStoryPage(){
  var lesson = STATE.currentLesson;
  var page = lesson.story[STATE.storyPage];
  document.getElementById("story-q").textContent = page.q;
  document.getElementById("story-text").textContent = page.text;
  var nextBtn = document.getElementById("story-next");
  if(STATE.storyPage >= lesson.story.length-1){
    nextBtn.textContent = "Done!";
    nextBtn.onclick = function(){ completeLesson(); };
  } else {
    nextBtn.textContent = "Next \u2192";
    nextBtn.onclick = nextStory;
  }
}

function nextStory(){
  if(STATE.storyPage < STATE.currentLesson.story.length-1){
    STATE.storyPage++;
    renderStoryPage();
  }
}

function prevStory(){
  if(STATE.storyPage > 0){
    STATE.storyPage--;
    renderStoryPage();
  }
}

function completeLesson(){
  if(!STATE.progress["lesson-"+STATE.currentLesson.id]){
    STATE.progress["lesson-"+STATE.currentLesson.id] = true;
    ls("fgl-progress", STATE.progress);
    confetti();
  }
  goBack();
  say("What an amazing story! Now you can explore the experiences.");
}

function goExplore(){
  sc("explore");
  renderExperience(STATE.currentLesson, STATE.currentLesson.experiences[0]);
}

function openExperience(lesson, exp){
  STATE.currentLesson = lesson;
  STATE.currentExp = exp;
  STATE.history.push("lesson");
  document.getElementById("exp-title").textContent = exp.name;
  sc("explore");
  renderExperience(lesson, exp);
}

function renderExperience(lesson, exp){
  var area = document.getElementById("scene-area");
  // Reset to white background
  area.style.background = "var(--bg)";
  var scene = SCENES[exp.scene];
  if(!scene){ area.innerHTML="<p>Experience coming soon!</p>"; return; }
  if(scene.bg) area.style.background = scene.bg;
  document.getElementById("exp-title").textContent = scene.title || exp.name;
  scene.init(area);
}

// Particles
function setTemp(level){
  window.currentTemp = level;
  var box = document.getElementById("particle-box");
  if(!box) return;
  box.innerHTML = "";
  var count = 18;
  var speed, color;
  if(level === "cold"){ speed = 400; color = "#42A5F5"; }
  else if(level === "warm"){ speed = 150; color = "#FF9800"; }
  else { speed = 40; color = "#EF5350"; }
  window.tempParticles = [];
  for(var i=0;i<count;i++){
    (function(idx){
      var p = document.createElement("div");
      var x = Math.random()*220+10;
      var y = Math.random()*60+10;
      p.style.cssText = "position:absolute;width:6px;height:6px;border-radius:50%;background:"+color+";left:"+x+"px;top:"+y+"px;opacity:.7;transition:left "+(speed/1000)+"s linear,top "+(speed/1000)+"s linear";
      box.appendChild(p);
      window.tempParticles.push({el:p,x:x,y:y});
      function move(){
        if(window.currentTemp !== level) return;
        var nx = Math.random()*220+10;
        var ny = Math.random()*60+10;
        p.style.left = nx+"px";
        p.style.top = ny+"px";
        setTimeout(move, speed);
      }
      setTimeout(move, speed);
    })(i);
  }
  document.getElementById("particle-obs").style.display = "block";
}

// Gravity
window.gravObj = null;
function gravSet(obj){
  window.gravObj = obj;
}
function gravDrop(e){
  if(!window.gravObj) return;
  var box = document.getElementById("grav-box");
  if(!box) return;
  var rect = box.getBoundingClientRect();
  var x = e.clientX - rect.left;
  var y = e.clientY - rect.top;
  // Clamp
  x = Math.max(20, Math.min(x, rect.width-20));
  y = Math.max(10, Math.min(y, rect.height-20));
  var el = document.createElement("div");
  el.style.cssText = "position:absolute;font-size:2rem;left:"+x+"px;top:"+y+"px;transition:top .6s ease-in";
  el.textContent = window.gravObj;
  box.appendChild(el);
  setTimeout(function(){ el.style.top = (rect.height-30)+"px"; }, 50);
  document.getElementById("grav-obs").style.display = "block";
}

// Solar

// Volcano
function setVolcano(level){
  var lava = document.getElementById("lava-erupt");
  var top = document.getElementById("lava-top");
  var ash = document.getElementById("lava-ash");
  if(!lava) return;
  lava.style.opacity = "0";
  lava.style.height = "0";
  top.style.opacity = "0";
  ash.style.opacity = "0";
  ash.innerHTML = "";
  ash.style.height = "0";
  if(level === 1){
    top.style.opacity = "1";
    lava.style.opacity = "0";
  } else if(level === 2){
    top.style.opacity = "1";
    lava.style.opacity = "0.5";
    lava.style.height = "20px";
  } else {
    top.style.opacity = "1";
    lava.style.opacity = "1";
    lava.style.height = "60px";
    ash.style.opacity = "1";
    ash.style.height = "40px";
    ash.innerHTML = "&#10070;&#10070;&#10070;";
    setTimeout(function(){ ash.style.opacity="0"; }, 1000);
  }
  document.getElementById("volcano-obs").style.display = "block";
}

// Erosion
function runErosion(){

function tlDrop(e){

// Symbols canvas
function showSymbolHistory(){
  var area = document.getElementById("symbol-canvas");
  if(!area) return;
  var ctx = area.getContext("2d");
  ctx.clearRect(0,0,260,120);
  ctx.font = "20px Fredoka One, cursive";
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.textAlign = "center";
  ctx.fillText("~ draw your water symbol above ~", 130, 65);
  document.getElementById("symbol-obs").style.display = "block";
  var canvas = document.getElementById("symbol-canvas");
  if(!canvas) return;
  var c = canvas.getContext("2d");
  var drawing = false, lastX = 0, lastY = 0;
  function getPos(e){
    var rect = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return {x: t.clientX-rect.left, y: t.clientY-rect.top};
  }
  canvas.addEventListener("pointerdown", function(e){e.preventDefault();drawing=true;var p=getPos(e);lastX=p.x;lastY=p.y;},{passive:false});
  canvas.addEventListener("pointermove", function(e){
    if(!drawing) return;
    e.preventDefault();
    var p=getPos(e);
    c.beginPath();c.moveTo(lastX,lastY);c.lineTo(p.x,p.y);c.strokeStyle="#FFD700";c.lineWidth=3;c.lineCap="round";c.stroke();
    lastX=p.x;lastY=p.y;
  },{passive:false});
  canvas.addEventListener("pointerup",function(){drawing=false;});
}
function clearSymbol(){
  var canvas = document.getElementById("symbol-canvas");
  if(!canvas) return;
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
}

// Tally
function renderTally(){
  var sheet = document.getElementById("tally-sheet");
  if(!sheet) return;
  sheet.innerHTML = "";
  var counts = {};
  window.tallyState.forEach(function(s){ counts[s] = (counts[s]||0)+1; });
  Object.keys(counts).forEach(function(sym){
    var row = document.createElement("div");
    row.style.cssText = "display:flex;gap:6px;align-items:center;font-size:1.5rem";
    row.innerHTML = '<span>'+sym+'</span>';
    var n = counts[sym];
    var groups = Math.floor(n/5);
    var remainder = n%5;
    for(var g=0;g<groups;g++){
      var grp = document.createElement("span");
      grp.innerHTML = "&#10072;&#10072;&#10072;&#10072;&#10073;";
      grp.style.color = "var(--gold)";
      grp.style.letterSpacing = "2px";
      row.appendChild(grp);
    }
    if(remainder > 0){
      var rem = document.createElement("span");
      rem.textContent = Array(remainder).fill("\u2022").join(" ");
      rem.style.color = "var(--gold)";
      row.appendChild(rem);
    }
    sheet.appendChild(row);
  });
  var total = window.tallyState.length;
  var totalEl = document.getElementById("tally-total");
  if(totalEl) totalEl.textContent = "Total: " + total;
}
function tallyAdd(sym){
  window.tallyState.push(sym);
  renderTally();
}
function resetTally(){
  window.tallyState = [];
  renderTally();
}

// Place value
function pvAdd(place){
  if(window.pvState[place] < 9){
    window.pvState[place]++;
    updatePV();
  }
}
function pvReset(){
  window.pvState = {h:0,t:0,u:0};
  updatePV();
}
function updatePV(){
  var h = document.getElementById("pv-h");
  var t = document.getElementById("pv-t");
  var u = document.getElementById("pv-u");
  var total = document.getElementById("pv-total");
  if(h) h.textContent = window.pvState.h;
  if(t) t.textContent = window.pvState.t;
  if(u) u.textContent = window.pvState.u;
  if(total) total.textContent = "= "+(window.pvState.h*100+window.pvState.t*10+window.pvState.u);
}
function pvCheck(){
  var val = window.pvState.h*100 + window.pvState.t*10 + window.pvState.u;
  if(val === 243){
    document.getElementById("pv-obs").style.display = "block";
    sceneDone("placevalue");
    confetti();
  } else if(val > 0) {
    say("That is " + val + ". Try to reach 243!");

}

function sceneDone(id){
  if(!STATE.progress[id]){
    STATE.progress[id] = true;
    ls("fgl-progress", STATE.progress);
    confetti();
    say("You completed an experience! " + (SCENES[id] ? SCENES[id].title : "Great work!"));

}

function togglePanel(){
  var p = document.getElementById("ppanel");
  if(!p) return;
  p.classList.toggle("on");
  if(p.classList.contains("on")) renderPanel();
}

function renderPanel(){
  var c = document.getElementById("pcontent");
  if(!c) return;
  c.innerHTML = "";
  LESSONS.forEach(function(lesson){
    var expDone = lesson.experiences.filter(function(e){ return !!STATE.progress[e.id]; }).length;
    var total = lesson.experiences.length;
    var pct = Math.round((expDone/total)*100);
    c.innerHTML += '<div class="prow"><div class="prow-label">'+lesson.emoji+' '+lesson.shortName+' <span>'+pct+'%</span></div><div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:'+lesson.color+';"></div></div></div>';
  });
}

function say(text){
  var b = document.getElementById("bubble");
  if(b){ b.textContent = "\uD83D\uDC3B " + text; b.classList.add("on"); }
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){ if(b) b.classList.remove("on"); }, 3500);
}

function rabbitySpeak(){
  var msgs = [
    "Everything is connected!",
    "What do you wonder about?",
    "The universe is so big!",
    "Keep exploring!",
    "You are a wonderful learner!"
  ];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}

function confetti(){
  var c = document.getElementById("confetti");
  if(!c) return;
  c.innerHTML = "";
  var colors = ["#FFD700","#EF5350","#66BB6A","#42A5F5","#AB47BC","#FF9800"];
  for(var i=0;i<35;i++){
    var p = document.createElement("div");
    p.className = "conf";
    p.style.left = Math.random()*100+"%";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.7)+"s";
    p.style.animationDuration = "2.5s";
    c.appendChild(p);
  }
  setTimeout(function(){ c.innerHTML = ""; }, 3500);
}
