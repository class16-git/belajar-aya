<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Aya — Wow Archive</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07071A;--card:#12123A;--card2:#1a1a40;
  --gold:#FFD700;--cyan:#26C6DA;--cream:#FFF8F0;
  --font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);min-height:100dvh;-webkit-tap-highlight-color:transparent}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 60px}
.tbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.tbar-title{font-family:var(--font-h);font-size:1rem;color:var(--gold)}
.back{display:inline-block;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);text-decoration:none;font-size:.8rem;font-weight:700}
h1{font-family:var(--font-h);font-size:1.5rem;color:var(--gold);text-align:center;margin:6px 0 2px}
.sub{font-size:.8rem;opacity:.55;text-align:center;margin-bottom:22px}
.month-h{font-family:var(--font-h);font-size:.95rem;color:var(--cyan);margin:22px 0 10px}
.wow-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.wow-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wow-emoji{font-size:1.4rem}
.wow-topic{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.wow-date{margin-left:auto;font-size:.65rem;opacity:.45}
.wow-fact{font-size:.9rem;line-height:1.55;opacity:.92}
.wow-more{display:none;margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
.wow-card.open .wow-more{display:block}
.wow-row{font-size:.8rem;line-height:1.5;opacity:.75;margin-bottom:8px}
.wow-label{display:block;font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-bottom:2px}
.wow-sim{display:inline-block;margin-top:4px;color:#00BCD4;font-size:.78rem;font-weight:700;text-decoration:none;padding:7px 13px;border:1px solid rgba(0,188,212,.35);border-radius:11px}
.wow-toggle{width:100%;margin-top:10px;background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.35);color:var(--gold);font-family:inherit;font-size:.8rem;font-weight:700;padding:9px;border-radius:11px;cursor:pointer}
.empty{text-align:center;opacity:.5;font-size:.85rem;padding:40px 0}
:focus-visible{outline:3px solid var(--gold)!important;outline-offset:3px!important}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <div class="tbar">
    <a class="back" href="index.html">← Home</a>
    <div class="tbar-title">Belajar Aya</div>
  </div>
  <h1>🔭 Wow Archive</h1>
  <div class="sub">Every discovery, saved forever. Pick any card and explore again!</div>
  <div id="archive"></div>
</div>
<script src="wow-archive.js"></script>
<script>
function genStars(){var s=document.getElementById("stars");var h="";for(var i=0;i<60;i++){var sz=Math.random()*2+1;h+='<div class="star" style="width:'+sz+'px;height:'+sz+'px;left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;opacity:'+(Math.random()*0.7+0.15)+'"></div>';}s.innerHTML=h;}
function toggleCard(el){el.classList.toggle("open");var b=el.querySelector(".wow-toggle");b.textContent=el.classList.contains("open")?"Show less":"Open this wow";}
function render(){
  var box=document.getElementById("archive");
  if(typeof window.WOW_ARCHIVE==="undefined"||!window.WOW_ARCHIVE.length){box.innerHTML='<div class="empty">No wows saved yet — come back tomorrow!</div>';return;}
  var items=window.WOW_ARCHIVE.slice().reverse(); // newest first
  var months={};
  items.forEach(function(w){
    var m=w.date.slice(0,7);
    (months[m]=months[m]||[]).push(w);
  });
  var names=["January","February","March","April","May","June","July","August","September","October","November","December"];
  var html="";
  Object.keys(months).sort().reverse().forEach(function(m){
    var y=m.slice(0,4),mo=parseInt(m.slice(5,7),10)-1;
    html+='<div class="month-h">'+names[mo]+' '+y+'</div>';
    months[m].forEach(function(w){
      var sim=w.sim?'<a class="wow-sim" href="'+w.sim+'">Explore it →</a>':"";
      html+='<div class="wow-card">'+
        '<div class="wow-head"><span class="wow-emoji">'+w.emoji+'</span><span class="wow-topic">'+w.topic+'</span><span class="wow-date">'+w.date+'</span></div>'+
        '<div class="wow-fact">'+w.fact+'</div>'+
        '<div class="wow-more">'+
          '<div class="wow-row"><span class="wow-label">🤔 Ask her</span>'+w.ask+'</div>'+
          '<div class="wow-row"><span class="wow-label">💡 Hint</span>'+w.hint+'</div>'+
          '<div class="wow-row"><span class="wow-label">🔎 Try this</span>'+w.trythis+'</div>'+
          '<div class="wow-row"><span class="wow-label">🧠 For you</span>'+w.kid+'</div>'+
          sim+
        '</div>'+
        '<button class="wow-toggle" type="button" onclick="toggleCard(this.parentNode)">Open this wow</button>'+
      '</div>';
    });
  });
  box.innerHTML=html;
}
genStars();render();
</script>
</body>
</html>
