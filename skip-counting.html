<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Skip Counting — Learn Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #07071A;
  --card:   #12123A;
  --gold:   #FFD700;
  --green:  #4CAF50;
  --blue:   #42A5F5;
  --orange: #FF9800;
  --cream:  #FFF8F0;
  --purple: #7C4DFF;
  --shadow: 0 4px 24px rgba(0,0,0,.35);
  --font-h: 'Fredoka One', cursive;
  --font-b: 'Quicksand', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  font-family:var(--font-b);
  color:var(--cream);
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:manipulation;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .dot{animation:none!important}
}

/* ── Screens ── */
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}

/* ── Top bar ── */
.top-bar{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px 8px;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
}
.back-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:var(--cream);border-radius:12px;padding:8px 14px;
  font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.back-btn:active{transform:scale(.95)}
.top-title{font-family:var(--font-h);font-size:.95rem;color:var(--gold)}

/* ── Stage select ── */
.stage-select{padding:16px 16px 100px;position:relative;z-index:1}
.stage-select h2{font-family:var(--font-h);font-size:1.3rem;color:var(--gold);margin-bottom:16px;text-align:center}
.stage-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage-card{
  background:var(--card);border-radius:18px;padding:16px;
  text-align:center;cursor:pointer;border:2px solid transparent;
  box-shadow:var(--shadow);transition:transform .15s,border-color .15s;
}
.stage-card:active{transform:scale(.96)}
.stage-card.done{border-color:var(--green)}
.stage-card.current{border-color:var(--gold)}
.stage-emoji{font-size:2.2rem;margin-bottom:6px}
.stage-name{font-family:var(--font-h);font-size:.9rem;margin-bottom:4px}
.stage-desc{font-size:.7rem;opacity:.5;line-height:1.4}
.stage-lock{font-size:.65rem;opacity:.3;margin-top:4px}

/* ── Game area ── */
.game-area{padding:8px 16px 100px;position:relative;z-index:1;flex:1}

/* Progress bar */
.progress-bar{
  height:8px;background:rgba(255,255,255,.1);border-radius:4px;
  margin:8px 0 12px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:4px;background:var(--green);
  transition:width .5s ease;
}

/* Stage info */
.stage-info{
  text-align:center;margin-bottom:12px;
  padding:8px 16px;background:rgba(255,255,255,.05);
  border-radius:14px;border:1px solid rgba(255,255,255,.08);
}
.stage-info h3{font-family:var(--font-h);font-size:1.1rem;color:var(--gold);margin-bottom:4px}
.stage-info p{font-size:.8rem;opacity:.6}

/* ── Dots ── */
.dot-pool{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:12px;background:rgba(255,255,255,.04);
  border-radius:16px;border:2px dashed rgba(255,255,255,.1);
  margin-bottom:16px;min-height:80px;
  touch-action: none;
}
.dot{
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-size:1.1rem;
  cursor:grab;user-select:none;touch-action:none;
  animation:dotDrop .35s ease-out backwards;
  position:relative;z-index:1;
}
.dot:active{cursor:grabbing}
@keyframes dotDrop{
  0%{transform:translateY(-30px) scale(.5);opacity:0}
  60%{transform:translateY(5px) scale(1.1)}
  100%{transform:translateY(0) scale(1);opacity:1}
}
@keyframes dotShake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-4px) rotate(-3deg)}
  75%{transform:translateX(4px) rotate(3deg)}
}
.dot.shake{animation:dotShake .3s ease-in-out}

/* ── Baskets ── */
.baskets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px}
.basket{
  min-width:90px;min-height:90px;
  border-radius:16px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;padding:8px 6px;
  gap:4px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s;
  touch-action:none;
}
.basket-label{
  font-family:var(--font-h);font-size:.75rem;text-align:center;
  padding:2px 6px;border-radius:6px;margin-bottom:2px;
}
.basket-count{font-family:var(--font-h);font-size:.72rem;opacity:.7;margin-top:auto}
.basket-dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;flex:1}

/* ── Total display ── */
.total-display{
  text-align:center;margin:12px 0;
  font-family:var(--font-h);font-size:1rem;
  padding:10px 16px;background:rgba(255,255,255,.06);
  border-radius:14px;border:1px solid rgba(255,255,255,.1);
}
.total-display span{color:var(--gold);font-size:1.4rem}

/* ── Action buttons ── */
.action-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{
  padding:12px 20px;border-radius:14px;border:none;cursor:pointer;
  font-family:var(--font-b);font-weight:700;font-size:.88rem;
  transition:transform .12s;
}
.btn:active{transform:scale(.95)}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}

/* ── Instruction ── */
.instruction{
  background:rgba(255,255,255,.06);border-radius:14px;
  padding:12px 16px;margin:12px 0;
  font-size:.82rem;line-height:1.6;text-align:center;
  border:1px solid rgba(255,255,255,.08);
}

/* ── Number ladder ── */
.ladder-area{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px;margin-bottom:12px;
}
.ladder-step{
  display:flex;align-items:center;gap:10px;width:100%;max-width:300px;
  padding:8px 14px;border-radius:12px;
  cursor:pointer;border:2px solid transparent;
  transition:all .15s;
}
.ladder-step.done{background:rgba(76,175,80,.15);border-color:rgba(76,175,80,.4)}
.ladder-step.current{background:rgba(255,215,0,.1);border-color:rgba(255,215,0,.5)}
.ladder-num{font-family:var(--font-h);font-size:1.2rem;min-width:36px;text-align:center}
.ladder-dots{display:flex;gap:3px;flex-wrap:wrap}
.ladder-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.2)}

/* ── Rainbow path ── */
.rainbow-area{
  display:flex;align-items:center;justify-content:center;
  gap:4px;flex-wrap:wrap;padding:10px;margin-bottom:12px;
}
.rainbow-step{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:10px 8px;border-radius:12px;cursor:pointer;
  border:2px solid transparent;transition:all .15s;min-width:52px;
}
.rainbow-step.done{background:rgba(76,175,80,.15);border-color:rgba(76,175,80,.4)}
.rainbow-num{font-family:var(--font-h);font-size:1.3rem}

/* ── FABs ── */
.home-fab{
  position:fixed;bottom:20px;left:20px;
  width:50px;height:50px;border-radius:50%;
  background:var(--green);color:#fff;font-size:1.3rem;
  border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);
  z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none;
}
.home-fab:active{transform:scale(.9)}
.parent-fab{
  position:fixed;bottom:20px;right:20px;
  width:50px;height:50px;border-radius:50%;
  background:var(--gold);color:var(--bg);font-size:1.2rem;
  border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;
}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{
  position:fixed;bottom:80px;right:20px;
  width:50px;height:50px;border-radius:50%;
  background:var(--card);border:2px solid rgba(255,255,255,.15);
  color:var(--cream);font-size:1.3rem;z-index:99;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.rabbity-bubble{
  position:fixed;bottom:140px;right:20px;z-index:98;
  background:var(--card);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:10px 14px;max-width:220px;
  font-size:.8rem;line-height:1.5;color:var(--cream);
  box-shadow:0 4px 16px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.rabbity-bubble.show{opacity:1}

/* ── Parent panel ── */
.parent-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--cream);color:#333;
  border-radius:20px 20px 0 0;padding:20px 16px 90px;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;
  max-height:70vh;overflow-y:auto;
  transform:translateY(110%);transition:transform .3s ease;
}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}

/* ── Confetti ── */
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{
  position:absolute;width:10px;height:10px;border-radius:2px;
  animation:confettiFall 2.5s ease-out forwards;
}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* ── Stars ── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- ── STAGE SELECT ── -->
<div class="screen active" id="screen-select">
  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <div class="top-title">Skip Counting</div>
    <button class="back-btn" onclick="toggleParent()" style="background:none;border:none;font-size:1.1rem;">👤</button>
  </div>
  <div class="stage-select">
    <h2>Choose a Stage</h2>
    <div class="stage-grid" id="stage-grid"></div>
  </div>
</div>

<!-- ── GAME ── -->
<div class="screen" id="screen-game">
  <div class="top-bar">
    <button class="back-btn" onclick="showSelect()">← Back</button>
    <div class="top-title" id="game-title"></div>
    <button class="back-btn" onclick="toggleParent()" style="background:none;border:none;font-size:1.1rem;">👤</button>
  </div>
  <div class="game-area" id="game-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<!-- Parent panel -->
<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Progress Skip Counting</div>
  <div id="parent-content"></div>
</div>

<!-- Confetti -->
<div class="confetti-container" id="confetti-container"></div>

<script>
// ═══════════════════════════════════════════
// STAGES DATA
// ═══════════════════════════════════════════
const STAGES = [
  {
    id:1, name:'Numbers 1–10', emoji:'🔢', color:'#42A5F5',
    desc:'Count one by one',
    type:'ladder',
    target:10, by:1,
    instruction:'Tap numbers 1 through 10!'
  },
  {
    id:2, name:'Loncat 2-an', emoji:'🌈', color:'#7C4DFF',
    desc:'2, 4, 6, 8...',
    type:'rainbow',
    target:10, by:2,
    instruction:'Loncat 2-dua! 2... 4... 6... 8...'
  },
  {
    id:3, name:'Loncat 5-an', emoji:'💰', color:'#FF9800',
    desc:'5, 10, 15, 20...',
    type:'rainbow',
    target:10, by:5,
    instruction:'Loncat 5-lima! 5... 10... 15...'
  },
  {
    id:4, name:'Loncat 10-an', emoji:'🏠', color:'#4CAF50',
    desc:'10, 20, 30...',
    type:'rainbow',
    target:10, by:10,
    instruction:'Loncat 10-sepuluh! 10... 20... 30...'
  },
  {
    id:5, name:'Buat Kelompok', emoji:'🧺', color:'#E91E63',
    desc:'Same amount in every group',
    type:'basket',
    total:12, by:3, groups:3,
    instruction:'Drag dots into baskets! Each basket must have the same amount.'
  },
  {
    id:6, name:'Tantangan', emoji:'⭐', color:'#FFD700',
    desc:'Gabungan semua pola',
    type:'basket',
    total:20, by:4, groups:5,
    instruction:'Drag dots into baskets — equal amounts each!'
  },
];

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let state = { stage:1, step:1, dragging:null };

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ═══════════════════════════════════════════
// STARS
// ═══════════════════════════════════════════
function genStars(){
  const el=document.getElementById('stars');
  el.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${sz}px;height:${sz}px;
      animation-delay:${(Math.random()*3).toFixed(1)}s;
      animation-duration:${(Math.random()*2+2).toFixed(1)}s`;
    el.appendChild(s);
  }
}

// ═══════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════
function showSelect(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-select').classList.add('active');
  renderStageGrid();
}
function showGame(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-game').classList.add('active');
  renderGame();
}

// ═══════════════════════════════════════════
// STAGE GRID
// ═══════════════════════════════════════════
function renderStageGrid(){
  const grid=document.getElementById('stage-grid');
  const progress=lsGet('skip-progress',[]);
  const current=lsGet('skip-stage',1);
  grid.innerHTML='';
  STAGES.forEach(s=>{
    const done=progress.includes(s.id);
    const isCurrent=s.id===current;
    const unlocked=s.id<=current;
    const card=document.createElement('div');
    card.className='stage-card'+(done?' done':'')+(isCurrent?' current':'');
    card.style.opacity=unlocked?'1':'0.5';
    card.onclick=unlocked?()=>startStage(s.id):null;
    card.innerHTML=`
      <div class="stage-emoji">${s.emoji}</div>
      <div class="stage-name">Stage ${s.id}</div>
      <div class="stage-desc">${s.name}</div>
      ${done?'<div style="color:var(--green);font-size:.75rem;margin-top:4px;">✓ Done</div>':''}
      ${!unlocked?'<div class="stage-lock">🔒 Donekan tahap sebelumnya</div>':''}
    `;
    grid.appendChild(card);
  });
}

// ═══════════════════════════════════════════
// START STAGE
// ═══════════════════════════════════════════
function startStage(id){
  lsSet('skip-stage',id);
  state={stage:id,step:1};
  document.getElementById('game-title').textContent=STAGES[id-1].emoji+' '+STAGES[id-1].name;
  showGame();
}

// ═══════════════════════════════════════════
// RENDER GAME
// ═══════════════════════════════════════════
function renderGame(){
  const s=STAGES[state.stage-1];
  const area=document.getElementById('game-area');
  area.innerHTML='';

  // Progress
  const progress=lsGet('skip-progress',[]);
  const pct=Math.min(100,(progress.length/STAGES.length)*100);
  area.innerHTML+=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;

  // Instruction
  area.innerHTML+=`<div class="stage-info"><h3>${s.emoji} ${s.name}</h3><p>${s.instruction}</p></div>`;

  switch(s.type){
    case 'ladder': renderLadder(area,s); break;
    case 'rainbow': renderRainbow(area,s); break;
    case 'basket': renderBaskets(area,s); break;
  }

  // Parent content
  renderParentPanel();
}

function renderParentPanel(){
  const c=document.getElementById('parent-content');
  const progress=lsGet('skip-progress',[]);
  c.innerHTML='';
  STAGES.forEach(s=>{
    const done=progress.includes(s.id);
    const pct=Math.min(100,(done?100:0));
    c.innerHTML+=`
      <div class="panel-row">
        <div class="panel-row-label">
          <span>${s.emoji} Stage ${s.id}: ${s.name}</span>
          <span style="color:#666;font-size:.75rem;">${done?'✓':'not yet'}</span>
        </div>
        <div class="panel-bar"><div class="panel-bar-fill" style="width:${pct}%;background:${s.color}"></div></div>
      </div>
    `;
  });
}

// ─────────────────────────────────────────────
// LADDER (stage 1)
// ─────────────────────────────────────────────
function renderLadder(area, s){
  const done=lsGet('skip-done-'+s.id,[]);
  const current=lsGet('skip-current-'+s.id,1);
  const container=document.createElement('div');
  container.className='ladder-area';
  container.id='ladder-area';

  for(let i=1;i<=10;i++){
    const step=document.createElement('div');
    step.className='ladder-step';
    if(done.includes(i)) step.classList.add('done');
    if(i===current && !done.includes(i)) step.classList.add('current');
    step.dataset.num=i;
    step.innerHTML=`
      <div class="ladder-num" style="color:${done.includes(i)?'var(--green)':i===current?'var(--gold)':'var(--cream)'}">${i}</div>
      <div class="ladder-dots">
        ${Array(i).fill(0).map(()=>`<div class="ladder-dot" style="background:${done.includes(i)?'var(--green)':'rgba(255,255,255,.25)'}"></div>`).join('')}
      </div>
    `;
    step.onclick=()=>tapLadder(i,done,current,s.id);
    container.appendChild(step);
  }
  area.appendChild(container);
}

function tapLadder(num, done, current, stageId){
  if(num!==current) {
    // Shake wrong number
    const steps=document.querySelectorAll('.ladder-step');
    const el=Array.from(steps).find(s=>s.dataset.num==String(num));
    if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);}
    say('Not quite! It was '+current);
    return;
  }
  // Correct!
  const newDone=[...done,num];
  lsSet('skip-done-'+stageId,newDone);
  say(num+'! Benar!');
  if(num===10){
    // Stage complete
    const progress=lsGet('skip-progress',[]);
    if(!progress.includes(stageId)){
      progress.push(stageId);
      lsSet('skip-progress',progress);
    }
    confetti();
    say('Hebat! Stage 1 selesai!');
    setTimeout(showSelect,2000);
  } else {
    lsSet('skip-current-'+stageId,num+1);
    renderGame();
  }
}

// ─────────────────────────────────────────────
// RAINBOW (stages 2-4)
// ─────────────────────────────────────────────
function renderRainbow(area, s){
  const done=lsGet('skip-done-'+s.id,[]);
  const current=lsGet('skip-current-'+s.id,s.by);
  const container=document.createElement('div');
  container.className='rainbow-area';
  container.id='rainbow-area';

  const steps=[];
  for(let i=1;i<=10;i++) steps.push(s.by*i);
  const uniq=[...new Set(steps)];

  uniq.forEach(n=>{
    const step=document.createElement('div');
    step.className='rainbow-step';
    if(done.includes(n)) step.classList.add('done');
    if(n===current && !done.includes(n)) step.style.borderColor='var(--gold)';
    step.innerHTML=`
      <div class="rainbow-num" style="color:${done.includes(n)?'var(--green)':n===current?'var(--gold)':'var(--cream)'}">${n}</div>
      <div style="font-size:1.4rem;">${s.emoji}</div>
    `;
    step.onclick=()=>tapRainbow(n,done,current,s.id,s.by);
    container.appendChild(step);
  });
  area.appendChild(container);
}

function tapRainbow(num, done, current, stageId, by){
  if(num!==current){
    say('Not quite! Try '+current);
    return;
  }
  const newDone=[...done,num];
  lsSet('skip-done-'+stageId,newDone);
  say(num+'!');
  const last=Math.max(...uniqSteps(by));
  if(num===last){
    const progress=lsGet('skip-progress',[]);
    if(!progress.includes(stageId)){
      progress.push(stageId);
      lsSet('skip-progress',progress);
    }
    confetti();
    say('Hebat! Stage selesai!');
    setTimeout(showSelect,2000);
  } else {
    lsSet('skip-current-'+stageId,current+by);
    renderGame();
  }
}
function uniqSteps(by){ const s=[]; for(let i=by;i<=10*by;i+=by) s.push(i); return [...new Set(s)]; }

// ─────────────────────────────────────────────
// BASKETS (stages 5-6)
// ─────────────────────────────────────────────
function renderBaskets(area, s){
  const container=document.createElement('div');
  container.id='basket-game';

  // Build baskets
  const perGroup=Math.floor(s.total/s.groups);
  const baskets=Array.from({length:s.groups},(_,i)=>({target:perGroup,count:0,dots:[]}));

  container.innerHTML=`
    <div class="baskets" id="baskets-row">
      ${baskets.map((b,i)=>`
        <div class="basket" id="basket-${i}" style="background:${s.color}22;border:2px solid ${s.color}55;min-width:90px;min-height:90px;">
          <div class="basket-label" style="background:${s.color}44;color:var(--cream)">${perGroup}</div>
          <div class="basket-dots" id="basket-dots-${i}"></div>
          <div class="basket-count" id="basket-count-${i}">0/${perGroup}</div>
        </div>
      `).join('')}
    </div>
    <div class="total-display" id="total-display">Jumlah: <span id="total-num">0</span></div>
    <div class="instruction">Seret titik ke keranjang. Tiap keranjang harus sama banyak!</div>
    <div class="dot-pool" id="dot-pool"></div>
    <div class="action-row">
      <button class="btn btn-outline" onclick="resetBaskets()">🔄 Reset</button>
      <button class="btn btn-gold" onclick="checkBaskets()">✅ Check Answer</button>
    </div>
  `;
  area.appendChild(container);

  // Create source dots
  const pool=document.getElementById('dot-pool');
  for(let i=1;i<=s.total;i++){
    const dot=makeDot(i,s);
    pool.appendChild(dot);
  }
}

function makeDot(num, s){
  const d=document.createElement('div');
  d.className='dot';
  d.textContent=num;
  d.dataset.num=num;
  d.style.background=`hsl(${(num*37)%360},70%,55%)`;
  d.style.color='white';
  d.style.textShadow='0 1px 3px rgba(0,0,0,.4)';

  // Drag — pointer events (works on iPad)
  let startX=0,startY=0,lastX=0,lastY=0;
  let dragging=false;

  d.addEventListener('pointerdown',e=>{
    e.preventDefault();
    dragging=true;
    startX=e.clientX; startY=e.clientY;
    lastX=e.clientX; lastY=e.clientY;
    d.style.position='fixed';
    d.style.zIndex='999';
    d.style.left=(e.clientX-24)+'px';
    d.style.top=(e.clientY-24)+'px';
    d.setPointerCapture(e.pointerId);
    d.style.pointerEvents='none'; // while dragging, disable self
  });

  d.addEventListener('pointermove',e=>{
    if(!dragging) return;
    lastX=e.clientX; lastY=e.clientY;
    d.style.left=(e.clientX-24)+'px';
    d.style.top=(e.clientY-24)+'px';
  });

  d.addEventListener('pointerup', e => {
    if(!dragging) return;
    dragging=false;
    d.style.pointerEvents='auto'; // re-enable

    // Check which basket received this dot
    const baskets=document.querySelectorAll('.basket');
    let placed=false;
    baskets.forEach((b,i)=>{
      const r=b.getBoundingClientRect();
      if(lastX>=r.left && lastX<=r.right && lastY>=r.top && lastY<=r.bottom){
        const count=parseInt(b.dataset.count||'0');
        const target=parseInt(b.dataset.target||'0');
        if(count<target){
          // Move dot into basket
          const clone=d.cloneNode(true);
          clone.style.position='relative';
          clone.style.left='auto';clone.style.top='auto';
          clone.style.zIndex='1';
          clone.style.pointerEvents='none'; // basket dots non-interactive
          clone.style.animation='dotDrop .3s ease-out';
          const dotsEl=document.getElementById('basket-dots-'+i);
          if(dotsEl) dotsEl.appendChild(clone);
          b.dataset.count=count+1;
          const cntEl=document.getElementById('basket-count-'+i);
          if(cntEl) cntEl.textContent=(count+1)+'/'+target;
          // Remove source dot
          d.remove();
          placed=true;
          // Update total
          updateBasketTotal();
          // Check complete
          checkBasketsComplete();
        } else {
          // Basket full — shake and return
          b.classList.add('shake');
          setTimeout(()=>b.classList.remove('shake'),400);
          say('Baskets are full!');
          resetDotPosition(d,startX,startY);
        }
      }
    });

    if(!placed){
      resetDotPosition(d,startX,startY);
    }
  });

  d.addEventListener('pointercancel',e=>{
    dragging=false;
    d.style.pointerEvents='auto';
    resetDotPosition(d,startX,startY);
  });

  return d;
}

function resetDotPosition(d,x,y){
  d.style.position='relative';
  d.style.left='auto';d.style.top='auto';d.style.zIndex='1';
  d.style.pointerEvents='auto';
}

function updateBasketTotal(){
  let total=0;
  document.querySelectorAll('.basket').forEach(b=>{
    total+=parseInt(b.dataset.count||'0');
  });
  const el=document.getElementById('total-num');
  if(el) el.textContent=total;
}

function checkBasketsComplete(){
  const baskets=document.querySelectorAll('.basket');
  const allFull=Array.from(baskets).every(b=>{
    const c=parseInt(b.dataset.count||'0');
    const t=parseInt(b.dataset.target||'0');
    return c===t;
  });
  if(allFull){
    const s=STAGES[state.stage-1];
    const progress=lsGet('skip-progress',[]);
    if(!progress.includes(s.id)){
      progress.push(s.id);
      lsSet('skip-progress',progress);
    }
    confetti();
    say('Sempurna! Semua keranjang sama banyak!');
  }
}

function checkBaskets(){
  const baskets=document.querySelectorAll('.basket');
  const allFull=Array.from(baskets).every(b=>{
    const c=parseInt(b.dataset.count||'0');
    const t=parseInt(b.dataset.target||'0');
    return c===t;
  });
  const any=Array.from(baskets).some(b=>parseInt(b.dataset.count||'0')>0);
  if(allFull){
    const s=STAGES[state.stage-1];
    const progress=lsGet('skip-progress',[]);
    if(!progress.includes(s.id)){
      progress.push(s.id);
      lsSet('skip-progress',progress);
    }
    confetti();
    say('Hebat! Semua keranjang sama banyak!');
    setTimeout(showSelect,2000);
  } else if(!any){
    say('Seret titik dulu ke keranjang!');
  } else {
    say('Not quite the same. Try again!');
    // Highlight incomplete baskets
    baskets.forEach(b=>{
      const c=parseInt(b.dataset.count||'0');
      const t=parseInt(b.dataset.target||'0');
      if(c!==t){
        b.classList.add('shake');
        setTimeout(()=>b.classList.remove('shake'),400);
      }
    });
  }
}

function resetBaskets(){
  const s=STAGES[state.stage-1];
  // Remove all basket dots
  document.querySelectorAll('.basket').forEach(b=>{
    b.dataset.count='0';
    const dotsEl=b.querySelector('.basket-dots');
    if(dotsEl) dotsEl.innerHTML='';
    const cntEl=b.parentElement.querySelector('[id^="basket-count-"]');
    const t=parseInt(b.dataset.target||'0');
    if(cntEl) cntEl.textContent='0/'+t;
  });
  // Rebuild source dots
  const pool=document.getElementById('dot-pool');
  if(pool) pool.innerHTML='';
  for(let i=1;i<=s.total;i++){
    const dot=makeDot(i,s);
    pool.appendChild(dot);
  }
  const el=document.getElementById('total-num');
  if(el) el.textContent='0';
}

// ─────────────────────────────────────────────
// RABBITY
// ─────────────────────────────────────────────
function rabbitySpeak(){
  const msgs=['Let's learn! 📚','You're amazing! ⭐','It's okay, try again! 💪','Rabbity is so proud! 🐰'];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}

function say(text){
  const b=document.getElementById('rabbity-bubble');
  if(b){b.textContent='🐰 '+text;b.classList.add('show');}
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID';u.rate=.85;
    speechSynthesis.speak(u);
  }
  setTimeout(()=>{if(b)b.classList.remove('show')},3500);
}

// ─────────────────────────────────────────────
// PARENT PANEL
// ─────────────────────────────────────────────
function toggleParent(){
  const p=document.getElementById('parent-panel');
  if(!p)return;
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderParentPanel();
}

// ─────────────────────────────────────────────
// CONFETTI
// ─────────────────────────────────────────────
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti-container');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#EF5350','#66BB6A','#42A5F5','#AB47BC','#FF9800'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*.8)+'s';
    p.style.animationDuration='2.5s';
    c.appendChild(p);
  }
  setTimeout(()=>c.innerHTML='',3500);
}

  genStars();
  lsSet('skip-current-1',1);
  lsSet('skip-current-2',2);
  lsSet('skip-current-3',5);
  lsSet('skip-current-4',10);
  renderStageSelect();
  showScreen('home');
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const p=document.getElementById('parent-panel');
    if(p)p.classList.remove('open');
  }
});

window.addEventListener('load',init);
