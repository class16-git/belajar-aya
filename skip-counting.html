<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Skip Counting — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07071A;
  --card:#12123A;
  --gold:#FFD700;
  --green:#4CAF50;
  --blue:#42A5F5;
  --red:#EF5350;
  --purple:#AB47BC;
  --cream:#FFF8F0;
  --font-h:'Fredoka One',cursive;
  --font-b:'Quicksand',sans-serif;
}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--bg);
  font-family:var(--font-b);
  color:var(--cream);
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* ── Stars ── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{
  position:absolute;background:#fff;border-radius:50%;
  animation:tw var(--d,3s) ease-in-out infinite;
  animation-delay:var(--dl,0s);
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

/* ── Top bar ── */
.tbar{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px 8px;
  background:linear-gradient(to bottom,var(--bg) 70%,transparent);
}
.tbar-back,.tbar-btn{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:var(--cream);font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  text-decoration:none;
}
.tbar-back:active,.tbar-btn:active{transform:scale(.9)}
.tbar-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}

/* ── Home ── */
.hero{padding:4px 16px 16px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:2rem;color:var(--gold)}
.hero-sub{font-size:.78rem;opacity:.5;margin-top:2px}
.hero-emoji{font-size:3rem;margin-bottom:4px}

/* ── Stage cards ── */
.stage-list{
  display:flex;flex-direction:column;gap:10px;
  padding:0 16px 100px;position:relative;z-index:1;
}
.scard{
  background:var(--card);border-radius:18px;
  padding:14px 16px;box-shadow:0 4px 16px rgba(0,0,0,.35);
  cursor:pointer;border:none;width:100%;
  text-align:left;color:var(--cream);
  display:flex;gap:12px;align-items:center;
  transition:transform .15s;font-family:var(--font-b);
}
.scard:active{transform:scale(.97)}
.scard-num{
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);
  font-family:var(--font-h);font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.scard.done .scard-num{background:var(--green);border-color:var(--green);color:#fff}
.scard-name{font-family:var(--font-h);font-size:1rem}
.scard-desc{font-size:.72rem;opacity:.5}
.scard-arrow{margin-left:auto;font-size:.85rem;opacity:.4}

/* ── Play area ── */
.play{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.instr{
  background:rgba(255,255,255,.07);border-radius:14px;
  padding:10px 14px;margin:8px 0;
  font-size:.82rem;text-align:center;line-height:1.5;
  border:1px solid rgba(255,255,255,.08);
}
.basket-row{
  display:flex;justify-content:center;gap:10px;
  flex-wrap:wrap;margin:12px 0;
}
.basket{
  width:64px;min-height:64px;
  border:2px dashed rgba(255,255,255,.2);border-radius:14px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;
  transition:border-color .2s,background .2s;
}
.basket.drag-over{border-color:var(--green);background:rgba(76,175,80,.08)}
.basket-label{font-size:.62rem;opacity:.4}
.basket-num{font-family:var(--font-h);font-size:.72rem;opacity:.5}

.dot-pool{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:10px;
  background:rgba(255,255,255,.04);
  border-radius:14px;border:1px solid rgba(255,255,255,.06);
  margin:10px 0;min-height:60px;
}
.dot{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-size:1rem;
  cursor:pointer;transition:transform .15s;
  touch-action:none;
}
.dot:active{transform:scale(.88)}
.dot.dragging{
  position:fixed;z-index:999;pointer-events:none;
  transform:scale(1.1);
}

.total-row{text-align:center;margin:8px 0}
.total-label{font-family:var(--font-h);font-size:1.3rem;color:var(--gold)}

.success-box{
  background:rgba(76,175,80,.15);border:2px solid rgba(76,175,80,.4);
  border-radius:16px;padding:14px;text-align:center;margin:10px 0;
  display:none;
}
.success-box.on{display:block}
.success-emoji{font-size:2.5rem}
.success-text{font-family:var(--font-h);color:var(--green);font-size:1rem;margin-top:4px}

/* ── Buttons ── */
.btn{
  display:block;width:100%;max-width:320px;margin:8px auto;
  padding:13px 20px;border-radius:14px;border:none;
  cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;
  transition:transform .12s;
}
.btn:active{transform:scale(.96)}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-ghost{
  background:rgba(255,255,255,.08);color:var(--cream);
  border:1px solid rgba(255,255,255,.12);
}

/* ── FABs ── */
.fab{
  position:fixed;width:50px;height:50px;border-radius:50%;
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;z-index:100;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.fab:active{transform:scale(.9)}
.fab-home{left:20px;bottom:20px;background:var(--green);color:#fff}
.fab-parent{right:20px;bottom:20px;background:var(--gold);color:var(--bg)}
.fab-rabbity{right:20px;bottom:80px;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream)}

.bubble{
  position:fixed;bottom:138px;right:20px;z-index:99;
  background:var(--card);border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:10px 14px;
  max-width:210px;font-size:.8rem;line-height:1.5;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.bubble.on{opacity:1}

/* ── Parent panel ── */
.ppanel{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--cream);color:#333;
  border-radius:20px 20px 0 0;
  padding:20px 16px 90px;
  box-shadow:0 -4px 24px rgba(0,0,0,.2);
  z-index:99;max-height:70vh;overflow-y:auto;
  transform:translateY(110%);transition:transform .3s;
}
.ppanel.on{transform:translateY(0)}
.phan-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.phan-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.prow{margin-bottom:12px}
.prow-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}

/* ── Confetti ── */
.confetti{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
}
.conf{
  position:absolute;width:9px;height:9px;border-radius:2px;
  animation:cf 2.5s ease-out forwards;
}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- HOME SCREEN -->
<div class="screen on" id="s-home">
  <div class="tbar">
    <a href="index.html" class="tbar-btn">&#8592;</a>
    <div class="tbar-title">Skip Counting</div>
    <div style="width:42px"></div>
  </div>
  <div class="hero">
    <div class="hero-emoji">&#128049;</div>
    <div class="hero-title">Skip Counting</div>
    <div class="hero-sub">Jump through numbers!</div>
  </div>
  <div class="stage-list" id="stage-list"></div>
</div>

<!-- PLAY SCREEN -->
<div class="screen" id="s-play">
  <div class="tbar">
    <button class="tbar-back" id="play-back">&#8592;</button>
    <div class="tbar-title" id="play-title">Stage 1</div>
    <button class="tbar-btn" id="play-parent">&#128100;</button>
  </div>
  <div class="play">
    <div class="instr" id="play-instr">Drag dots into baskets!</div>
    <div class="basket-row" id="basket-row"></div>
    <div class="dot-pool" id="dot-pool"></div>
    <div class="total-row"><span class="total-label">Total: <span id="total-num">0</span></span></div>
    <div class="success-box" id="success-box">
      <div class="success-emoji">&#127882;</div>
      <div class="success-text" id="success-text">Great job!</div>
    </div>
    <button class="btn btn-gold" id="check-btn">Check Answer</button>
    <button class="btn btn-ghost" id="reset-btn">Try Again</button>
  </div>
</div>

<!-- FABs -->
<a href="index.html" class="fab fab-home">&#127968;</a>
<button class="fab fab-parent" id="fab-parent">&#128100;</button>
<button class="fab fab-rabbity" id="fab-rabbity">&#128049;</button>
<div class="bubble" id="bubble"></div>

<!-- Parent Panel -->
<div class="ppanel" id="ppanel">
  <div class="phan-handle"></div>
  <button onclick="togglePanel()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">&#10005;</button>
  <div class="phan-title">&#128202; Progress</div>
  <div id="pcontent"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
var STAGES = [
  { id:1, name:"Numbers 1 to 10", skip:1, desc:"Count one by one",        instr:"Tap the numbers in order!" },
  { id:2, name:"Skip by 2s",    skip:2, desc:"2, 4, 6, 8, 10",         instr:"Drag dots so each basket has the same number!" },
  { id:3, name:"Skip by 5s",    skip:5, desc:"5, 10, 15, 20, 25",       instr:"Drag dots by 5s into baskets!" },
  { id:4, name:"Skip by 10s",   skip:10,desc:"10, 20, 30, 40, 50",      instr:"Drag dots by 10s into baskets!" },
  { id:5, name:"Multiply by 2", skip:2,  mult:true, desc:"2, 4, 6, 8, 10", instr:"Drag dots by 2s — it is multiplication!" },
  { id:6, name:"Multiply by 3", skip:3,  mult:true, desc:"3, 6, 9, 12, 15", instr:"Drag dots by 3s — it is 3 times!" },
];

var STATE = null;

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function init(){
  genStars();
  ls("skip-s1",1);ls("skip-s2",1);ls("skip-s3",1);ls("skip-s4",1);
  renderHome();
}

function genStars(){
  var el=document.getElementById("stars");
  el.innerHTML="";
  for(var i=0;i<60;i++){
    var s=document.createElement("div");
    s.className="star";
    var sz=Math.random()*2+1;
    s.style.cssText="left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+sz+"px;height:"+sz+"px;--d:"+(Math.random()*2+2).toFixed(1)+"s;--dl:"+(Math.random()*3).toFixed(1)+"s";
    el.appendChild(s);
  }
}

function sc(name){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on");});
  document.getElementById("s-"+name).classList.add("on");
}

function renderHome(){
  var list=document.getElementById("stage-list");
  list.innerHTML="";
  STAGES.forEach(function(s){
    var done=lg("skip-s"+s.id,0)>1;
    var card=document.createElement("button");
    card.className="scard"+(done?" done":"");
    card.innerHTML='<div class="scard-num">'+(done?"&#10003;":s.id)+'</div>'+
      '<div><div class="scard-name">'+s.name+'</div><div class="scard-desc">'+s.desc+'</div></div>'+
      '<div class="scard-arrow">&#8594;</div>';
    card.onclick=function(){startStage(s);};
    list.appendChild(card);
  });
}

function startStage(s){
  STATE={
    stage:s,
    baskets:[[],[],[],[],[]],
    total:0,
    done:false
  };
  document.getElementById("play-title").textContent="Stage "+s.id+": "+s.name;
  document.getElementById("play-instr").textContent=s.instr;
  document.getElementById("success-box").classList.remove("on");
  renderBaskets();
  renderDots();
  document.getElementById("total-num").textContent="0";
  sc("play");
}

function renderBaskets(){
  var row=document.getElementById("basket-row");
  row.innerHTML="";
  for(var i=0;i<5;i++){
    (function(idx){
      var b=document.createElement("div");
      b.className="basket";
      b.id="basket-"+idx;
      var lbl=document.createElement("div");
      lbl.className="basket-label";
      lbl.textContent="Basket "+(idx+1);
      var cnt=document.createElement("div");
      cnt.className="basket-num";
      cnt.id="bnum-"+idx;
      cnt.textContent="0/"+STATE.stage.skip;
      b.appendChild(lbl);
      b.appendChild(cnt);
      row.appendChild(b);
    })(i);
  }
}

function renderDots(){
  var pool=document.getElementById("dot-pool");
  pool.innerHTML="";
  var count=STATE.stage.skip*5;
  var colors=["#EF5350","#FFCA28","#66BB6A","#42A5F5","#AB47BC","#FF7043","#26C6DA","#EC407A"];
  for(var i=1;i<=count;i++){
    var color=colors[(i-1)%colors.length];
    var d=document.createElement("div");
    d.className="dot";
    d.textContent=i;
    d.style.background=color+"33";
    d.style.color=color;
    d.style.border="2px solid "+color;
    d.dataset.num=i;
    d.style.pointerEvents="auto";

    d.addEventListener("pointerdown",function(ev){
      ev.preventDefault();
      if(STATE===null||STATE.done)return;
      var el=ev.currentTarget;
      if(el.closest(".basket"))return;
      dragStart(ev,el);
    });

    pool.appendChild(d);
  }
}

function dragStart(ev,el){
  var num=parseInt(el.dataset.num);
  var clone=el.cloneNode(true);
  clone.classList.add("dragging");
  clone.style.left=(ev.clientX-21)+"px";
  clone.style.top=(ev.clientY-21)+"px";
  document.body.appendChild(clone);
  el.style.opacity="0.25";
  el.style.pointerEvents="none";

  function onMove(e){
    clone.style.left=(e.clientX-21)+"px";
    clone.style.top=(e.clientY-21)+"px";
    // highlight basket
    document.querySelectorAll(".basket").forEach(function(b){b.classList.remove("drag-over");});
    var el2=document.elementFromPoint(e.clientX,e.clientY);
    if(el2){
      var b=el2.closest(".basket");
      if(b)b.classList.add("drag-over");
    }
  }

  function onUp(e){
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onUp);
    document.querySelectorAll(".basket").forEach(function(b){b.classList.remove("drag-over");});
    clone.remove();
    var target=document.elementFromPoint(e.clientX,e.clientY);
    if(target){
      var b=target.closest(".basket");
      if(b){
        var idx=parseInt(b.id.split("-")[1]);
        var already=STATE.baskets[idx].some(function(x){return x===num;});
        if(!already){
          STATE.baskets[idx].push(num);
          el.style.display="none";
          addDotToBasket(idx,num);
          recalcTotal();
          checkDone();
        } else {
          el.style.opacity="1";
          el.style.pointerEvents="auto";
        }
      } else {
        el.style.opacity="1";
        el.style.pointerEvents="auto";
      }
    } else {
      el.style.opacity="1";
      el.style.pointerEvents="auto";
    }
  }

  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
}

function addDotToBasket(bIdx,num){
  var basket=document.getElementById("basket-"+bIdx);
  var colors=["#EF5350","#FFCA28","#66BB6A","#42A5F5","#AB47BC","#FF7043","#26C6DA","#EC407A"];
  var color=colors[(num-1)%colors.length];
  var d=document.createElement("div");
  d.style.cssText="width:32px;height:32px;border-radius:50%;background:"+color+"33;color:"+color+";border:2px solid "+color+";display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:.85rem";
  d.textContent=num;
  basket.insertBefore(d,basket.firstChild);
  document.getElementById("bnum-"+bIdx).textContent=STATE.baskets[bIdx].length+"/"+STATE.stage.skip;
}

function recalcTotal(){
  var t=0;
  STATE.baskets.forEach(function(b){t+=b.length;});
  STATE.total=t;
  document.getElementById("total-num").textContent=t;
}

function checkDone(){
  var s=STATE.stage;
  var full=STATE.baskets.filter(function(b){return b.length===parseInt(s.skip);}).length;
  if(full===5){
    STATE.done=true;
    document.getElementById("success-box").classList.add("on");
    document.getElementById("success-text").textContent="All baskets full! Well done!";
  }
}

function checkAnswer(){
  if(STATE===null)return;
  var s=STATE.stage;
  var full=STATE.baskets.filter(function(b){return b.length===parseInt(s.skip);}).length;
  if(full===5){
    ls("skip-s"+s.id,2);
    doConfetti();
    say("Amazing! All baskets have the same number!");
    setTimeout(function(){renderHome();},2000);
  } else {
    say("Not quite. Each basket needs the same number of dots.");
  }
}

function resetStage(){
  if(STATE)startStage(STATE.stage);
}

function togglePanel(){
  var p=document.getElementById("ppanel");
  p.classList.toggle("on");
  if(p.classList.contains("on"))renderPanel();
}

function renderPanel(){
  var c=document.getElementById("pcontent");
  c.innerHTML="";
  STAGES.forEach(function(s){
    var done=lg("skip-s"+s.id,0)>1;
    var pct=done?100:0;
    c.innerHTML+='<div class="prow"><div class="prow-label">'+s.name+' <span>'+pct+'%</span></div><div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:#42A5F5;"></div></div></div>';
  });
}

function say(text){
  var b=document.getElementById("bubble");
  if(b){b.textContent="&#128049; "+text;b.classList.add("on");}
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="en-US";u.rate=0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){if(b)b.classList.remove("on");},3500);
}

function doConfetti(){
  var c=document.getElementById("confetti");
  c.innerHTML="";
  var colors=["#FFD700","#EF5350","#66BB6A","#42A5F5","#AB47BC","#FF9800"];
  for(var i=0;i<35;i++){
    var p=document.createElement("div");
    p.className="conf";
    p.style.left=Math.random()*100+"%";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=(Math.random()*0.7)+"s";
    p.style.animationDuration="2.5s";
    c.appendChild(p);
  }
  setTimeout(function(){c.innerHTML="";},3500);
}

// ── Event listeners ──
document.getElementById("play-back").onclick=function(){sc("home");};
document.getElementById("play-parent").onclick=togglePanel;
document.getElementById("fab-parent").onclick=togglePanel;
document.getElementById("fab-rabbity").onclick=function(){
  var msgs=["Let's go! &#128218;","You are amazing! &#11088;","Keep going! &#127775;","There is nothing wrong with trying again! &#128170;"];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
};
document.getElementById("check-btn").onclick=checkAnswer;
document.getElementById("reset-btn").onclick=resetStage;
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    document.getElementById("ppanel").classList.remove("on");
    if(document.getElementById("s-play").classList.contains("on"))sc("home");
  }
});

window.addEventListener("load",init);
</script>
</body>
</html>
