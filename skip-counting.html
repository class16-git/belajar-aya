<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Skip Counting — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07071A;--card:#12123A;--card2:#1a1a40;
  --gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;
  --red:#EF5350;--purple:#AB47BC;--orange:#FF7043;
  --cyan:#26C6DA;--cream:#FFF8F0;
  --font-h:'Fredoka One',cursive;
  --font-b:'Quicksand',sans-serif;
}
html,body{height:100%}
body{
  background:var(--bg);font-family:var(--font-b);
  color:var(--cream);touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}

/* Stars */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

/* Top bar */
.tbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.tbar-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.tbar-back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbar-btn:active,.tbar-back:active{transform:scale(.9)}
.tbar-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}

/* Home */
.hero{padding:12px 16px 8px;position:relative;z-index:1;text-align:center}
.hero-emoji{font-size:3.5rem;margin-bottom:4px}
.hero-title{font-family:var(--font-h);font-size:1.8rem;color:var(--gold)}
.hero-sub{font-size:.78rem;opacity:.5;margin-top:2px}

.stage-list{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.scard{
  background:var(--card);border-radius:18px;padding:14px 16px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);display:flex;gap:12px;
  align-items:center;transition:transform .15s;font-family:var(--font-b);
}
.scard:active{transform:scale(.97)}
.scard.locked{opacity:.5;cursor:not-allowed}
.scard.locked:active{transform:none}
.scard-icon{font-size:2rem;flex-shrink:0}
.scard-name{font-family:var(--font-h);font-size:.95rem}
.scard-desc{font-size:.72rem;opacity:.5}
.scard-status{margin-left:auto;font-size:.75rem;padding:3px 8px;border-radius:8px}
.scard-status.done{background:rgba(76,175,80,.2);color:var(--green)}
.scard-status.locked{background:rgba(255,255,255,.08);color:rgba(255,255,255,.3)}

/* Work area */
.work{padding:8px 16px 100px;flex:1;position:relative;z-index:1}
.instr{
  background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;
  font-size:.82rem;text-align:center;line-height:1.5;
  border:1px solid rgba(255,255,255,.08);margin:8px 0;
}
.instr-big{font-size:.95rem}

/* BUILD stage */
.build-pool{
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
  padding:10px;background:rgba(255,255,255,.04);
  border-radius:14px;border:1px solid rgba(255,255,255,.06);
  margin:10px 0;min-height:70px;
}
.build-item{
  font-size:1.8rem;cursor:grab;transition:transform .15s;
  display:flex;align-items:center;justify-content:center;
  padding:4px;touch-action:none;
}
.build-item:active{transform:scale(.85)}
.build-item.placed{opacity:.25;pointer-events:none}
.group-row{
  display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0;
}
.group-box{
  width:68px;min-height:68px;border:2px dashed rgba(255,255,255,.15);
  border-radius:14px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  transition:border-color .2s,background .2s;
}
.group-box.drag-over{border-color:var(--green);background:rgba(76,175,80,.06)}
.group-box.full{border-color:var(--green);border-style:solid;background:rgba(76,175,80,.08)}
.group-label{font-size:.6rem;opacity:.35}
.group-count{font-family:var(--font-h);font-size:.75rem;opacity:.5}

/* Piko bunny */
.bunny-area{text-align:center;padding:8px 0 4px}
.bunny-label{font-family:var(--font-h);font-size:.85rem;color:var(--gold);margin-bottom:4px}
.bunny-rule{font-size:2rem;margin-bottom:4px}

/* Number line */
.num-line{
  display:flex;justify-content:flex-start;align-items:center;
  padding:16px 8px;gap:0;overflow-x:auto;margin:10px 0;
  position:relative;
}
.num-spot{
  flex-shrink:0;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-size:.9rem;cursor:pointer;
  transition:all .2s;position:relative;
}
.num-spot.landed{background:var(--green);color:#fff;transform:scale(1.15)}
.num-spot.current{background:var(--gold);color:var(--bg);transform:scale(1.2);box-shadow:0 0 0 4px rgba(255,215,0,.3)}
.num-spot.dimmed{opacity:.25}
.num-spot:not(.dimmed):not(.current):hover{background:rgba(255,255,255,.1)}
.num-connector{width:8px;height:2px;background:rgba(255,255,255,.15);flex-shrink:0}

/* Pattern board */
.pattern-board{
  display:grid;grid-template-columns:repeat(5,1fr);gap:6px;
  max-width:340px;margin:0 auto;
}
.num-cell{
  aspect-ratio:1;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-h);font-size:.9rem;cursor:pointer;
  transition:all .2s;
}
.num-cell.highlighted{background:rgba(76,175,80,.2);border-color:var(--green);color:var(--green);transform:scale(1.05)}
.num-cell.selected{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold);transform:scale(1.08)}
.num-cell.wrong{background:rgba(239,83,80,.2);border-color:var(--red);color:var(--red)}

/* Choices */
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.choice{
  min-width:64px;min-height:64px;border-radius:16px;
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);
  color:var(--cream);font-family:var(--font-h);font-size:1.6rem;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;
  justify-content:center;padding:8px 12px;
}
.choice:active{transform:scale(.9)}
.choice.right{background:rgba(76,175,80,.2);border-color:var(--green);color:var(--green)}
.choice.wrong{background:rgba(239,83,80,.2);border-color:var(--red);color:var(--red)}
.choice.hint{background:rgba(255,215,0,.1);border-color:var(--gold);color:var(--gold)}

/* Success */
.success-card{
  background:rgba(76,175,80,.12);border:2px solid rgba(76,175,80,.35);
  border-radius:16px;padding:14px;text-align:center;margin:12px 0;
}
.success-emoji{font-size:2.5rem}
.success-text{font-family:var(--font-h);color:var(--green);font-size:1rem;margin-top:4px}
.success-sub{font-size:.8rem;opacity:.6;margin-top:4px}

/* Progress bar */
.prog-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:10px 0}
.prog-fill{height:100%;background:linear-gradient(to right,var(--green),var(--cyan));border-radius:3px;transition:width .4s}

/* Buttons */
.btn{display:block;width:100%;max-width:300px;margin:8px auto;padding:13px 20px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.btn-green{background:var(--green);color:#fff}
.btn-hint{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:var(--gold)}

/* FABs */
.fab{position:fixed;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fab:active{transform:scale(.9)}
.fab-home{left:20px;bottom:20px;background:var(--green);color:#fff}
.fab-parent{right:20px;bottom:20px;background:var(--gold);color:var(--bg)}
.fab-piko{right:20px;bottom:80px;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream)}
.bubble{position:fixed;bottom:138px;right:20px;z-index:99;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;max-width:210px;font-size:.8rem;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.bubble.on{opacity:1}

/* Parent panel */
.ppanel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.ppanel.on{transform:translateY(0)}
.phan-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.phan-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.prow{margin-bottom:12px}
.prow-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.conf{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 2.5s ease-out forwards}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Dragging ghost */
.drag-ghost{position:fixed;pointer-events:none;z-index:999;font-size:2rem;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}

/* Animations */
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(76,175,80,.4)}50%{box-shadow:0 0 0 8px rgba(76,175,80,0)}}
.pop-in{animation:popIn .3s ease forwards}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen on" id="s-home">
  <div class="tbar">
    <a href="index.html" class="tbar-btn">&#8592;</a>
    <div class="tbar-title">Skip Counting</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="hero">
    <div class="hero-emoji">🐱</div>
    <div class="hero-title">Skip Counting</div>
    <div class="hero-sub">Jump through numbers with Piko!</div>
  </div>
  <div class="prog-bar" style="margin:0 16px 8px"><div class="prog-fill" id="total-prog" style="width:0%"></div></div>
  <div class="stage-list" id="stage-list"></div>
</div>

<!-- WORK -->
<div class="screen" id="s-work">
  <div class="tbar">
    <button class="tbar-back" onclick="goHome()">&#8592;</button>
    <div class="tbar-title" id="work-title">Stage</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="work" id="work-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="fab fab-home">&#127968;</a>
<button class="fab fab-parent" onclick="togglePanel()">&#128100;</button>
<button class="fab fab-piko" onclick="pikoSpeak()">🐱</button>
<div class="bubble" id="bubble"></div>

<!-- Parent Panel -->
<div class="ppanel" id="ppanel">
  <div class="phan-handle"></div>
  <button onclick="togglePanel()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">&#10005;</button>
  <div class="phan-title">&#128202; Piko's Journey</div>
  <div id="pcontent"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
// ─────────────────────────────────────────────
// STAGES — ordered by Montessori progression
// ─────────────────────────────────────────────
var STAGES = [
  {
    id: 1, emoji: "&#128207;", color: "#EF5350",
    name: "Build Equal Groups",
    desc: "Put objects together in groups",
    type: "build"
  },
  {
    id: 2, emoji: "🐱", color: "#FFD700",
    name: "Jump Along the Line",
    desc: "Watch Piko jump on the number line",
    type: "jump"
  },
  {
    id: 3, emoji: "&#127912;", color: "#66BB6A",
    name: "See the Pattern",
    desc: "Find where Piko lands on the board",
    type: "pattern"
  },
  {
    id: 4, emoji: "&#128173;", color: "#42A5F5",
    name: "What Comes Next?",
    desc: "Predict the next number",
    type: "next"
  },
  {
    id: 5, emoji: "&#128269;", color: "#AB47BC",
    name: "Find the Missing Number",
    desc: "Figure out what is missing",
    type: "missing"
  },
  {
    id: 6, emoji: "&#128752;", color: "#FF7043",
    name: "Rule Detective",
    desc: "Discover Piko's jumping rule",
    type: "detective"
  }
];

var OBJECTS = ["🎌", "🍕", "🍎", "🧽", "🐦", "🌸"];

var STATE = null;

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function init(){
  genStars();
  renderHome();
}

function genStars(){
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for(var i=0;i<60;i++){
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random()*2+1;
    s.style.cssText = "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+sz+"px;height:"+sz+"px;--d:"+(Math.random()*2+2).toFixed(1)+"s;--dl:"+(Math.random()*3).toFixed(1)+"s";
    el.appendChild(s);
  }
}

function sc(name){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on");});
  document.getElementById("s-"+name).classList.add("on");
}

function goHome(){
  sc("home");
  renderHome();
}

function renderHome(){
  var prog = lg("sc-prog", {});
  var totalDone = Object.keys(prog).filter(function(k){return prog[k];}).length;
  var pct = Math.round((totalDone/STAGES.length)*100);
  var progEl = document.getElementById("total-prog");
  if(progEl) progEl.style.width = pct + "%";

  var list = document.getElementById("stage-list");
  list.innerHTML = "";
  STAGES.forEach(function(s){
    var done = !!prog["stage-"+s.id];
    var locked = !done && totalDone < (s.id-1) && s.id > 1;
    var card = document.createElement("button");
    card.className = "scard" + (locked ? " locked" : "");
    card.innerHTML =
      '<div class="scard-icon" style="color:'+s.color+'">'+s.emoji+'</div>'+
      '<div><div class="scard-name">'+s.name+'</div><div class="scard-desc">'+s.desc+'</div></div>'+
      '<div class="scard-status '+(done?"done":(locked?"locked":"--"))+'">'+(done?"Done":(locked?"Locked":"Start"))+'</div>';
    if(!locked) card.onclick = function(){ startStage(s); };
    list.appendChild(card);
  });
}

function startStage(s){
  STATE = { stage: s, data: {} };
  document.getElementById("work-title").textContent = s.emoji+" "+s.name;
  var area = document.getElementById("work-area");
  area.innerHTML = "";
  switch(s.type){
    case "build":  renderBuild(area, s); break;
    case "jump":   renderJump(area, s); break;
    case "pattern":renderPattern(area, s); break;
    case "next":   renderNext(area, s); break;
    case "missing":renderMissing(area, s); break;
    case "detective":renderDetective(area, s); break;
  }
  sc("work");
}

// ═══════════════════════════════════════════════
// STAGE 1 — BUILD EQUAL GROUPS
// Concrete → groups of N
// ═══════════════════════════════════════════════
function renderBuild(area, s){
  var sizes = [2, 5, 10];
  var jump = sizes[Math.floor(Math.random()*sizes.length)];
  var groupCount = 3;
  var items = [];
  for(var i=0;i<jump*groupCount;i++) items.push(OBJECTS[i%OBJECTS.length]);

  area.innerHTML =
    '<div class="instr">Put '+jump+' objects in each group!</div>'+
    '<div class="build-pool" id="build-pool"></div>'+
    '<div class="group-row" id="group-row"></div>'+
    '<div id="build-success"></div>'+
    '<button class="btn btn-ghost" onclick="startStage(STATE.stage)">Try Again</button>';

  var pool = document.getElementById("build-pool");
  var row = document.getElementById("group-row");
  STATE.build = { jump: jump, groups: Array(groupCount).fill(0), done: false };

  // Shuffle items
  items.sort(function(){return Math.random()-0.5;});

  items.forEach(function(item, i){
    var el = document.createElement("div");
    el.className = "build-item";
    el.innerHTML = item;
    el.dataset.idx = i;
    el.style.animationDelay = (i*0.04)+"s";
    el.addEventListener("pointerdown", function(ev){
      ev.preventDefault();
      if(STATE===null||STATE.build.done) return;
      if(el.classList.contains("placed")) return;
      startDrag(ev, el, item);
    });
    pool.appendChild(el);
  });

  for(var g=0;g<groupCount;g++){
    (function(gid){
      var box = document.createElement("div");
      box.className = "group-box";
      box.id = "group-"+gid;
      box.innerHTML = '<div class="group-label">Group '+(gid+1)+'</div><div class="group-count" id="gc-'+gid+'">0/'+jump+'</div>';
      
      row.appendChild(box);
    })(g);
  }
}

function startDrag(ev, el, item){
  var clone = el.cloneNode(true);
  clone.className = "drag-ghost";
  clone.dataset.idx = el.dataset.idx;
  clone.style.left = ev.clientX+"px";
  clone.style.top = ev.clientY+"px";
  clone.style.pointerEvents = "none";
  document.body.appendChild(clone);

  function onMove(e){
    clone.style.left = (e.clientX - 20)+"px";
    clone.style.top = (e.clientY - 20)+"px";
    document.querySelectorAll(".group-box").forEach(function(b){ b.classList.remove("drag-over"); });
    var el2 = document.elementFromPoint(e.clientX, e.clientY);
    if(el2) { var b = el2.closest(".group-box"); if(b) b.classList.add("drag-over"); }
  }
  function onUp(e){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    // Find which group the ghost center is over
    var rect = clone.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    clone.remove();
    document.querySelectorAll(".group-box").forEach(function(b){ b.classList.remove("drag-over"); });
    var el2 = document.elementFromPoint(cx, cy);
    var box = el2 ? el2.closest(".group-box") : null;
    if(!box || STATE === null || STATE.build.done) return;
    var gid = parseInt(box.id.split("-")[1]);
    if(isNaN(gid)) return;
    if(STATE.build.groups[gid] >= STATE.build.jump) { say("That group is full!"); return; }
    // Find the actual pool element for this idx
    var actualEl = document.querySelector(".build-item[data-idx=\""+clone.dataset.idx+"\"]:not(.placed)");
    if(!actualEl) return;
    // Place
    STATE.build.groups[gid]++;
    document.getElementById("gc-"+gid).textContent = STATE.build.groups[gid]+"/"+STATE.build.jump;
    var chip = document.createElement("span");
    chip.innerHTML = actualEl.innerHTML;
    chip.style.cssText = "font-size:1.4rem;display:inline-block;animation:popIn .2s ease";
    box.insertBefore(chip, box.firstChild);
    actualEl.style.opacity = "0.25";
    actualEl.style.pointerEvents = "none";
    actualEl.classList.add("placed");
    if(STATE.build.groups[gid] >= STATE.build.jump) box.classList.add("full");
    checkBuildDone();
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
}

function checkBuildDone(){
  if(STATE===null||STATE.build.done) return;
  var full = STATE.build.groups.filter(function(n){return n===STATE.build.jump;}).length;
  if(full === STATE.build.groups.length){
    STATE.build.done = true;
    document.getElementById("build-success").innerHTML =
      '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">All groups are full!</div><div class="success-sub">You made '+STATE.build.groups.length+' equal groups of '+STATE.build.jump+'</div></div>';
    ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-1":true}));
    confetti();
    say("You made equal groups! That is the start of skip counting!");
  }
}

// ═══════════════════════════════════════════════
// STAGE 2 — JUMP ALONG THE LINE
// Visual → Piko jumps on number line
// ═══════════════════════════════════════════════
function renderJump(area, s){
  var jumps = [2, 5, 10];
  var jump = jumps[Math.floor(Math.random()*jumps.length)];
  var max = jump * 5;

  area.innerHTML =
    '<div class="bunny-area">'+
      '<div class="bunny-label">Piko\'s Rule</div>'+
      '<div class="bunny-rule" style="color:var(--gold)">+'+jump+'</div>'+
    '</div>'+
    '<div class="instr instr-big">Tap the numbers Piko lands on!</div>'+
    '<div class="num-line" id="num-line"></div>'+
    '<div style="text-align:center;margin:8px 0">'+
      '<div id="jump-landed" style="font-family:var(--font-h);font-size:1.4rem;color:var(--gold);min-height:2rem"></div>'+
    '</div>'+
    '<div class="choices" id="jump-choices"></div>'+
    '<div id="jump-success"></div>';

  STATE.jump = { jump: jump, landed: [], correct: 0 };

  var line = document.getElementById("num-line");
  for(var n=0;n<=max;n++){
    if(n>0){
      var conn = document.createElement("div");
      conn.className = "num-connector";
      line.appendChild(conn);
    }
    var spot = document.createElement("div");
    spot.className = "num-spot";
    spot.textContent = n;
    spot.id = "ns-"+n;
    spot.onclick = (function(num){
      return function(){ jumpTap(num); };
    })(n);
    line.appendChild(spot);
  }

  // Show first landing
  say("Piko starts at 0 and jumps "+jump+"! Tap "+jump+" next!");
}

function jumpTap(n){
  if(STATE===null||STATE.jump.done) return;
  var j = STATE.jump.jump;
  var expected = STATE.jump.landed.length === 0 ? j : STATE.jump.landed[STATE.jump.landed.length-1]+j;

  if(n === expected && !STATE.jump.landed.includes(n)){
    STATE.jump.landed.push(n);
    STATE.jump.correct++;
    var spot = document.getElementById("ns-"+n);
    if(spot) spot.classList.add("landed");
    document.getElementById("jump-landed").textContent = "Landed: "+n+"!";

    // Dim wrong earlier spots
    for(var i=0;i<n;i++){
      if(!STATE.jump.landed.includes(i)){
        var s2 = document.getElementById("ns-"+i);
        if(s2) s2.classList.add("dimmed");
      }
    }

    say("Yes! "+n+"!");
    if(n === STATE.jump.jump * 5){
      STATE.jump.done = true;
      setTimeout(function(){
        document.getElementById("jump-success").innerHTML =
          '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">Piko reached '+n+'!</div><div class="success-sub">The pattern: +'+j+' every time!</div></div>';
        ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-2":true}));
        confetti();
        say("Piko's rule is always +"+j+". You found the pattern!");
      }, 500);
    } else {
      var next = expected+j;
      say("Next jump: "+next+"! Keep going!");
    }
  } else if(STATE.jump.landed.includes(n)) {
    say("You already landed on "+n+"!");
  } else {
    // Wrong tap — show hint
    var spot = document.getElementById("ns-"+n);
    if(spot) { spot.classList.add("wrong"); setTimeout(function(){ spot.classList.remove("wrong"); }, 600); }
    var last = STATE.jump.landed.length > 0 ? STATE.jump.landed[STATE.jump.landed.length-1] : 0;
    say("Piko jumps +"+j+". From "+last+" we land on "+(last+j)+"!");
  }
}

// ═══════════════════════════════════════════════
// STAGE 3 — SEE THE PATTERN
// Visual → number board, highlight jump pattern
// ═══════════════════════════════════════════════
function renderPattern(area, s){
  var jumps = [2, 5, 10];
  var jump = jumps[Math.floor(Math.random()*jumps.length)];
  var max = jump * 4;

  area.innerHTML =
    '<div class="bunny-area">'+
      '<div class="bunny-label">Find all the numbers Piko lands on!</div>'+
      '<div class="bunny-rule" style="color:var(--gold)">+'+jump+'</div>'+
    '</div>'+
    '<div class="instr">Tap every number Piko lands on when jumping by '+jump+'</div>'+
    '<div class="pattern-board" id="pattern-board"></div>'+
    '<div style="text-align:center;margin:8px 0"><div id="pattern-count" style="font-family:var(--font-h);font-size:1.1rem;opacity:.6"></div></div>'+
    '<div id="pattern-success"></div>';

  STATE.pattern = { jump: jump, found: [], target: jump*4, done: false };

  var board = document.getElementById("pattern-board");
  for(var n=1;n<=max;n++){
    var cell = document.createElement("div");
    cell.className = "num-cell";
    cell.textContent = n;
    cell.dataset.num = n;
    cell.onclick = (function(num){
      return function(){
        if(STATE===null||STATE.pattern.done) return;
        if(num % jump !== 0){
          cell.classList.add("wrong");
          setTimeout(function(){ cell.classList.remove("wrong"); }, 500);
          say("Piko does not land on "+num+" when jumping by "+jump+"!");
          return;
        }
        if(STATE.pattern.found.includes(num)){
          say("You already found "+num+"!");
          return;
        }
        STATE.pattern.found.push(num);
        cell.classList.add("highlighted");
        document.getElementById("pattern-count").textContent = "Found: "+STATE.pattern.found.length+" / "+STATE.pattern.target/jump;
        say("Yes! "+num+"!");
        if(STATE.pattern.found.length >= max/jump){
          STATE.pattern.done = true;
          document.getElementById("pattern-success").innerHTML =
            '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">You found all the pattern numbers!</div><div class="success-sub">Every '+jump+'th number: '+Array.from({length:max/jump+1},function(_,i){return i*jump;}).join(", ")+'</div></div>';
          ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-3":true}));
          confetti();
          say("You found the "+jump+"s pattern! Every "+jump+"th number!");
        }
      };
    })(n);
    board.appendChild(cell);
  }
}

// ═══════════════════════════════════════════════
// STAGE 4 — WHAT COMES NEXT?
// Symbolic → predict next number
// ═══════════════════════════════════════════════
function renderNext(area, s){
  var jumps = [2, 5, 10];
  var jump = jumps[Math.floor(Math.random()*jumps.length)];
  var start = Math.floor(Math.random()*3)*jump;
  var seqLen = 3;
  var seq = [];
  for(var i=0;i<seqLen;i++) seq.push(start + i*jump);
  var next = start + seqLen*jump;

  // Make wrong choices
  var choices = [next];
  while(choices.length < 3){
    var wrong = next + (Math.floor(Math.random()*4)-2)*jump;
    if(wrong > 0 && !choices.includes(wrong) && wrong !== next) choices.push(wrong);
  }
  choices.sort(function(){return Math.random()-0.5;});

  area.innerHTML =
    '<div class="bunny-area">'+
      '<div class="bunny-label">Piko\'s Rule</div>'+
      '<div class="bunny-rule" style="color:var(--gold)">+'+jump+'</div>'+
    '</div>'+
    '<div class="instr instr-big">What comes next in Piko\'s sequence?</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0">'+
      seq.map(function(n){
        return '<div style="width:54px;height:54px;border-radius:50%;background:rgba(76,175,80,.15);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.3rem;color:var(--green)">'+n+'</div>';
      }).join('<div style="color:var(--gold);font-size:1.2rem;align-self:center">&#10140;</div>')+
      '<div style="width:54px;height:54px;border-radius:50%;background:rgba(255,215,0,.15);border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.3rem;color:var(--gold)">?</div>'+
    '</div>'+
    '<div class="choices" id="next-choices"></div>'+
    '<div id="next-success"></div>'+
    '<button class="btn btn-hint" onclick="showNextHint()">Show Hint</button>';

  STATE.nextQ = { jump: jump, seq: seq, next: next, answered: false };
  var choicesEl = document.getElementById("next-choices");

  choices.forEach(function(c){
    var btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = c;
    btn.onclick = function(){
      if(STATE.nextQ.answered) return;
      if(c === next){
        btn.classList.add("right");
        STATE.nextQ.answered = true;
        say("Yes! "+next+" comes next!");
        document.getElementById("next-success").innerHTML =
          '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">'+seq.join(" \u2192 ")+" \u2192 "+next+'!</div><div class="success-sub">The jump is always +'+jump+'</div></div>';
        ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-4":true}));
        confetti();
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        say("Not quite. Piko jumps by +"+jump+"!");
      }
    };
    choicesEl.appendChild(btn);
  });
}

function showNextHint(){
  if(STATE===null||!STATE.nextQ||STATE.nextQ.answered) return;
  var last = STATE.nextQ.seq[STATE.nextQ.seq.length-1];
  say("The rule is +"+STATE.nextQ.jump+". "+last+" + "+STATE.nextQ.jump+" = ?");
}

// ═══════════════════════════════════════════════
// STAGE 5 — FIND THE MISSING NUMBER
// Structural → missing number in sequence
// ═══════════════════════════════════════════════
function renderMissing(area, s){
  var jumps = [2, 5, 10];
  var jump = jumps[Math.floor(Math.random()*jumps.length)];
  var start = Math.floor(Math.random()*2)*jump;
  var seqLen = 4;
  var seq = [];
  for(var i=0;i<seqLen;i++) seq.push(start + i*jump);
  var missingIdx = 1 + Math.floor(Math.random()*(seqLen-1)); // Don't remove first or last
  var missing = seq[missingIdx];
  seq[missingIdx] = null;

  var choices = [missing];
  while(choices.length < 3){
    var wrong = missing + (Math.floor(Math.random()*6)-3)*jump;
    if(wrong > 0 && !choices.includes(wrong) && wrong !== missing) choices.push(wrong);
  }
  choices.sort(function(){return Math.random()-0.5;});

  area.innerHTML =
    '<div class="bunny-area">'+
      '<div class="bunny-label">Piko\'s Rule</div>'+
      '<div class="bunny-rule" style="color:var(--gold)">+'+jump+'</div>'+
    '</div>'+
    '<div class="instr instr-big">What number is Piko missing?</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0">'+
      seq.map(function(n){
        if(n === null){
          return '<div style="width:54px;height:54px;border-radius:50%;background:rgba(255,215,0,.15);border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.3rem;color:var(--gold)">?</div>';
        }
        return '<div style="width:54px;height:54px;border-radius:50%;background:rgba(76,175,80,.15);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.3rem;color:var(--green)">'+n+'</div>';
      }).join('<div style="color:var(--gold);font-size:1.2rem;align-self:center">&#8594;</div>')+
    '</div>'+
    '<div class="choices" id="missing-choices"></div>'+
    '<div id="missing-success"></div>'+
    '<button class="btn btn-hint" onclick="showMissingHint()">Show Hint</button>';

  STATE.missingQ = { jump: jump, missing: missing, answered: false };
  var choicesEl = document.getElementById("missing-choices");

  choices.forEach(function(c){
    var btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = c;
    btn.onclick = function(){
      if(STATE.missingQ.answered) return;
      if(c === missing){
        btn.classList.add("right");
        STATE.missingQ.answered = true;
        say("Yes! "+missing+" was missing!");
        document.getElementById("missing-success").innerHTML =
          '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">You found the missing number!</div><div class="success-sub">The sequence was '+seq.map(function(n){return n===null?"?":n;}).join(" \u2192 ")+'</div></div>';
        ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-5":true}));
        confetti();
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        say("Not quite. Piko jumps by +"+jump+"!");
      }
    };
    choicesEl.appendChild(btn);
  });
}

function showMissingHint(){
  if(STATE===null||!STATE.missingQ||STATE.missingQ.answered) return;
  var before = STATE.missingQ.jump;
  say("The rule is +"+STATE.missingQ.jump+". Look at the number before and after ?");
}

// ═══════════════════════════════════════════════
// STAGE 6 — RULE DETECTIVE
// Systems thinking → identify the rule
// ═══════════════════════════════════════════════
function renderDetective(area, s){
  var jump = [2, 5, 10][Math.floor(Math.random()*3)];
  var start = Math.floor(Math.random()*2)*jump;
  var seqLen = 4;
  var seq = [];
  for(var i=0;i<seqLen;i++) seq.push(start + i*jump);

  var rules = [2, 5, 10];
  var choices = rules.filter(function(r){return r!==jump;});
  choices.push(jump);
  choices.sort(function(){return Math.random()-0.5;});

  area.innerHTML =
    '<div class="bunny-area">'+
      '<div class="bunny-label">What is Piko\'s rule?</div>'+
      '<div style="font-size:.82rem;opacity:.5;margin-bottom:8px">Look at the pattern below...</div>'+
    '</div>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0">'+
      seq.map(function(n){
        return '<div style="width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.1rem">'+n+'</div>';
      }).join('<div style="color:var(--gold);font-size:1.2rem;align-self:center">&#10140;</div>')+
    '</div>'+
    '<div class="instr">The rule is +...?</div>'+
    '<div class="choices" id="det-choices"></div>'+
    '<div id="det-success"></div>';

  STATE.detQ = { jump: jump, answered: false };
  var choicesEl = document.getElementById("det-choices");

  choices.forEach(function(c){
    var btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = "+"+c;
    btn.onclick = function(){
      if(STATE.detQ.answered) return;
      if(c === jump){
        btn.classList.add("right");
        STATE.detQ.answered = true;
        say("Correct! Piko jumps by +"+jump+" every time!");
        document.getElementById("det-success").innerHTML =
          '<div class="success-card"><div class="success-emoji">🎊</div><div class="success-text">You are a Rule Detective!</div><div class="success-sub">The rule was +'+jump+". Every jump is the same size!"+'</div></div>';
        ls("sc-prog", Object.assign(lg("sc-prog",{}),{"stage-6":true}));
        confetti();
      } else {
        btn.classList.add("wrong");
        btn.disabled = true;
        say("The rule is +"+jump+"! Try to remember next time!");
      }
    };
    choicesEl.appendChild(btn);
  });
}

// ─────────────────────────────────────────────
// TTS + CONFETTI
// ─────────────────────────────────────────────
function say(text){
  var b = document.getElementById("bubble");
  if(b){ b.textContent = "\uD83D\uDC3B " + text; b.classList.add("on"); }
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){ if(b) b.classList.remove("on"); }, 3500);
}

function pikoSpeak(){
  var msgs = [
    "Piko loves jumping by equal amounts!",
    "Every jump is the same size!",
    "Can you find the pattern?",
    "You are a wonderful pattern detective!",
    "Equal jumps make equal patterns!"
  ];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}

function confetti(){
  var c = document.getElementById("confetti");
  if(!c) return;
  c.innerHTML = "";
  var colors = ["#FFD700","#EF5350","#66BB6A","#42A5F5","#AB47BC","#FF9800"];
  for(var i=0;i<35;i++){
    var p = document.createElement("div");
    p.className = "conf";
    p.style.left = Math.random()*100+"%";
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*0.7)+"s";
    p.style.animationDuration = "2.5s";
    c.appendChild(p);
  }
  setTimeout(function(){ c.innerHTML = ""; }, 3500);
}

// ─────────────────────────────────────────────
// PARENT PANEL
// ─────────────────────────────────────────────
function togglePanel(){
  var p = document.getElementById("ppanel");
  if(!p) return;
  p.classList.toggle("on");
  if(p.classList.contains("on")) renderPanel();
}

function renderPanel(){
  var c = document.getElementById("pcontent");
  if(!c) return;
  var prog = lg("sc-prog", {});
  c.innerHTML = '<div style="font-size:.78rem;opacity:.6;margin-bottom:14px">Piko\'s Skip Counting Journey</div>';
  STAGES.forEach(function(s){
    var done = !!prog["stage-"+s.id];
    var pct = done ? 100 : 0;
    var status = done ? "Completed" : "Not started";
    c.innerHTML += '<div class="prow"><div class="prow-label"><span style="font-size:.85rem">'+s.emoji+' '+s.name+'</span> <span style="font-size:.75rem;opacity:.6">'+status+'</span></div><div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:'+s.color+';"></div></div></div>';
  });
}

  if(e.key === "Escape"){
    document.getElementById("ppanel").classList.remove("on");
    goHome();
  }
});
