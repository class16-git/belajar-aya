<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity &amp; Orbits — Belajar Aya</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #e0e0ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  h1 {
    font-size: 1.8em;
    text-align: center;
    padding: 20px 16px 8px;
    color: #fff;
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.85em;
    color: #8888cc;
    padding: 0 16px 12px;
    font-style: italic;
  }
  #canvas {
    display: block;
    width: 100%;
    height: 300px;
    background: #0a0a1a;
    cursor: crosshair;
    border-radius: 12px;
    margin: 0 16px;
    width: calc(100% - 32px);
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(135deg, #2a2a5a, #1a1a3a);
    color: #e0e0ff;
    border: 1px solid #4a4a8a;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 0.95em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: linear-gradient(135deg, #3a3a7a, #2a2a5a); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn-primary { background: linear-gradient(135deg, #4a2a8a, #2a1a5a); border-color: #7a4aba; }
  .btn-primary:hover { background: linear-gradient(135deg, #5a3a9a, #3a2a6a); }
  .info-bar {
    text-align: center;
    font-size: 0.8em;
    color: #6688cc;
    padding: 4px 16px 12px;
  }
  .fab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: rgba(10,10,26,0.95);
    border-top: 1px solid #2a2a5a;
    z-index: 100;
  }
  .fab {
    font-size: 1.4em;
    background: linear-gradient(135deg, #2a2a5a, #1a1a3a);
    border: 1px solid #4a4a8a;
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .fab:hover { background: linear-gradient(135deg, #3a3a7a, #2a2a5a); }
  .fab.rabbity {
    position: relative;
    border-radius: 50% 50% 50% 10px;
  }
  .bubble {
    position: absolute;
    bottom: 60px;
    right: 0;
    background: #1a1a3a;
    border: 1px solid #4a4a8a;
    border-radius: 16px 16px 4px 16px;
    padding: 12px 16px;
    max-width: 260px;
    font-size: 0.88em;
    line-height: 1.4;
    color: #c0c0e0;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .bubble.show { display: block; }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    right: 16px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #4a4a8a;
  }
  .mission-card {
    background: rgba(30,30,70,0.8);
    border: 1px solid #3a3a7a;
    border-radius: 12px;
    margin: 0 16px 80px;
    padding: 14px 18px;
    font-size: 0.82em;
    color: #aaaaff;
    line-height: 1.5;
  }
  .mission-card strong { color: #aaaaff; display: block; margin-bottom: 4px; font-size: 0.95em; }
  .stars-bg {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  .content { position: relative; z-index: 1; padding-bottom: 80px; }
</style>
</head>
<body>
<div class="stars-bg" id="starsBg"></div>
<div class="content">
  <h1>Gravity &amp; Orbits</h1>
  <p class="subtitle">Place planets and watch debris curve toward them</p>
  <canvas id="canvas" width="800" height="300"></canvas>
  <div class="info-bar" id="infoBar">Tap the canvas to place your first planet!</div>
  <div class="controls">
    <button class="btn btn-primary" id="btnAdd">Add Planet</button>
    <button class="btn" id="btnReset">Reset</button>
  </div>
  <div class="mission-card">
    <strong>Real World Mission</strong>
    Look at the moon in the sky tonight. Why does it stay in the sky and not fly away?
  </div>
</div>
<div class="fab-bar">
  <div class="fab" id="fabHome" title="Home">🏠</div>
  <div class="fab rabbity" id="fabRabbity" title="Rabbity">🐰
    <div class="bubble" id="bubble">What happens if you place the planet in the middle vs near the edge?</div>
  </div>
  <div class="fab" id="fabParent" title="Parent">👤</div>
</div>
<script>
// === GRAVITY & ORBITS SIMULATION ===
(function() {
  var canvas = document.getElementById("canvas");
  var ctx = canvas.getContext("2d");
  var infoBar = document.getElementById("infoBar");
  var btnAdd = document.getElementById("btnAdd");
  var btnReset = document.getElementById("btnReset");
  var fabRabbity = document.getElementById("fabRabbity");
  var bubble = document.getElementById("bubble");

  // High-DPI canvas setup
  function resizeCanvas() {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    canvas.style.height = rect.height + "px";
  }
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);

  // State
  var state = {
    planets: [],
    stars: [],
    placingMode: false,
    nextPlanetId: 1
  };

  // Constants
  var G = 0.5; // gravitational constant (tuned for visual effect)
  var PLANET_MASS = 1000;
  var PLANET_RADIUS = 30;
  var STAR_RADIUS = 2;
  var MAX_STARS = 80;

  // Initialize stars
  function initStars() {
    state.stars = [];
    var rect = canvas.getBoundingClientRect();
    for (var i = 0; i < MAX_STARS; i++) {
      state.stars.push({
        x: Math.random() * rect.width,
        y: Math.random() * rect.height,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        r: STAR_RADIUS,
        trail: []
      });
    }
  }

  function resetAll() {
    state.planets = [];
    state.placingMode = false;
    state.nextPlanetId = 1;
    initStars();
    updateInfo();
    btnAdd.textContent = "Add Planet";
    btnAdd.classList.remove("btn-primary");
  }

  function updateInfo() {
    var p = state.planets.length;
    var s = state.stars.length;
    if (p === 0) {
      infoBar.textContent = "Tap the canvas to place your first planet!";
    } else if (p === 1) {
      infoBar.textContent = "1 planet placed. Add another to see gravity wells interact!";
    } else {
      infoBar.textContent = p + " planets placed. Watch the debris curve through space!";
    }
  }

  // Physics
  function updateStars() {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;

    for (var i = 0; i < state.stars.length; i++) {
      var star = state.stars[i];

      // Record trail
      star.trail.push({ x: star.x, y: star.y });
      if (star.trail.length > 20) star.trail.shift();

      // Apply gravity from each planet
      for (var j = 0; j < state.planets.length; j++) {
        var planet = state.planets[j];
        var dx = planet.x - star.x;
        var dy = planet.y - star.y;
        var distSq = dx * dx + dy * dy;
        var dist = Math.sqrt(distSq);
        if (dist < 5) dist = 5; // prevent singularity

        var force = (G * planet.mass) / distSq;
        var ax = (force * dx) / dist;
        var ay = (force * dy) / dist;

        star.vx += ax * 0.016;
        star.vy += ay * 0.016;
      }

      // Apply velocity
      star.x += star.vx;
      star.y += star.vy;

      // Bounce off edges
      if (star.x < 0) { star.x = 0; star.vx = Math.abs(star.vx) * 0.8; }
      if (star.x > w) { star.x = w; star.vx = -Math.abs(star.vx) * 0.8; }
      if (star.y < 0) { star.y = 0; star.vy = Math.abs(star.vy) * 0.8; }
      if (star.y > h) { star.y = h; star.vy = -Math.abs(star.vy) * 0.8; }
    }
  }

  function drawScene() {
    var rect = canvas.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;

    ctx.clearRect(0, 0, w, h);

    // Draw stars and trails
    for (var i = 0; i < state.stars.length; i++) {
      var star = state.stars[i];

      // Trail
      if (star.trail.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(100,120,255,0.15)";
        ctx.lineWidth = 1;
        for (var t = 0; t < star.trail.length; t++) {
          var tp = star.trail[t];
          if (t === 0) ctx.moveTo(tp.x, tp.y);
          else ctx.lineTo(tp.x, tp.y);
        }
        ctx.stroke();
      }

      // Star dot
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fillStyle = "#aabbff";
      ctx.fill();
    }

    // Draw planets
    for (var k = 0; k < state.planets.length; k++) {
      var p = state.planets[k];

      // Gravity well rings
      for (var ring = 3; ring >= 1; ring--) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r + ring * 20, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(100,60," + (200 - ring * 40) + ",0.15)";
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Planet body
      var grad = ctx.createRadialGradient(p.x - 8, p.y - 8, 2, p.x, p.y, p.r);
      grad.addColorStop(0, "#8877ff");
      grad.addColorStop(1, "#3322aa");
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Highlight
      ctx.beginPath();
      ctx.arc(p.x - 10, p.y - 10, 8, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.fill();
    }

    // Placing mode indicator
    if (state.placingMode) {
      ctx.fillStyle = "rgba(150,130,255,0.6)";
      ctx.font = "14px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Tap to place planet #" + state.nextPlanetId, w / 2, 20);
    }
  }

  // Animation loop
  function loop() {
    updateStars();
    drawScene();
    requestAnimationFrame(loop);
  }

  // Event: canvas click
  canvas.addEventListener("click", function(e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left;
    var y = e.clientY - rect.top;

    if (state.placingMode || state.planets.length === 0) {
      if (state.planets.length < 5) {
        state.planets.push({
          id: state.nextPlanetId++,
          x: x,
          y: y,
          r: PLANET_RADIUS,
          mass: PLANET_MASS
        });
        state.placingMode = false;
        updateInfo();
      }
    }
  });

  canvas.addEventListener("mousemove", function(e) {
    if (state.placingMode) {
      var rect = canvas.getBoundingClientRect();
      // Visual hint of where planet would be placed
    }
  });

  btnAdd.addEventListener("click", function() {
    if (state.planets.length < 5) {
      state.placingMode = true;
      updateInfo();
      btnAdd.textContent = "Tap Canvas!";
      btnAdd.classList.add("btn-primary");
    } else {
      btnAdd.textContent = "Max Planets!";
    }
  });

  btnReset.addEventListener("click", function() {
    resetAll();
  });

  fabRabbity.addEventListener("click", function() {
    bubble.classList.toggle("show");
  });

  // Close bubble when clicking elsewhere
  document.addEventListener("click", function(e) {
    if (!fabRabbity.contains(e.target)) {
      bubble.classList.remove("show");
    }
  });

  // FAB: Home
  document.getElementById("fabHome").addEventListener("click", function() {
    if (window.parent && window.parent.navigate) {
      window.parent.navigate("home");
    } else if (window.location.hash) {
      window.location.hash = "";
    }
  });

  // FAB: Parent
  document.getElementById("fabParent").addEventListener("click", function() {
    var msg = "This simulation shows how gravity pulls objects toward massive bodies. " +
              "The more massive an object, the stronger its pull. " +
              "This is why planets orbit stars, and moons orbit planets!";
    alert(msg);
  });

  // Generate background stars
  (function genStars() {
    var bg = document.getElementById("starsBg");
    for (var i = 0; i < 80; i++) {
      var s = document.createElement("div");
      s.className = "star";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.width = s.style.height = (Math.random() * 2 + 1) + "px";
      s.style.animationDelay = Math.random() * 3 + "s";
      bg.appendChild(s);
    }
  })();

  // Init
  initStars();
  updateInfo();
  loop();

  // MISSIONS
  window.MISSIONS = window.MISSIONS || {};
  Object.assign(window.MISSIONS, {
    "gravity-orbits": {
      title: "Gravity & Orbits — Real World Mission",
      adult: "What you might say: The moon is actually falling toward Earth all the time, but it's moving so fast sideways that it keeps missing — that\'s what an orbit is! Ask them to imagine throwing a ball — it goes forward and falls at the same time.",
      safety: "No physical risks. If your child is scared of space, reassure them that space is very big and we are safe on Earth.",
      askNext: "Try placing planets of different sizes. What happens to the debris? Can you make a pattern?",
      finish: "Great exploring! Tonight, look up at the sky and try to spot any moving lights — those might be satellites orbiting Earth too!"
    }
  });
})();
</script>
</body>
</html>
