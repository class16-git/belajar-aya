<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practical Life — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;--red:#EF5350;--orange:#FF7043;--cream:#FFF8F0;--shadow:0 4px 24px rgba(0,0,0,.35);--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 20px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.8rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.82rem;opacity:.5}
.act-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px 100px;position:relative;z-index:1}
.act-card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s;font-family:var(--font-b)}
.act-card:active{transform:scale(.97)}
.act-icon{font-size:2.5rem;flex-shrink:0}
.act-name{font-family:var(--font-h);font-size:1rem;margin-bottom:2px}
.act-desc{font-size:.75rem;opacity:.5;line-height:1.3}
.act-badge{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:.8rem;margin-left:auto;flex-shrink:0}
.act-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.work-area{padding:10px 16px 100px;flex:1;position:relative;z-index:1}
.instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;margin:8px 0;font-size:.85rem;text-align:center;line-height:1.6;border:1px solid rgba(255,255,255,.08)}
.demo-area{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:10px 0;min-height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.pour-scene{display:flex;align-items:flex-end;justify-content:center;gap:24px;padding:16px 0}
.jug{font-size:3rem;cursor:pointer;transition:transform .15s;user-select:none;touch-action:none;display:inline-block}
.jug:active{transform:scale(.9)}
.glass{width:60px;height:80px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:4px 4px 12px 12px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative}
.glass-fill{width:100%;background:linear-gradient(to top,#42A5F5,#90CAF9);border-radius:0 0 10px 10px;transition:height .6s ease}
.pour-btn{background:rgba(33,150,243,.2);border:2px solid rgba(33,150,243,.5);color:#64B5F6;border-radius:12px;padding:10px 20px;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.85rem}
.pour-btn:active{transform:scale(.93)}
.tongs-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
.tongs-item{font-size:2.5rem;cursor:grab;transition:transform .15s;display:inline-block;user-select:none;touch-action:none;padding:8px}
.tongs-item:active{transform:scale(.85)}
.tongs-item.placed{opacity:.4;cursor:default;pointer-events:none}
.target-slot{width:64px;height:64px;border:3px dashed rgba(255,255,255,.2);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;transition:all .2s}
.target-slot.highlight{border-color:var(--green);background:rgba(76,175,80,.1)}
.target-slot.filled{border-color:var(--green);border-style:solid;background:rgba(76,175,80,.15)}
.button-area{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px 0}
.cloth-button{width:200px;height:60px;background:var(--card);border:2px solid rgba(255,255,255,.15);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.cloth-button .btn-hole{width:16px;height:16px;background:var(--bg);border-radius:50%;position:absolute}
.cloth-button .btn-hole:nth-child(1){left:40px}
.cloth-button .cloth-hole{width:14px;height:14px;background:rgba(255,255,255,.1);border-radius:50%;position:absolute;border:2px solid rgba(255,255,255,.2)}
.cloth-button .cloth-hole:nth-child(2){left:90px;top:50%;transform:translateY(-50%)}
.wash-area{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 0}
.wash-step{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 16px;width:100%;max-width:300px;cursor:pointer;transition:all .2s}
.wash-step.done{background:rgba(76,175,80,.1);border-color:rgba(76,175,80,.4)}
.wash-step .step-icon{font-size:1.5rem;margin-bottom:4px}
.wash-step .step-text{font-size:.85rem}
.pink-area{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}
.cube-row{display:flex;align-items:flex-end;gap:4px;justify-content:center}
.cube{background:var(--red);border-radius:6px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-h);font-size:.7rem}
.cube:active{transform:scale(.92)}
.cube.selected{box-shadow:0 0 0 3px var(--gold)}
.cube.placed{opacity:.4;cursor:default;pointer-events:none}
.step-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.step-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--cream);font-family:var(--font-b);font-size:.82rem;transition:all .15s}
.step-btn:active{transform:scale(.93)}
.step-btn.done{background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green)}
.success-msg{background:rgba(76,175,80,.15);border:2px solid rgba(76,175,80,.4);border-radius:16px;padding:16px;text-align:center;margin:10px 0;display:none}
.success-msg.show{display:block}
.success-msg .emoji{font-size:2.5rem;margin-bottom:8px}
.success-msg .text{font-family:var(--font-h);color:var(--green);font-size:1.1rem}
.btn{padding:12px 20px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg);display:block;width:100%;max-width:320px;margin:10px auto}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12);display:block;width:100%;max-width:320px;margin:6px auto}
.act-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;width:fit-content}
.act-back:active{transform:scale(.95)}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Release accessibility baseline */
:focus-visible{outline:3px solid #FFD700!important;outline-offset:3px!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="screen active" id="screen-home">
  <div class="top-bar">
    <a href="index.html" class="top-btn">←</a>
    <div class="top-title">Practical Life</div>
    <div style="width:44px"></div>
  </div>
  <div class="hero">
    <div style="font-size:2.5rem;margin-bottom:4px;">🧼</div>
    <div class="hero-title">Practical Life</div>
    <div class="hero-sub">Practice everyday skills — pouring, pinching, and more!</div>
  </div>
  <div class="act-grid" id="act-grid"></div>
</div>

<div class="screen" id="screen-work">
  <div class="top-bar">
    <button class="act-back" onclick="goBack()">← Back</button>
    <div class="top-title" id="work-title">Activity</div>
    <button class="top-btn" onclick="toggleParent()">👤</button>
  </div>
  <div class="work-area" id="work-area"></div>
</div>

<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Practical Life Progress</div>
  <div id="parent-content"></div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
var ACTIVITIES = [
  { id: "pour", emoji: "🫗", name: "Pouring Water", desc: "Pour carefully from jug to glass", key: "pl-pour" },
  { id: "tongs", emoji: "🍴", name: "Using Tongs", desc: "Pick up objects one by one", key: "pl-tongs" },
  { id: "button", emoji: "🔘", name: "Buttoning", desc: "Fasten and unfasten buttons", key: "pl-button" },
  { id: "wash", emoji: "🧼", name: "Hand Washing", desc: "Wash your hands properly", key: "pl-wash" },
  { id: "pinktower", emoji: "🟥", name: "Pink Tower", desc: "Build from biggest to smallest", key: "pl-pinktower" }
];

var state = { currentAct: null, history: ["home"], progress: {} };

function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

function init() {
  state.progress = lsGet("pl-progress", {});
  genStars();
  renderActGrid();
  setTimeout(function() { say("Welcome to Practical Life!"); }, 600);
}

function genStars() {
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for (var i = 0; i < 55; i++) {
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random() * 2 + 1;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + sz + "px;animation-delay:" + (Math.random() * 3).toFixed(1) + "s;animation-duration:" + (Math.random() * 2 + 2).toFixed(1) + "s";
    el.appendChild(s);
  }
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  var el = document.getElementById("screen-" + name);
  if (el) el.classList.add("active");
  if (name !== "home") state.history.push(name);
  if (name === "home") { state.history = ["home"]; closeParent(); }
}

function goBack() {
  if (state.history.length > 1) state.history.pop();
  showScreen(state.history[state.history.length - 1] || "home");
}

function renderActGrid() {
  var grid = document.getElementById("act-grid");
  grid.innerHTML = "";
  ACTIVITIES.forEach(function(a) {
    var done = !!state.progress[a.id];
    var card = document.createElement("button");
    card.className = "act-card";
    card.onclick = function() { openAct(a); };
    card.innerHTML = '<div class="act-icon">' + a.emoji + '</div><div><div class="act-name">' + a.name + '</div><div class="act-desc">' + a.desc + '</div></div><div class="act-badge ' + (done ? "done" : "") + '">' + (done ? "✓" : "→") + "</div>";
    grid.appendChild(card);
  });
}

function openAct(a) {
  state.currentAct = a;
  document.getElementById("work-title").textContent = a.name;
  var area = document.getElementById("work-area");
  area.innerHTML = "";
  switch (a.id) {
    case "pour": renderPour(area); break;
    case "tongs": renderTongs(area); break;
    case "button": renderButton(area); break;
    case "wash": renderWash(area); break;
    case "pinktower": renderPinkTower(area); break;
  }
  showScreen("work");
}

function markActDone(id) {
  if (!id) return;
  if (!state.progress[id]) {
    state.progress[id] = true;
    lsSet("pl-progress", state.progress);
    confetti();
    say("Wonderful! You completed this activity!");
  }
  if (typeof showMission === "function") {
    setTimeout(function() { showMission(id); }, 1200);
  }
}

function showMission(id) {
  if (!window.MISSIONS || !window.MISSIONS[id]) return;
  var m = window.MISSIONS[id];
  var el = document.createElement("div");
  el.style.cssText = "position:fixed;inset:0;background:rgba(7,7,26,.92);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto";
  el.innerHTML =
    "<div style=\"background:linear-gradient(135deg,#1a3a2a 0%,#0d2818 100%);border:2px solid #4CAF50;border-radius:20px;padding:20px 16px;max-width:440px;width:100%;position:relative\">"+
      "<div style=\"font-size:.65rem;color:#81C784;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-family:var(--font-h)\">Real World Mission</div>"+
      "<div style=\"font-family:var(--font-h);font-size:1.05rem;color:#FFF8F0;margin-bottom:12px\">"+m.title+"</div>"+
      "<div style=\"margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px\"><div style=\"font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Materials</div><div style=\"font-size:.82rem;color:#FFF8F0;line-height:1.5\">"+m.materials.map(function(i){return "• "+i;}).join("<br>")+"</div></div>"+
      "<div style=\"margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px\"><div style=\"font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Steps</div><div style=\"font-size:.82rem;color:#FFF8F0;line-height:1.5\">"+m.steps.map(function(s,i){return (i+1)+". "+s;}).join("<br>")+"</div></div>"+
      "<div style=\"margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px\"><div style=\"font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Adult's Role</div><div style=\"font-size:.82rem;color:#FFF8F0;line-height:1.5\">"+m.adult+"</div></div>"+
      "<div style=\"margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px\"><div style=\"font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Safety</div><div style=\"font-size:.82rem;color:#FFF8F0;line-height:1.5\">"+m.safety+"</div></div>"+
      "<div style=\"background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:12px;padding:12px 14px;margin-top:12px\"><div style=\"font-size:.88rem;color:#FFD700;font-style:italic;margin-bottom:8px\">\""+m.question+"\"</div><div style=\"font-size:.72rem;color:rgba(255,248,240,.6)\">Ask this after the activity — there is no wrong answer.</div></div>"+
      "<div style=\"margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px\"><div style=\"font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px\">Done when</div><div style=\"font-size:.82rem;color:#FFF8F0;line-height:1.5\">"+m.finish+"</div></div>"+
      "<button onclick=\"this.closest('[style*=&quot;position:fixed&quot;]').remove()\" style=\"background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#FFF8F0;border-radius:12px;padding:10px 20px;font-size:.82rem;cursor:pointer;margin-top:14px;font-family:var(--font-b);font-weight:600;display:block;width:100%\">Done — go back</button>"+
    "</div>";
  document.body.appendChild(el);
}
window.MISSIONS = window.MISSIONS || {};

window.MISSIONS.pour = {
  title: "Pour Water at the Table",
  materials: ["A small jug or cup", "Two containers of different sizes", "A tray to catch spills", "A sponge"],
  steps: ["Fill the small container halfway with water", "Pour slowly from the small container into the large one", "Notice how the water moves", "Try pouring back the other way"],
  adult: "Sit at the table with the child. Pour your own water at the same time, silently at first.",
  safety: "Water on the floor is a slip hazard — use a tray and stay nearby.",
  question: "Can you pour so slowly that not a single drop spills?",
  finish: "When the child can pour without spilling and notices when the container is getting full."
};
window.MISSIONS.tongs = {
  title: "Transfer Small Objects with Tongs",
  materials: ["Kitchen tongs or chopsticks", "Two bowls", "Small objects: dried beans, buttons, beads, cotton balls"],
  steps: ["Put all the objects in one bowl", "Using tongs, transfer one object at a time to the other bowl", "Count how many you have moved", "Try to do it without making any noise"],
  adult: "Time yourself doing the same task. Ask: \"Is it faster with your fingers? Why do you think that is?\"",
  safety: "Small objects — keep away from mouth. Watch with chopsticks.",
  question: "Which objects are easiest to pick up? Which are hardest? Why?",
  finish: "When the child has transferred all objects using only tongs."
};
window.MISSIONS.button = {
  title: "Practice Buttons on a Jacket or Bag",
  materials: ["A jacket, coat, or bag with buttons", "A lap tray or flat surface"],
  steps: ["Sit at a table with the item in front of you", "Open all the buttons slowly", "Close them one by one, starting from the top", "Notice how the button slides through the hole"],
  adult: "Show how you button your own jacket slowly. Ask: \"Which part do you need to hold and which part do you push?\"",
  safety: "No hazards.",
  question: "Can you button it starting from the bottom instead of the top? Is it easier or harder?",
  finish: "When the child can button and unbutton a jacket independently."
};
window.MISSIONS.wash = {
  title: "Wash Something Real",
  materials: ["A small plastic or wooden toy", "A bowl of warm water and a cloth", "A towel", "A drying space"],
  steps: ["Fill a small bowl with warm (not hot) water", "Gently wipe the toy with a damp cloth", "Notice the dirt coming off", "Pat dry with the towel and set somewhere to finish air-drying"],
  adult: "Supervise the water. Ask: \"What does the water look like now? Where did the dirt go?\"",
  safety: "Water stays at the table. Keep electrical items away. Warm water only — test with your elbow.",
  question: "What other things in your home could you wash?",
  finish: "When the toy is clean, dry, and put back in its place."
};

  title: "Build a Pink Tower at Home",
  materials: ["10 cardboard boxes of increasing size (or stacking cups)", "A smooth floor or low table"],
  steps: ["Find 10 boxes that grow from small to large", "Build a tower from the biggest at the bottom to the smallest on top", "Notice how each piece is smaller than the one below", "Try building it with eyes closed"],
  adult: "Let the child discover the order. Ask: \"Does this feel right? How can you check?\"",
  safety: "Avoid boxes with staples or sharp edges.",
  question: "What happens to the size of each piece as you go up the tower?",
  finish: "When the tower is complete with the largest at the bottom and smallest at the top."
};

// POURING
function renderPour(area) {
  area.innerHTML = '<div class="instruction">Tap Pour to pour water from the jug into the glass!</div><div class="demo-area"><div class="pour-scene"><div class="jug" id="jug">🫗</div><div class="glass" id="glass"><div class="glass-fill" id="glass-fill" style="height:0%"></div></div></div></div><div style="display:flex;gap:10px;justify-content:center;padding:8px 0;"><button class="pour-btn" onclick="doPour()">Pour!</button><button class="pour-btn" onclick="resetPour()" style="background:rgba(239,83,80,.2);border-color:rgba(239,83,80,.5);color:#EF9A9A">Reset</button></div><div class="success-msg" id="pour-msg"><div class="emoji">🎉</div><div class="text">Perfect pour! Well done!</div></div>';
  state.pourLevel = 0;
}

function doPour() {
  var fill = document.getElementById("glass-fill");
  if (!fill) return;
  if (state.pourLevel >= 100) {
    say("The glass is already full!");
    return;
  }
  state.pourLevel += 20;
  fill.style.height = state.pourLevel + "%";
  if (state.pourLevel >= 100) {
    document.getElementById("pour-msg").classList.add("show");
    markActDone("pour");
    say("The glass is full! Great job!");
  } else {
    say("Keep pouring! " + state.pourLevel + "% full!");
  }
}

function resetPour() {
  var fill = document.getElementById("glass-fill");
  if (!fill) return;
  state.pourLevel = 0;
  fill.style.height = "0%";
  document.getElementById("pour-msg").classList.remove("show");
}

// TONGS
function renderTongs(area) {
  area.innerHTML = '<div class="instruction">Tap each item to pick it up and place it in the basket!</div><div class="demo-area"><div class="tongs-area" id="tongs-area"></div></div><div class="success-msg" id="tongs-msg"><div class="emoji">🎉</div><div class="text">All items collected! Great control!</div></div>';
  var tongsArea = document.getElementById("tongs-area");
  state.tongsPlaced = 0;
  var items = ["🍎", "🥕", "🔴", "🟠", "🔵", "🟢"];
  var basket = document.createElement("div");
  basket.style.cssText = "font-size:3rem;padding:8px;background:rgba(76,175,80,.1);border:2px dashed rgba(76,175,80,.4);border-radius:14px;min-width:80px;min-height:80px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center";
  basket.id = "tongs-basket";
  tongsArea.appendChild(basket);
  var itemPool = document.createElement("div");
  itemPool.style.cssText = "display:flex;flex-wrap:wrap;gap:10px;justify-content:center";
  itemPool.id = "item-pool";
  tongsArea.appendChild(itemPool);
  items.forEach(function(item, i) {
    (function(itm, idx) {
      var el = document.createElement("button");
      el.className = "tongs-item";
      el.textContent = itm;
      el.id = "tongs-item-" + idx;
      el.onclick = function() {
        if (el.classList.contains("placed")) return;
        el.classList.add("placed");
        var chip = document.createElement("span");
        chip.textContent = itm;
        chip.style.cssText = "font-size:1.8rem";
        basket.appendChild(chip);
        state.tongsPlaced++;
        say("Item " + state.tongsPlaced + " placed!");
        if (state.tongsPlaced >= items.length) {
          document.getElementById("tongs-msg").classList.add("show");
          markActDone("tongs");
          say("All items collected! You have great control!");
        }
      };
      itemPool.appendChild(el);
    })(item, i);
  });
}

// BUTTONING
function renderButton(area) {
  area.innerHTML = '<div class="instruction">Tap the button to practice buttoning! See how it goes through the hole.</div><div class="demo-area"><div class="button-area"><div class="cloth-button" id="cloth-btn"><div class="btn-hole"></div><div class="cloth-hole"></div></div><div style="display:flex;gap:10px;margin-top:12px;"><button class="pour-btn" onclick="doButton()">Button it!</button><button class="pour-btn" onclick="resetButton()" style="background:rgba(239,83,80,.2);border-color:rgba(239,83,80,.5);color:#EF9A9A">Unbutton</button></div></div></div><div class="success-msg" id="button-msg"><div class="emoji">🎉</div><div class="text">Button done! Great work!</div></div>';
  state.buttonDone = false;
}

function doButton() {
  if (state.buttonDone) {
    say("Already buttoned! Try unbuttoning first.");
    return;
  }
  var cloth = document.getElementById("cloth-btn");
  if (cloth) {
    cloth.style.boxShadow = "0 0 0 3px var(--green)";
    cloth.style.background = "rgba(76,175,80,.15)";
  }
  state.buttonDone = true;
  document.getElementById("button-msg").classList.add("show");
  markActDone("button");
  say("Button fastened! You did it!");
}

function resetButton() {
  var cloth = document.getElementById("cloth-btn");
  if (cloth) {
    cloth.style.boxShadow = "none";
    cloth.style.background = "var(--card)";
  }
  state.buttonDone = false;
  document.getElementById("button-msg").classList.remove("show");
}

// HAND WASHING
function renderWash(area) {
  area.innerHTML = '<div class="instruction">Wash your hands step by step! Tap each step as you do it.</div><div class="wash-area" id="wash-area"></div>';
  var washArea = document.getElementById("wash-area");
  var steps = [
    { icon: "🚰", text: "Turn on the water" },
    { icon: "🧴", text: "Put soap on your hands" },
    { icon: "🤲", text: "Rub your hands together for 20 seconds" },
    { icon: "💧", text: "Rinse off all the soap" },
    { icon: "🧻", text: "Dry your hands with a towel" }
  ];
  state.washSteps = 0;
  steps.forEach(function(step, i) {
    (function(s, idx) {
      var btn = document.createElement("button");
      btn.className = "wash-step";
      btn.id = "wash-step-" + idx;
      btn.innerHTML = '<div class="step-icon">' + s.icon + '</div><div class="step-text">' + s.text + '</div>';
      btn.onclick = function() {
        if (btn.classList.contains("done")) return;
        btn.classList.add("done");
        state.washSteps++;
        say("Step " + state.washSteps + " complete!");
        if (state.washSteps >= steps.length) {
          confetti();
          markActDone("wash");
          say("Hands are clean! Great job washing!");
        }
      };
      washArea.appendChild(btn);
    })(step, i);
  });
}

// PINK TOWER
function renderPinkTower(area) {
  area.innerHTML = '<div class="instruction">Build the Pink Tower! Tap cubes from biggest to smallest. Start with the largest.</div><div class="pink-area" id="pink-area"></div><div class="success-msg" id="pink-msg"><div class="emoji">🎉</div><div class="text">Perfect tower! From biggest to smallest!</div></div>';
  var pinkArea = document.getElementById("pink-area");
  // Create cubes from smallest to largest (for display)
  var cubes = [
    { size: 30, label: "1" },
    { size: 40, label: "2" },
    { size: 50, label: "3" },
    { size: 60, label: "4" },
    { size: 70, label: "5" },
    { size: 80, label: "6" },
    { size: 90, label: "7" },
    { size: 100, label: "8" },
    { size: 110, label: "9" },
    { size: 120, label: "10" }
  ];
  state.pinkOrder = [];
  state.pinkNext = cubes.length; // Start with biggest (10)
  // Shuffle for display
  var shuffled = cubes.slice().sort(function() { return Math.random() - 0.5; });
  var pool = document.createElement("div");
  pool.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px";
  pool.id = "pink-pool";
  shuffled.forEach(function(cube) {
    (function(c) {
      var el = document.createElement("button");
      el.className = "cube";
      el.id = "pink-cube-" + c.label;
      el.textContent = c.label;
      el.style.width = c.size + "px";
      el.style.height = c.size + "px";
      el.dataset.size = c.size;
      el.dataset.label = c.label;
      el.onclick = function() {
        if (el.classList.contains("placed")) return;
        if (parseInt(c.label) === state.pinkNext) {
          el.classList.add("placed");
          state.pinkOrder.push(c);
          state.pinkNext--;
          // Add to tower display
          var tower = document.getElementById("pink-tower");
          if (tower) {
            var chip = document.createElement("div");
            chip.className = "cube placed";
            chip.textContent = c.label;
            chip.style.width = c.size + "px";
            chip.style.height = c.size + "px";
            chip.style.display = "flex";
            chip.style.alignItems = "center";
            chip.style.justifyContent = "center";
            chip.style.margin = "0 auto";
            chip.style.opacity = "1";
            chip.style.pointerEvents = "none";
            tower.appendChild(chip);
          }
          say("Cube " + c.label + "! " + state.pinkNext + " more to go!");
          if (state.pinkOrder.length === cubes.length) {
            document.getElementById("pink-msg").classList.add("show");
            markActDone("pinktower");
            say("Perfect Pink Tower! You are very careful!");
          }
        } else {
          say("Start with the biggest cube first!");
        }
      };
      pool.appendChild(el);
    })(cube);
  });
  pinkArea.appendChild(pool);
  var tower = document.createElement("div");
  tower.id = "pink-tower";
  tower.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px";
  pinkArea.appendChild(tower);
}

function rabbitySpeak() {
  var msgs = ["Practical skills are fun!", "Keep practicing!", "You are very capable!", "Every skill takes practice!"];
  say(msgs[Math.floor(Math.random() * msgs.length)]);
}

function say(text) {
  var b = document.getElementById("rabbity-bubble");
  if (b) { b.textContent = "🐰 " + text; b.classList.add("show"); }
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function() { if (b) b.classList.remove("show"); }, 3500);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if (window._confettiActive) return;
  window._confettiActive = true;
  var c = document.getElementById("confetti-container");
  if (!c) return;
  c.innerHTML = "";
  var colors = ["#FFD700", "#EF5350", "#66BB6A", "#42A5F5", "#AB47BC", "#FF9800"];
  for (var i = 0; i < 40; i++) {
    var p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    p.style.animationDuration = "2.5s";
    c.appendChild(p);
  }
  setTimeout(function() { c.innerHTML = ""; window._confettiActive = false; }, 3500);
}

function toggleParent() {
  var p = document.getElementById("parent-panel");
  if (!p) return;
  p.classList.toggle("open");
  if (p.classList.contains("open")) renderParentPanel();
}

function closeParent() {
  var p = document.getElementById("parent-panel");
  if (p) p.classList.remove("open");
}

function renderParentPanel() {
  var c = document.getElementById("parent-content");
  if (!c) return;
  c.innerHTML = "";
  ACTIVITIES.forEach(function(a, i) {
    var done = !!state.progress[a.id];
    var pct = done ? 100 : 0;
    c.innerHTML += "<div class=\"panel-row\"><div class=\"panel-row-label\">" + a.emoji + " " + a.name + " <span>" + pct + "%</span></div><div class=\"panel-bar\"><div class=\"panel-bar-fill\" style=\"width:" + pct + "%;background:#E65100;\"></div></div></div>";
  });
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") { closeParent(); goBack(); }
});
window.addEventListener("load", init);
</script>
