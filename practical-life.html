<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Practical Life — Learn Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;--cream:#FFF8F0;--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 16px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.6rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.8rem;opacity:.5}
.act-grid{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.act-card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 20px rgba(0,0,0,.3);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s;font-family:var(--font-b)}
.act-card:active{transform:scale(.97)}
.act-num{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);font-family:var(--font-h);font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-card.done .act-num{background:var(--green);border-color:var(--green);color:#fff}
.act-name{font-family:var(--font-h);font-size:1rem;margin-bottom:2px}
.act-desc{font-size:.75rem;opacity:.5;line-height:1.3}
.act-badge{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.exp-header{padding:10px 16px 6px;position:relative;z-index:1}
.exp-title{font-family:var(--font-h);font-size:1.2rem;color:var(--gold);text-align:center;margin-bottom:4px}
.exp-prompt{font-size:.85rem;opacity:.7;text-align:center;margin-bottom:14px;padding:0 16px}
.exp-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.exp-instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:.85rem;line-height:1.6;text-align:center;border:1px solid rgba(255,255,255,.08)}
.demo-box{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:10px 0}
.demo-label{font-size:.75rem;opacity:.5;margin-bottom:8px}
.btn{padding:12px 20px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s;display:inline-block}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.lesson-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;width:fit-content}
.lesson-back:active{transform:scale(.95)}
.jug{font-size:4rem;cursor:pointer;transition:transform .2s,filter .2s;display:inline-block;user-select:none}
.jug:active{transform:scale(.9);filter:brightness(1.2)}
.jug.pouring{animation:jugTilt .6s ease-in-out forwards}
@keyframes jugTilt{0%{transform:rotate(0)}30%{transform:rotate(-30deg)}70%{transform:rotate(-30deg)}100%{transform:rotate(0)}}
@keyframes pourDrop{0%{opacity:1;transform:translateY(-5px) scale(1)}100%{opacity:0;transform:translateY(30px) scale(.5)}}
@keyframes glassFill{0%{height:0%}100%{height:var(--fill)}}}
.glass-container{display:flex;align-items:flex-end;gap:20px;justify-content:center;margin:10px 0}
.glass{width:60px;height:100px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:0 0 10px 10px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.glass-fill{width:100%;background:linear-gradient(to top,#42A5F5,#90CAF9);transition:height .5s ease;border-radius:0 0 8px 8px}
.pour-text{font-family:var(--font-h);font-size:.85rem;opacity:.6;margin-top:10px}
.step-list{text-align:left;max-width:300px;margin:10px auto}
.step-item{padding:10px 14px;border-radius:10px;margin:6px 0;cursor:pointer;border:none;color:var(--cream);background:rgba(255,255,255,.06);transition:all .2s;font-family:var(--font-b);font-size:.88rem;width:100%;text-align:left;display:flex;gap:10px;align-items:center}
.step-item:active{transform:scale(.98)}
.step-item.done{background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3)}
.step-item.active{background:rgba(255,215,0,.1);border:2px solid rgba(255,215,0,.4)}
.step-num{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:.8rem;flex-shrink:0}
.step-item.done .step-num{background:var(--green)}
.step-item.active .step-num{background:var(--gold);color:var(--bg)}
.bowl{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:50px}
.bowl-item{font-size:1.8rem;cursor:pointer;border:none;padding:4px;transition:transform .12s;background:rgba(255,255,255,.05);border-radius:8px}
.bowl-item:active{transform:scale(.85)}
.bowl-item.grabbed{opacity:.3}
.bowl-target{background:rgba(76,175,80,.08);border:2px dashed rgba(76,175,80,.3);border-radius:12px;min-width:120px;min-height:60px;display:flex;gap:6px;flex-wrap:wrap;padding:8px;justify-content:center;align-items:center}
.btn-grid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.toggle-btn{width:56px;height:56px;border-radius:12px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.8rem;transition:all .2s;color:var(--cream)}
.toggle-btn:active{transform:scale(.9)}
.toggle-btn.fastened{background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green)}
.pink-tower{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.pink-block{background:linear-gradient(135deg,#F8BBD9,#F48FB1);border-radius:6px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:.8rem;color:rgba(0,0,0,.4)}
.pink-block:active{transform:scale(.95)}
.pink-block.stacked{opacity:.4;cursor:default}
.pink-block.placed{border:2px solid var(--green)}
.tower-slot{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.1);border-radius:6px;display:flex;align-items:center;justify-content:center}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="top-bar">
    <div></div>
    <div style="font-family:var(--font-h);color:var(--gold);font-size:.9rem;">Practical Life</div>
    <button class="top-btn" onclick="toggleParent()">👤</button>
  </div>
  <div class="hero">
    <div style="font-size:2.5rem;margin-bottom:4px;">🧼</div>
    <div class="hero-title">Practical Life</div>
    <div class="hero-sub">Montessori practical life activities</div>
  </div>
  <div class="act-grid" id="act-grid"></div>
</div>

<!-- ACTIVITY -->
<div class="screen" id="screen-act">
  <div class="exp-header">
    <button class="lesson-back" onclick="goBack()">← Back</button>
    <div class="exp-title" id="act-title"></div>
    <div class="exp-prompt" id="act-prompt"></div>
  </div>
  <div class="exp-area" id="act-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<!-- Parent Panel -->
<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Progress Practical Life</div>
  <div id="parent-content"></div>
</div>

<!-- Confetti -->
<div class="confetti-container" id="confetti-container"></div>

<script>
const ACTIVITIES=[
  {id:'pour',name:'Pouring',desc:'Pour water from jug to glass',prompt:'Tap teko untuk menuangkan air!'},
  {id:'tongs',name:'Tongs',desc:'Move balls with tongs',prompt:'Use the tongs untuk pindahkan bola!'},
  {id:'buttons',name:'Buttoning',desc:'Open and close buttons',prompt:'Tap buttons to open and close!'},
  {id:'wash',name:'Hand Washing',desc:'6 steps to wash hands',prompt:'Follow the steps-langkah cuci tangan!'},
  {id:'pink',name:'Pink Tower',desc:'Stack the blocks biggest to smallest',prompt:'Stack the blocks dari yang terbesar!'},
];

let state={history:['home'],progress:{}};

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function init(){
  state.progress=lsGet('pl-progress',{});
  genStars();
  renderHome();
  setTimeout(()=>say('Let's latih tanganmu!'),800);
}

function genStars(){
  const el=document.getElementById('stars');
  el.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(Math.random()*2+2).toFixed(1)}s`;
    el.appendChild(s);
  }
}

function markDone(id){
  if(!state.progress[id]){
    state.progress[id]=true;
    lsSet('pl-progress',state.progress);
    confetti();
    say('Great! You're done!');
  }
}
function isDone(id){return !!state.progress[id]}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+name);
  if(el)el.classList.add('active');
  if(name!=='home')state.history.push(name);
  if(name==='home')state.history=['home'];
  if(name==='home')closeParent();
}
function goBack(){
  if(state.history.length>1)state.history.pop();
  showScreen(state.history[state.history.length-1]||'home');
}

function renderHome(){
  const grid=document.getElementById('act-grid');
  grid.innerHTML='';
  ACTIVITIES.forEach((a,i)=>{
    const done=isDone(a.id);
    const card=document.createElement('button');
    card.className='act-card'+(done?' done':'');
    card.onclick=()=>openAct(a);
    card.innerHTML=`<div class="act-num">${done?'✓':(i+1)}</div><div><div class="act-name">${a.name}</div><div class="act-desc">${a.desc}</div></div><div class="act-badge ${done?'done':''}">${done?'✓':''}</div>`;
    grid.appendChild(card);
  });
}

function openAct(a){
  document.getElementById('act-title').textContent='🧼 '+a.name;
  document.getElementById('act-prompt').textContent=a.prompt;
  const area=document.getElementById('act-area');
  area.innerHTML='';
  switch(a.id){
    case'pour':renderPour(area);break;
    case'tongs':renderTongs(area);break;
    case'buttons':renderButtons(area);break;
    case'wash':renderWash(area);break;
    case'pink':renderPink(area);break;
  }
  showScreen('act');
}

// ── POUR ──
function renderPour(area){
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Tap teko untuk menuangkan air!</div>
      <div class="glass-container">
        <div class="jug" id="jug" onclick="doPour()">🫗</div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div class="glass" id="glass">
            <div class="glass-fill" id="glass-fill" style="height:0%"></div>
          </div>
          <div id="pour-level" style="font-family:var(--font-h);font-size:.8rem;opacity:.6">0%</div>
        </div>
      </div>
      <div class="exp-instruction" id="pour-msg">Tap teko untuk tuang air!</div>
    </div>
    <button class="btn btn-primary" onclick="if(state.pourLevel>=3){markDone('pour');say('Hebat! Air sudah penuh!')}else{say('Tuang lagi sampai penuh!')}" style="width:100%;max-width:320px;display:block;margin:10px auto;">✅ Done!</button>
  `;
  state.pourLevel=0;
}
function doPour(){
  if(state.pourLevel>=3)return;
  state.pourLevel++;
  const jug=document.getElementById('jug');
  const fill=document.getElementById('glass-fill');
  const level=document.getElementById('pour-level');
  const msg=document.getElementById('pour-msg');
  if(jug){
    jug.classList.remove('pouring');
    void jug.offsetWidth; // reflow to restart animation
    jug.classList.add('pouring');
    jug.addEventListener('animationend',()=>jug.classList.remove('pouring'),{once:true});
  }
  if(fill)fill.style.height=(state.pourLevel*33)+'%';
  if(level)level.textContent=(state.pourLevel*33)+'%';
  if(msg){
    if(state.pourLevel<3)msg.textContent=`Air ${state.pourLevel*33}%! Lanjutkan!`;
    else msg.innerHTML='<span style="color:var(--green)">Glass penuh! Air sudah dituang!</span>';
  }
  say(state.pourLevel<3?'Pour more!':'Hebat! Glass penuh!');
}

// ── TONGS ──
function renderTongs(area){
  const colors=['#EF5350','#FFCA28','#66BB6A','#42A5F5','#AB47BC'];
  const items=colors.map((c,i)=>({emoji:'🔴',color:c,id:i}));
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Tap bola untuk ambil dengan pinset, tap gelas untuk taruh!</div>
      <div style="font-size:3rem;margin:8px 0;">🔧</div>
      <div class="bowl" id="bowl-source">
        ${items.map(it=>`<button class="bowl-item" id="tong-${it.id}" onclick="grabTong(${it.id})" style="background:${it.color}22">${it.emoji}</button>`).join('')}
      </div>
      <div style="font-size:2rem;margin:6px 0;">↓</div>
      <div class="bowl-target" id="bowl-target" onclick="dropTong()">
        <div style="font-size:.7rem;opacity:.4;">Drop here</div>
      </div>
      <div class="exp-instruction" id="tongs-msg">Tap bola untuk ambil!</div>
    </div>
    <button class="btn btn-primary" onclick="if(state.tongsInTarget>=5){markDone('tongs');say('Great! All balls moved!')}else{say('Move '+5+' balls first!')}" style="width:100%;max-width:320px;display:block;margin:10px auto;">✅ Done!</button>
  `;
  state.tongsHeld=null;
  state.tongsInTarget=0;
}
function grabTong(id){
  if(state.tongsHeld!==null)return;
  const el=document.getElementById('tong-'+id);
  if(!el)return;
  el.classList.add('grabbed');
  state.tongsHeld={id};
  const msg=document.getElementById('tongs-msg');
  if(msg)msg.textContent='Hebat! Now tap gelas untuk taruh!';
  say('Grab! Drop in the cup!');
}
function dropTong(){
  if(state.tongsHeld===null)return;
  const el=document.getElementById('tong-'+state.tongsHeld.id);
  if(el)el.style.display='none';
  const target=document.getElementById('bowl-target');
  if(target){
    const chip=document.createElement('span');
    chip.textContent=el?el.textContent:'🔴';
    chip.style.cssText='font-size:1.4rem';
    target.appendChild(chip);
  }
  state.tongsHeld=null;
  state.tongsInTarget++;
  const msg=document.getElementById('tongs-msg');
  if(msg)msg.textContent=`${state.tongsInTarget}/5 bola di gelas. Tap bola lagi!`;
  if(state.tongsInTarget>=5){
    if(msg)msg.innerHTML='<span style="color:var(--green)">Semua bola sudah dipindahkan!</span>';
    say('Hebat! Semua bola di gelas!');
  }
}

// ── BUTTONS ──
function renderButtons(area){
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Tap tombol untuk buka dan tutup!</div>
      <div class="btn-grid">
        ${Array(6).fill(0).map((_,i)=>`
          <button class="toggle-btn" id="btn-${i}" onclick="toggleBtn(${i})">🔘</button>
        `).join('')}
      </div>
      <div id="btn-msg" class="exp-instruction">Tap semua tombol untuk lihat pakaian selesai!</div>
    </div>
    <button class="btn btn-primary" onclick="checkButtons()" style="width:100%;max-width:320px;display:block;margin:10px auto;">✅ Done!</button>
  `;
  state.btnStates=Array(6).fill(false);
}
function toggleBtn(i){
  state.btnStates[i]=!state.btnStates[i];
  const el=document.getElementById('btn-'+i);
  if(el){
    if(state.btnStates[i]){
      el.classList.add('fastened');
      el.textContent='✅';
    } else {
      el.classList.remove('fastened');
      el.textContent='🔘';
    }
  }
  const allFastened=state.btnStates.every(s=>s);
  const msg=document.getElementById('btn-msg');
  if(allFastened){
    if(msg)msg.innerHTML='<span style="color:var(--green)">All buttons closed!</span>';
    say('Hebat! Semua tombol tertutup!');
  } else {
    const done=state.btnStates.filter(s=>s).length;
    if(msg)msg.textContent=`${done}/6 tombol tertutup`;
  }
}
function checkButtons(){
  const allFastened=state.btnStates.every(s=>s);
  if(allFastened){
    markDone('buttons');
    say('Hebat! Kamu bisa pakai tombol!');
  } else {
    const remaining=state.btnStates.filter(s=>!s).length;
    say(`${remaining} tombol masih terbuka!`);
  }
}

// ── WASH HANDS ──
function renderWash(area){
  const steps=[
    {emoji:'💧',name:'Wet Hands',desc:'Buka keran, basahi kedua tangan'},
    {emoji:'🧴',name:'Soap',desc:'Grab soap, gosok merata'},
    {emoji:'🤲',name:'Scrub',desc:'Scrub telapak, punggung, sela jari selama 20 detik'},
    {emoji:'🚿',name:'Rinse',desc:'Rinse sabun sampai bersih'},
    {emoji:'🧻',name:'Dry',desc:'Dry dengan handuk atau tissue'},
    {emoji:'✨',name:'Done',desc:'Hands are clean!'},
  ];
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Follow the steps-langkah cuci tangan!</div>
      <div class="step-list">
        ${steps.map((s,i)=>`
          <button class="step-item ${i===0?'active':''}" id="wash-step-${i}" onclick="doWashStep(${i})">
            <div class="step-num" id="wash-num-${i}">${i+1}</div>
            <div>
              <div style="font-size:1.3rem;">${s.emoji}</div>
              <div style="font-weight:600;font-size:.88rem;">${s.name}</div>
              <div style="font-size:.72rem;opacity:.6;margin-top:2px;">${s.desc}</div>
            </div>
          </button>
        `).join('')}
      </div>
    </div>
    <button class="btn btn-primary" onclick="if(state.washStep>=5){markDone('wash');say('Hands are clean!')}else{say('Continue to the next step!')}" style="width:100%;max-width:320px;display:block;margin:10px auto;">✅ Done!</button>
  `;
  state.washStep=0;
}
function doWashStep(i){
  if(i!==state.washStep)return;
  const step=document.getElementById('wash-step-'+i);
  if(step){
    step.classList.remove('active');
    step.classList.add('done');
    const num=document.getElementById('wash-num-'+i);
    if(num)num.textContent='✓';
  }
  state.washStep++;
  const next=document.getElementById('wash-step-'+state.washStep);
  if(next){
    next.classList.add('active');
    next.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  const steps=['Wet your hands!','Grab soap!','Scrub for 20 seconds!','Rinse sampai bersih!','Dry!','Done!'];
  say(steps[i]||'Done!');
  if(state.washStep>=6)state.washStep=5;
}

// ── PINK TOWER ──
function renderPink(area){
  const blocks=[
    {size:10,name:'Terbesar'},{size:9,name:'Besar'},{size:8,name:'Medium besar'},
    {size:7,name:'Medium'},{size:6,name:'Medium kecil'},{size:5,name:'Kecil'},
    {size:4,name:'Terakhir'},{size:3,name:'Hampir selesai'},
  ];
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Stack the blocks dari terbesar ke terkecil!</div>
      <div style="display:flex;gap:10px;align-items:flex-end;margin:10px 0;flex-wrap:wrap;justify-content:center;">
        <div class="tower-slot" id="tower-slot" style="min-width:120px;min-height:${10*10+20}px">
          <div id="tower-stack" style="display:flex;flex-direction:column-reverse;align-items:center;gap:4px;"></div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;" id="pink-blocks">
        ${blocks.map((b,i)=>`
          <div class="pink-block" id="pink-${i}" onclick="placePink(${i},${b.size})" style="width:${b.size*8}px;height:${b.size*8}px;">
            <span style="font-size:.6rem;opacity:.4">${b.name}</span>
          </div>
        `).join('')}
      </div>
      <div class="exp-instruction" id="pink-msg">Tap balok terbesar dulu!</div>
    </div>
    <button class="btn btn-primary" onclick="resetPink()" style="width:100%;max-width:320px;display:block;margin:10px auto;">🔄 Ulang</button>
  `;
  state.pinkStack=[];
  state.pinkOrder=[];
}
function placePink(i,size){
  if(state.pinkStack.includes(i))return;
  if(state.pinkStack.length>0){
    const lastSize=blocksData[state.pinkStack[state.pinkStack.length-1]];
    if(size>=lastSize){
      say('Coba balok yang lebih kecil!');
      return;
    }
  }
  const el=document.getElementById('pink-'+i);
  if(el)el.classList.add('stacked');
  state.pinkStack.push(i);
  const stack=document.getElementById('tower-stack');
  if(stack&&el){
    const clone=el.cloneNode(true);
    clone.classList.remove('pink-block');
    clone.classList.add('placed');
    clone.style.cssText=el.style.cssText+';cursor:default;opacity:1';
    clone.onclick=null;
    stack.appendChild(clone);
  }
  const msg=document.getElementById('pink-msg');
  if(state.pinkStack.length===8){
    if(msg)msg.innerHTML='<span style="color:var(--green)">Tower complete! Hebat!</span>';
    markDone('pink');
    say('Hebat! Tower complete!');
  } else {
    if(msg)msg.textContent=`${state.pinkStack.length}/8 balok. Lanjutkan!`;
    say('Bagus! Lanjutkan!');
  }
}
function resetPink(){
  state.pinkStack=[];
  const blocks=document.querySelectorAll('.pink-block');
  blocks.forEach(el=>{el.classList.remove('stacked');});
  const stack=document.getElementById('tower-stack');
  if(stack)stack.innerHTML='';
  const msg=document.getElementById('pink-msg');
  if(msg)msg.textContent='Stack from biggest to smallest!';
}
// blocks data for size comparison
const blocksData=[10,9,8,7,6,5,4,3];

// ── RABBITY ──
function rabbitySpeak(){
  const msgs=['Let's latih tanganmu!','You are very skilled!','Lanjutkan!','Rabbity is so proud!'];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}
function say(text){
  const b=document.getElementById('rabbity-bubble');
  if(b){b.textContent='🐰 '+text;b.classList.add('show');}
  if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u);}
  setTimeout(()=>{if(b)b.classList.remove('show')},3500);
}

// ── CONFETTI ──
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti-container');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#EF5350','#66BB6A','#42A5F5','#AB47BC','#FF9800'];
  for(let i=0;i<30;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(p);}
  setTimeout(()=>c.innerHTML='',3500);
}

// ── PARENT PANEL ──
function toggleParent(){
  const p=document.getElementById('parent-panel');
  if(!p)return;
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderParentPanel();
}
function closeParent(){
  const p=document.getElementById('parent-panel');
  if(p)p.classList.remove('open');
}
function renderParentPanel(){
  const c=document.getElementById('parent-content');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#4CAF50','#42A5F5','#AB47BC','#FF9800'];
  ACTIVITIES.forEach((a,i)=>{
    const done=isDone(a.id);
    const pct=done?100:0;
    c.innerHTML+=`<div class="panel-row"><div class="panel-row-label">${a.name} <span>${pct}%</span></div><div class="panel-bar"><div class="panel-bar-fill" style="width:${pct}%;background:${colors[i%5]};"></div></div></div>`;
  });
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeParent();goBack();}});
window.addEventListener('load',init);
</script>
