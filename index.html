<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Aya — Learning Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07071A;--card:#12123A;--card2:#1a1a40;
  --gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;
  --red:#EF5350;--purple:#AB47BC;--pink:#F48FB1;
  --orange:#FF7043;--cyan:#26C6DA;--cream:#FFF8F0;
  --font-h:'Fredoka One',cursive;
  --font-b:'Quicksand',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);font-family:var(--font-b);
  color:var(--cream);touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation-delay:var(--dl,0s)}
50%{opacity:.9}}

.tbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.tbar-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbar-back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbar-btn:active,.tbar-back:active{transform:scale(.9)}
.tbar-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}

.hero{padding:16px 16px 12px;position:relative;z-index:1;text-align:center}
.hero-emoji{font-size:4rem;margin-bottom:4px}
.hero-title{font-family:var(--font-h);font-size:1.6rem;color:var(--gold)}
.hero-sub{font-size:.78rem;opacity:.5;margin-top:4px}
.hero-name{font-size:.9rem;color:var(--gold);opacity:.8;margin-top:2px}

.scroll-area{position:relative;z-index:1;padding:0 16px 100px;overflow-y:auto}

/* Montessori sections */
.section{margin-bottom:24px}
.section-label{
  font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;
  opacity:.35;margin-bottom:8px;padding-left:2px;
}
.section-title{
  font-family:var(--font-h);font-size:1rem;
  margin-bottom:10px;padding-left:2px;
}

/* Curriculum cards — 2-col grid */
.curriculum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{
  background:var(--card);border-radius:16px;padding:14px 12px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);
  display:flex;flex-direction:column;gap:4px;
  transition:transform .15s;position:relative;overflow:hidden;
  font-family:var(--font-b);
}
.ccard:active{transform:scale(.97)}
.ccard.locked{opacity:.45;cursor:not-allowed}
.ccard.locked:active{transform:none}
.ccard-banner{
  position:absolute;top:0;right:0;
  padding:3px 8px;border-radius:0 14px 0 8px;
  font-size:.6rem;font-family:var(--font-h);
  background:rgba(0,0,0,.25);
}
.ccard-emoji{font-size:2rem;margin-bottom:4px}
.ccard-name{font-family:var(--font-h);font-size:.85rem}
.ccard-desc{font-size:.68rem;opacity:.5;line-height:1.3}
.ccard-text{font-size:.65rem;opacity:.6;margin-top:6px}

/* Cosmic section — full width */
.cosmic-card{
  background:linear-gradient(135deg,#1a0a3a 0%,#12123a 100%);
  border-radius:16px;padding:16px;cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);
  display:flex;align-items:center;gap:14px;
  transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.35);
  font-family:var(--font-b);
}
.cosmic-card:active{transform:scale(.98)}
.cosmic-emoji{font-size:2.5rem;flex-shrink:0}
.cosmic-title{font-family:var(--font-h);font-size:.95rem;margin-bottom:2px}
.cosmic-desc{font-size:.72rem;opacity:.55;line-height:1.3}

/* Offline banner */
.offline-banner{
  background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);
  color:var(--green);padding:8px 16px;text-align:center;font-size:.78rem;
  margin:0 -16px;display:none;
}
.offline-banner.show{display:block}

/* Missions */
.missions-card{
  background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.2);
  border-radius:14px;padding:14px;margin-top:8px;
}
.missions-title{font-family:var(--font-h);font-size:.82rem;color:var(--green);margin-bottom:8px}
.mission-item{
  font-size:.75rem;opacity:.6;padding:4px 0;
  display:flex;align-items:center;gap:6px;
}
.mission-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}

/* Name modal */
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.name-modal.show{display:flex}
.name-box{background:var(--card);border-radius:24px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.name-title{font-family:var(--font-h);font-size:1.4rem;color:var(--gold);margin-bottom:8px}
.name-sub{font-size:.82rem;opacity:.6;margin-bottom:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.name-input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--cream);font-family:var(--font-b);font-size:1rem;text-align:center;margin-bottom:16px;outline:none}
.name-input:focus{border-color:var(--gold)}
.name-btn{padding:14px 32px;border-radius:14px;border:none;background:var(--gold);color:var(--bg);font-family:var(--font-h);font-size:1rem;cursor:pointer;width:100%}

/* FABs */
.fab{position:fixed;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fab:active{transform:scale(.9)}
.fab-home{left:20px;bottom:20px;background:var(--green);color:#fff}
.fab-parent{right:20px;bottom:20px;background:var(--gold);color:var(--bg)}
.fab-rabbity{right:20px;bottom:80px;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream)}
.bubble{position:fixed;bottom:138px;right:20px;z-index:99;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;max-width:210px;font-size:.8rem;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.bubble.on{opacity:1}

/* Parent panel */
.ppanel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.ppanel.on{transform:translateY(0)}
.phan-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.phan-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.prow{margin-bottom:12px}
.prow-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}
.pnote{font-size:.72rem;color:#666;line-height:1.5;margin-top:4px}

/* Offline Mission */
.offline-mission{background:linear-gradient(135deg,#1a3a2a 0%,#0d2818 100%);border:2px solid #4CAF50;border-radius:20px;padding:20px 16px;margin:12px 0;text-align:center;animation:popIn .4s ease}
.offline-mission .omi-eyebrow{font-size:.65rem;color:#81C784;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-family:var(--font-h)}
.offline-mission .omi-title{font-family:var(--font-h);font-size:1.05rem;color:#FFF8F0;margin-bottom:12px}
.offline-mission .omi-section{margin:10px 0;text-align:left;background:rgba(255,255,255,.05);border-radius:12px;padding:10px 14px}
.offline-mission .omi-label{font-size:.68rem;color:#A5D6A7;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.offline-mission .omi-value{font-size:.82rem;color:#FFF8F0;line-height:1.5}
.offline-mission .omi-question{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:12px;padding:12px 14px;margin-top:12px}
.offline-mission .omi-q-text{font-size:.88rem;color:#FFD700;font-style:italic;margin-bottom:8px}
.offline-mission .omi-q-hint{font-size:.72rem;color:rgba(255,248,240,.6)}
.offline-mission .omi-close{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#FFF8F0;border-radius:12px;padding:10px 20px;font-size:.82rem;cursor:pointer;margin-top:14px;font-family:var(--font-b);font-weight:600}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.conf{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 2.5s ease-out forwards}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* Release accessibility baseline */
:focus-visible{outline:3px solid #FFD700!important;outline-offset:3px!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
    /* Daily Wow */
    .dw-card{
      background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
      border:1.5px solid #FFD54F55;border-radius:18px;padding:16px;margin-bottom:4px;
    }
    .dw-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .dw-emoji{font-size:1.5rem}
    .dw-topic{font-family:"Fredoka One",system-ui,sans-serif;font-size:.8rem;
      color:#FFD54F;letter-spacing:.08em;text-transform:uppercase}
    .dw-fact{font-size:.9rem;line-height:1.55;opacity:.92;margin-bottom:10px}
    .dw-more{margin:4px 0 10px}
    .dw-row{font-size:.8rem;line-height:1.5;opacity:.75;margin-bottom:8px}
    .dw-label{display:block;font-size:.65rem;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;opacity:.6;margin-bottom:2px}
    .dw-sim{display:inline-block;margin-top:4px;color:#00BCD4;font-size:.8rem;
      font-weight:700;text-decoration:none;padding:8px 14px;border:1px solid #00BCD455;
      border-radius:12px}
    .dw-btn{width:100%;background:rgba(255,213,79,0.15);border:1px solid rgba(255,213,79,0.4);
      color:#FFD54F;font-family:inherit;font-size:.85rem;font-weight:700;
      padding:11px;border-radius:13px;cursor:pointer}
    .dw-btn:active{transform:scale(.97)}
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen on" id="s-home">
  <div class="tbar">
    <div></div>
    <h1 class="tbar-title">Belajar Aya</h1>
    <button class="tbar-btn" type="button" aria-label="Buka progres belajar" aria-expanded="false" onclick="togglePanel(this)">&#128100;</button>
  </div>
  <div class="offline-banner" id="offline-banner">&#128269; Offline — learning continues!</div>

  <div class="hero">
    <div class="hero-emoji">&#128049;</div>
    <div class="hero-title" aria-hidden="true">Belajar Aya</div>
    <div class="hero-sub" id="hero-sub">Your Montessori learning journey</div>
    <div class="hero-name" id="hero-name"></div>
  </div>

  <div class="scroll-area">

    <!-- Daily Wow -->
    <div class="section" id="daily-wow-section" style="display:none">
      <h2 class="section-label">Daily Wow</h2>
      <div id="daily-wow-card"></div>
      <a href="wow.html" style="display:inline-block;margin-top:6px;font-size:.72rem;color:#26C6DA;text-decoration:none;font-weight:700">🔭 See all past wows →</a>
    </div>

    <!-- Primary Curriculum -->
    <div class="section">
      <h2 class="section-label">Primary Curriculum</h2>
      <div class="curriculum-grid" id="primary-grid"></div>
    </div>

    <!-- Cosmic Education Bridge -->
    <div class="section">
      <h2 class="section-label">Cosmic Education</h2>
      <div class="section-title">The Story of Everything</div>
      <button class="cosmic-card" onclick="openApp('five-great-lessons.html')">
        <div class="cosmic-emoji">&#127756;</div>
        <div>
          <div class="cosmic-title">Five Great Lessons</div>
          <div class="cosmic-desc">The origin of the universe, life, humans, language, and numbers</div>
        </div>
      </button>
      <div class="missions-card" id="missions-card">
        <div class="missions-title">&#127754; Real-World Mission</div>
        <div id="missions-list"></div>
      </div>
    </div>

  </div>
</div>

<!-- MODALS -->
<div class="name-modal" id="name-modal">
  <div class="name-box">
    <div class="name-title">What is your name?</div>
    <div class="name-sub">Let's start your learning journey!</div>
    <label for="name-input" class="sr-only">Nama pelajar</label>
    <input class="name-input" id="name-input" aria-label="Nama pelajar" type="text" placeholder="Your name..." maxlength="30" autocomplete="off" autocorrect="off">
    <button class="name-btn" type="button" onclick="saveName()">Let's go!</button>
  </div>
</div>

<!-- FABs -->
<button class="fab fab-home" type="button" aria-label="Kembali ke beranda" onclick="window.location='index.html'">&#127968;</button>
<button class="fab fab-parent" type="button" aria-label="Buka progres belajar" aria-expanded="false" onclick="togglePanel(this)">&#128100;</button>
<button class="fab fab-rabbity" type="button" aria-label="Dengarkan bantuan Aya" onclick="rabbitySpeak()">&#128049;</button>
<div class="bubble" id="bubble" role="status" aria-live="polite"></div>

<!-- Parent Panel -->
<section class="ppanel" id="ppanel" aria-label="Progres belajar" aria-hidden="true">
  <div class="phan-handle"></div>
  <button type="button" aria-label="Tutup progres belajar" onclick="togglePanel(this)" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">&#10005;</button>
  <div class="phan-title">&#128202; Learning Journey</div>
  <div id="pcontent"></div>
</section>

<div class="confetti" id="confetti"></div>

<script src="daily-wow.js"></script>
<script>
// ─────────────────────────────────────────────
// PROFILE + VERSIONED STORAGE
// ─────────────────────────────────────────────
var profile = { name: "", avatar: "&#128049;" };
var STORAGE_VERSION = 1;
var STORAGE_KEYS = [
  "aya-profile", "aya-progress-v1",
  "skip-progress", "math-progress", "language-progress",
  "sens-progress", "pl-progress", "culture-progress", "fgl-progress", "explore-progress"
];

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function clearProfile(){
  ls("aya-profile", {name:"",avatar:"&#128049;"});
  profile = {name:"",avatar:"&#128049;"};
  var heroName = document.getElementById("hero-name");
  var heroSub = document.getElementById("hero-sub");
  if(heroName) heroName.textContent = "";
  if(heroSub) heroSub.textContent = "";
  localStorage.removeItem("aya-progress-v1");
  renderPrimary();
  say("Profile cleared. Let's start fresh!");
}

function clearAllData(){
  STORAGE_KEYS.forEach(function(k){ localStorage.removeItem(k); });
  ls("aya-profile", {name:"",avatar:"&#128049;"});
  ls("aya-progress-v1", {});
  profile = {name:"",avatar:"&#128049;"};
  localStorage.removeItem("aya-shared-notice-v1");
  var heroName = document.getElementById("hero-name");
  var heroSub = document.getElementById("hero-sub");
  if(heroName) heroName.textContent = "";
  if(heroSub) heroSub.textContent = "";
  renderPrimary();
  say("All data cleared. Ready for a fresh start!");
}

function renderPanelFooter(){
  return '<div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(0,0,0,.1)">'+
    '<div style="font-size:.72rem;color:#999;margin-bottom:10px">Data</div>'+
    '<button onclick="clearProfile()" style="display:block;width:100%;padding:10px 14px;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:10px;font-size:.78rem;cursor:pointer;margin-bottom:8px;text-align:left">Clear profile name</button>'+
    '<button onclick="confirmClearAll()" style="display:block;width:100%;padding:10px 14px;background:#fde8e8;color:#c62828;border:1px solid #ef9a9a;border-radius:10px;font-size:.78rem;cursor:pointer;text-align:left">Clear all learning data</button>'+
    '<div id="confirm-clear" style="display:none;margin-top:10px;padding:12px;background:#fff3f3;border:1px solid #ef9a9a;border-radius:10px">'+
      '<div style="font-size:.75rem;color:#333;margin-bottom:10px">Clear everything? This cannot be undone.</div>'+
      '<button onclick="clearAllData();document.getElementById(\'confirm-clear\').style.display=\'none\'" style="padding:8px 16px;background:#c62828;color:#fff;border:none;border-radius:8px;font-size:.78rem;cursor:pointer;margin-right:8px">Yes, clear all</button>'+
      '<button onclick="document.getElementById(\'confirm-clear\').style.display=\'none\'" style="padding:8px 16px;background:#fff;color:#333;border:1px solid #ccc;border-radius:8px;font-size:.78rem;cursor:pointer">Cancel</button>'+
    '</div>'+
  '</div>';
}

function confirmClearAll(){
  var el = document.getElementById("confirm-clear");
  if(el) el.style.display = "block";
}

// ─────────────────────────────────────────────
// OFFLINE MISSIONS
// bible requirement: every activity has a real-world extension
// ─────────────────────────────────────────────
var MISSIONS = {
  // SKIP COUNTING
  skipbuild: {
    title: "Build Equal Groups",
    materials: ["Small objects (buttons, blocks, seeds, or pebbles)", "A flat surface or tray"],
    steps: ["Gather a handful of objects", "Count out groups — for example, put 2 buttons together, then 2 more, then 2 more", "Notice how many groups you have", "Try with 3s, 5s, or 10s instead of 2s"],
    adult: "Sit nearby and ask, \"How many groups do you see?\" without correcting.",
    safety: "Small objects — keep away from mouth for children under 3.",
    question: "What happens if you count the objects one by one instead?",
    finish: "When all objects are in equal groups and the child can describe them."
  },
  skipjump: {
    title: "Jump Along the Number Line",
    materials: ["A clear floor space or garden path", "Sidewalk chalk (optional)"],
    steps: ["Draw a number line from 0 to 20 on the ground with chalk", "Stand at 0", "Count by 2s out loud: 0, 2, 4, 6...", "Jump to each number as you say it"],
    adult: "Call out a target number and ask the child to jump there.",
    safety: "Make sure there is soft ground or a helper nearby for balance.",
    question: "If you jump by 5s instead of 2s, where do you land first?",
    finish: "When the child can jump to 10 or 20 by counting in equal steps."
  },
  skipnext: {
    title: "Skip Count the Real World",
    materials: ["Egg carton, ice cube tray, or muffin tin", "Small objects (pebbles, dried pasta, beads)"],
    steps: ["Fill one compartment with 2 objects", "Skip-count to fill the rest: 2, 4, 6, 8...", "Notice the pattern in the container"],
    adult: "Ask, \"Can you predict how many will be in the last compartment?\"",
    safety: "Small objects — keep away from mouth.",
    question: "What do you notice about the last number in each row?",
    finish: "When the child can predict the next number before filling it."
  },

  // MATH
  numbers: {
    title: "Count Real Objects",
    materials: ["Any collection of 10-20 objects: toys, fruit, spoons, leaves"],
    steps: ["Spread the objects on a tray or mat", "Touch and count each one slowly", "Arrange them in a line to check your count", "Try counting backwards from the last one"],
    adult: "Watch silently the first time, then ask: \"How do you know the count is right?\"",
    safety: "No hazards.",
    question: "If you close your eyes and I move one, can you tell which one is missing?",
    finish: "When the child can count 10-20 objects reliably and explain how they checked."
  },
  rods: {
    title: "Build Staircases with Objects",
    materials: ["Books of different sizes, or blocks stacked smallest to largest", "A flat surface"],
    steps: ["Find 10 objects that grow in size", "Arrange them smallest to tallest like a staircase", "Say the number name for each step as you build"],
    adult: "Ask: \"Which step is longer? How much longer is it than the one before?\"",
    safety: "No hazards.",
    question: "Can you build the staircase going down instead of up?",
    finish: "When the staircase is ordered correctly and the child can describe the pattern."
  },
  spindles: {
    title: "Match Groups to Numbers",
    materials: ["Paper and a pencil", "A collection of small objects"],
    steps: ["Write numbers 1-9 on paper", "Next to each number, count out that many objects", "Notice when groups match their number"],
    adult: "Mix up the objects and ask: \"Which group has more? How do you know?\"",
    safety: "Small objects — keep away from mouth.",
    question: "Can you put the groups in order from smallest to biggest without counting?",
    finish: "When the child can match number symbols to quantities correctly."
  },
  teen: {
    title: "Count a Teen Collection",
    materials: ["10 of something (sticks, pencils, or blocks)", "A cup or bowl"],
    steps: ["Gather 10 objects and put them in the bowl", "Add 1 more — that is eleven", "Keep adding one more: twelve, thirteen, fourteen...", "Notice how ten and something always makes the teen number"],
    adult: "Ask: \"If you have ten and add three, what number is that?\" after the child has explored.",
    safety: "No hazards.",
    question: "Why do you think eleven starts with a one even though it means ten and one more?",
    finish: "When the child can count from 11 to 19 and explain that it means 10 plus some more."
  },

function showOfflineMission(key, nextUrl){
  var m = MISSIONS[key];
  if(!m) return;
  var container = document.getElementById("mission-container") || document.body;
  var el = document.createElement("div");
  el.style.cssText = "position:fixed;inset:0;background:rgba(7,7,26,.92);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto";
  el.innerHTML =
    "<div class=\"offline-mission\" style=\"max-width:440px;width:100%;position:relative\">"+
      "<div class=\"omi-eyebrow\">Real World Mission</div>"+
      "<div class=\"omi-title\">"+m.title+"</div>"+
      "<div class=\"omi-section\"><div class=\"omi-label\">Materials</div><div class=\"omi-value\">"+m.materials.map(function(item){return "• "+item;}).join("<br>")+"</div></div>"+
      "<div class=\"omi-section\"><div class=\"omi-label\">Steps</div><div class=\"omi-value\">"+m.steps.map(function(s,i){return (i+1)+". "+s;}).join("<br>")+"</div></div>"+
      "<div class=\"omi-section\"><div class=\"omi-label\">Adult's Role</div><div class=\"omi-value\">"+m.adult+"</div></div>"+
      "<div class=\"omi-section\"><div class=\"omi-label\">Safety</div><div class=\"omi-value\">"+m.safety+"</div></div>"+
      "<div class=\"omi-question\">"+
        "<div class=\"omi-q-text\">\""+m.question+"\"</div>"+
        "<div class=\"omi-q-hint\">Ask this after the activity — there is no wrong answer.</div>"+
      "</div>"+
      "<div class=\"omi-section\"><div class=\"omi-label\">Done when</div><div class=\"omi-value\">"+m.finish+"</div></div>"+
      "<button class=\"omi-close\" onclick='closeMission(this.parentNode)'>Done — go back</button>"+
    "</div>";
  container.appendChild(el);
}

function closeMission(el){if(el&&el.parentNode)el.parentNode.removeChild(el);}

function showMission(key){
  showOfflineMission(key);
}

    desc:"Geography, science, nature, and history",
    file:"cultural.html",

  },
  {
    id:"skip", emoji:"&#128279;", color:"#78909C",
    name:"Skip Counting",
    desc:"Jump patterns and equal groups",
    file:"skip-counting.html",

  },
  {
    id:"explore", emoji:"&#127757;", color:"#00BCD4",

// ─────────────────────────────────────────────
// MISSIONS — offline real-world activities
// ─────────────────────────────────────────────
var DAILY_MISSION_TIPS = [
  "Sort objects by size, shape, or color",
  "Count steps from the bedroom to the kitchen",
  "Find three things that are longer than your hand",
  "Name the colors you see outside",
  "Pour water from one cup to another",
  "Pick up small objects using tongs",
  "Match socks from the laundry pile",
  "Water a plant and watch what happens",
  "Find a shape hidden in the room",
  "Set the table for two people",
];

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  genStars();
  loadProfile();
  renderPrimary();
  renderDailyWow();
  renderMissions();
  checkSharedDevice();
  if(!profile.name){
    setTimeout(showNameModal, 500);
  }
}

function checkSharedDevice(){
  if(lg("aya-shared-notice-v1", false)) return;
  var notice = document.createElement("div");
  notice.style.cssText = "position:fixed;top:0;left:0;right:0;background:#1565C0;color:#fff;text-align:center;padding:10px 16px;font-size:.78rem;z-index:300;line-height:1.5";
  notice.innerHTML = "&#128279; This device is shared. Use \"Clear profile\" in the parent panel to switch learners.";
  notice.id = "shared-notice";
  document.body.appendChild(notice);
  setTimeout(function(){
    var n = document.getElementById("shared-notice");
    if(n) n.style.opacity = "0";
    setTimeout(function(){ var n2 = document.getElementById("shared-notice"); if(n2) n2.remove(); }, 300);
  }, 6000);
}

function loadProfile(){
  profile = lg("aya-profile", {name:"",avatar:"&#128049;"});
  if(profile.name){
    var h = new Date().getHours();
    var time = h<12?"Good morning":h<17?"Good afternoon":"Good evening";
    document.getElementById("hero-sub").textContent = time + "!";
    document.getElementById("hero-name").textContent = profile.name + ", let's explore!";
  }
}

function showNameModal(){
  document.getElementById("name-modal").classList.add("show");
  var inp = document.getElementById("name-input");
  inp.focus();
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter") saveName();
  });
}

function saveName(){
  var inp = document.getElementById("name-input");
  var name = inp.value.trim() || "Learner";
  ls("aya-shared-notice-v1", true);
  profile.name = name;
  ls("aya-profile", profile);
  document.getElementById("name-modal").classList.remove("show");
  document.getElementById("hero-sub").textContent = "Welcome!";
  document.getElementById("hero-name").textContent = "Hello, " + name + "!";
  say("Hello " + name + "! Let's start exploring!");
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderPrimary(){
  var grid = document.getElementById("primary-grid");
  grid.innerHTML = "";
  PRIMARY.forEach(function(p){
    var prog = lg(p.progKey, {});
    var done = Object.keys(prog).length;
    var total = p.total;
    var pct = Math.min(100, Math.round((done/total)*100));
    var banner = pct >= 100 ? "Done!" : (p.locked ? "Coming" : "");
    var card = document.createElement("button");
    card.className = "ccard" + (p.locked?" locked":"");
    card.style.background = p.color;
    card.innerHTML =
      '<div class="ccard-banner">'+banner+'</div>'+
      '<div class="ccard-emoji">'+p.emoji+'</div>'+
      '<div class="ccard-name">'+p.name+'</div>'+
      '<div class="ccard-desc">'+p.desc+'</div>'+
      '<div class="ccard-text">'+done+' of '+total+' explored</div>'+
      (pct >= 100 ? '<div style="font-size:.7rem;opacity:.8">Complete!</div>' : '')+
    '</div>';
    if(p.file && !p.locked){
      card.onclick = function(){ window.location = p.file; };
    }
    grid.appendChild(card);
  });
}

// ─────────────────────────────────────────────
// DAILY WOW — today's discovery, synced from Papa's morning briefing
// ─────────────────────────────────────────────
function renderDailyWow(){
  var section = document.getElementById("daily-wow-section");
  var card = document.getElementById("daily-wow-card");
  if(!section || !card) return;
  if(typeof window.DAILY_WOW === "undefined" || !window.DAILY_WOW || !window.DAILY_WOW.fact){
    section.style.display = "none";
    return;
  }
  var d = window.DAILY_WOW;
  var today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jakarta" });
  if(d.date !== today){
    section.style.display = "none";
    return;
  }
  var store = {};
  try{ store = JSON.parse(localStorage.getItem("dailywow-open") || "{}"); }catch(e){}
  var isOpen = store[d.date] === true;
  var simLink = d.sim ? '<a class="dw-sim" href="' + d.sim + '">Explore it →</a>' : "";
  card.innerHTML =
    '<div class="dw-card" style="border-color:' + d.color + '55">' +
      '<div class="dw-top">' +
        '<span class="dw-emoji">' + d.emoji + '</span>' +
        '<span class="dw-topic">' + d.topic + '</span>' +
      '</div>' +
      '<div class="dw-fact">' + d.fact + '</div>' +
      (isOpen ?
        '<div class="dw-more">' +
          '<div class="dw-row"><span class="dw-label">🤔 Ask her</span>' + d.ask + '</div>' +
          '<div class="dw-row"><span class="dw-label">💡 Hint</span>' + d.hint + '</div>' +
          '<div class="dw-row"><span class="dw-label">🔎 Try this</span>' + d.trythis + '</div>' +
          '<div class="dw-row"><span class="dw-label">🧠 For you</span>' + d.kid + '</div>' +
          simLink +
        '</div>' +
        '<button class="dw-btn" onclick="toggleWow(\'' + d.date + '\',false)">Show less</button>'
      :
        '<button class="dw-btn" onclick="toggleWow(\'' + d.date + '\',true)">Open the wow</button>'
      ) +
    '</div>';
  section.style.display = "block";
}
function toggleWow(date, openState){
  var store = {};
  try{ store = JSON.parse(localStorage.getItem("dailywow-open") || "{}"); }catch(e){}
  store[date] = openState;
  try{ localStorage.setItem("dailywow-open", JSON.stringify(store)); }catch(e){}
  renderDailyWow();
}

function renderMissions(){
  var list = document.getElementById("missions-list");
  var shuffled = DAILY_MISSION_TIPS.slice().sort(function(){return Math.random()-0.5;});
  var pick = shuffled.slice(0,2);
  list.innerHTML = pick.map(function(m){
    return '<div class="mission-item"><div class="mission-dot"></div>'+m+'</div>';
  }).join("");
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function openApp(file){
  window.location = file;
}

function rabbitySpeak(){
  var msgs = [
    "Every area of learning connects to everything else!",
    "Start with whatever feels most interesting today!",
    "Practical Life builds concentration first!",
    "Mathematics is about understanding, not memorising!",
    "You are capable of amazing focus!",
    "Language opens the door to all other knowledge!",
  ];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}

function say(text){
  var b = document.getElementById("bubble");
  if(b){ b.textContent = "🐱 " + text; b.classList.add("on"); }
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){ if(b) b.classList.remove("on"); }, 3500);
}

var panelOpener = null;
function togglePanel(trigger){
  var p = document.getElementById("ppanel");
  if(!p) return;
  var wasOpen = p.classList.contains("on");
  if(!wasOpen && trigger) panelOpener = trigger;
  p.classList.toggle("on");
  var open = p.classList.contains("on");
  p.setAttribute("aria-hidden", String(!open));
  document.querySelectorAll("[aria-label=\"Buka progres belajar\"]").forEach(function(button){button.setAttribute("aria-expanded", String(open));});
  if(open) renderPanel();
  if(!open && panelOpener) panelOpener.focus();
}

function renderPanel(){
  var c = document.getElementById("pcontent");
  if(!c) return;
  var areas = [
    {name:"Practical Life", key:"pl-progress", color:"#E65100", file:"practical-life.html", total:5},
    {name:"Sensorial", key:"sens-progress", color:"#F48FB1", file:"sensorial.html", total:8},
    {name:"Language", key:"language-progress", color:"#42A5F5", file:"language.html", total:3},
    {name:"Mathematics", key:"math-progress", color:"#66BB6A", file:"math.html", total:13},
    {name:"Cultural Studies", key:"culture-progress", color:"#AB47BC", file:"cultural.html", total:11},
    {name:"Skip Counting", key:"skip-progress", color:"#78909C", file:"skip-counting.html", total:6},
    {name:"Five Great Lessons", key:"fgl-progress", color:"#6A1B9A", file:"five-great-lessons.html", total:19},
  ];
  c.innerHTML = '<div style="font-size:.72rem;color:#999;margin-bottom:14px">Montessori Learning Journey</div>';
  areas.forEach(function(a){
    var prog = lg(a.key, {});
    var done = Object.keys(prog).length;
    var total = a.total;
    var pct = Math.min(100, Math.round((done/total)*100));
    var status = pct >= 100 ? "Done" : (done === 0 ? "Not started" : "In progress");
    c.innerHTML += '<div class="prow"><div class="prow-label"><span>'+a.name+'</span><span style="font-size:.72rem;font-weight:400;opacity:.6">'+status+'</span></div><div class="pnote">'+done+' of '+total+' explored</div></div>';
  });
  c.innerHTML += '<div style="margin-top:16px;padding:12px;background:#f5f5f5;border-radius:10px"><div style="font-family:var(--font-h);font-size:.8rem;color:#666;margin-bottom:6px">&#127754; Montessori Philosophy</div><div style="font-size:.72rem;color:#888;line-height:1.6">The five curriculum areas work together. Sensorial foundations support mathematical perception. Practical Life builds concentration for all other work. Language connects every subject. Cultural Studies and Cosmic Education give context to everything.</div></div>';
  c.innerHTML += renderPanelFooter();
}

function genStars(){
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for(var i=0;i<60;i++){
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random()*2+1;
    s.style.cssText = "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+sz+"px;height:"+sz+"px;--d:"+(Math.random()*2+2).toFixed(1)+"s;--dl:"+(Math.random()*3).toFixed(1)+"s";
    el.appendChild(s);
  }
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    document.getElementById("ppanel").classList.remove("on");
    document.getElementById("name-modal").classList.remove("show");
  }
});
window.addEventListener("offline", function(){ document.getElementById("offline-banner").classList.add("show"); });
window.addEventListener("online", function(){ document.getElementById("offline-banner").classList.remove("show"); });
window.addEventListener("load", init);
</script>
