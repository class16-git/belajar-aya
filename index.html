<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Belajar Aya — Learning Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07071A;--card:#12123A;--card2:#1a1a40;
  --gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;
  --red:#EF5350;--purple:#AB47BC;--pink:#F48FB1;
  --orange:#FF7043;--cyan:#26C6DA;--cream:#FFF8F0;
  --font-h:'Fredoka One',cursive;
  --font-b:'Quicksand',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);font-family:var(--font-b);
  color:var(--cream);touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.on{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;background:#fff;border-radius:50%;animation:tw var(--d,3s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

.tbar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.tbar-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbar-back{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tbar-btn:active,.tbar-back:active{transform:scale(.9)}
.tbar-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}

.hero{padding:16px 16px 12px;position:relative;z-index:1;text-align:center}
.hero-emoji{font-size:4rem;margin-bottom:4px}
.hero-title{font-family:var(--font-h);font-size:1.6rem;color:var(--gold)}
.hero-sub{font-size:.78rem;opacity:.5;margin-top:4px}
.hero-name{font-size:.9rem;color:var(--gold);opacity:.8;margin-top:2px}

.scroll-area{position:relative;z-index:1;padding:0 16px 100px;overflow-y:auto}

/* Montessori sections */
.section{margin-bottom:24px}
.section-label{
  font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;
  opacity:.35;margin-bottom:8px;padding-left:2px;
}
.section-title{
  font-family:var(--font-h);font-size:1rem;
  margin-bottom:10px;padding-left:2px;
}

/* Curriculum cards — 2-col grid */
.curriculum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{
  background:var(--card);border-radius:16px;padding:14px 12px;
  box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);
  display:flex;flex-direction:column;gap:4px;
  transition:transform .15s;position:relative;overflow:hidden;
  font-family:var(--font-b);
}
.ccard:active{transform:scale(.97)}
.ccard.locked{opacity:.45;cursor:not-allowed}
.ccard.locked:active{transform:none}
.ccard-banner{
  position:absolute;top:0;right:0;
  padding:3px 8px;border-radius:0 14px 0 8px;
  font-size:.6rem;font-family:var(--font-h);
  background:rgba(0,0,0,.25);
}
.ccard-emoji{font-size:2rem;margin-bottom:4px}
.ccard-name{font-family:var(--font-h);font-size:.85rem}
.ccard-desc{font-size:.68rem;opacity:.5;line-height:1.3}
.ccard-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:6px;overflow:hidden}
.ccard-fill{height:100%;border-radius:2px;transition:width .4s}

/* Cosmic section — full width */
.cosmic-card{
  background:linear-gradient(135deg,#1a0a3a 0%,#12123a 100%);
  border-radius:16px;padding:16px;cursor:pointer;border:none;
  width:100%;text-align:left;color:var(--cream);
  display:flex;align-items:center;gap:14px;
  transition:transform .15s;box-shadow:0 4px 16px rgba(0,0,0,.35);
  font-family:var(--font-b);
}
.cosmic-card:active{transform:scale(.98)}
.cosmic-emoji{font-size:2.5rem;flex-shrink:0}
.cosmic-title{font-family:var(--font-h);font-size:.95rem;margin-bottom:2px}
.cosmic-desc{font-size:.72rem;opacity:.55;line-height:1.3}

/* Offline banner */
.offline-banner{
  background:rgba(76,175,80,.15);border:1px solid rgba(76,175,80,.3);
  color:var(--green);padding:8px 16px;text-align:center;font-size:.78rem;
  margin:0 -16px;display:none;
}
.offline-banner.show{display:block}

/* Missions */
.missions-card{
  background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.2);
  border-radius:14px;padding:14px;margin-top:8px;
}
.missions-title{font-family:var(--font-h);font-size:.82rem;color:var(--green);margin-bottom:8px}
.mission-item{
  font-size:.75rem;opacity:.6;padding:4px 0;
  display:flex;align-items:center;gap:6px;
}
.mission-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}

/* Name modal */
.name-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.name-modal.show{display:flex}
.name-box{background:var(--card);border-radius:24px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.name-title{font-family:var(--font-h);font-size:1.4rem;color:var(--gold);margin-bottom:8px}
.name-sub{font-size:.82rem;opacity:.6;margin-bottom:20px}
.name-input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--cream);font-family:var(--font-b);font-size:1rem;text-align:center;margin-bottom:16px;outline:none}
.name-input:focus{border-color:var(--gold)}
.name-btn{padding:14px 32px;border-radius:14px;border:none;background:var(--gold);color:var(--bg);font-family:var(--font-h);font-size:1rem;cursor:pointer;width:100%}

/* FABs */
.fab{position:fixed;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.2rem;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.fab:active{transform:scale(.9)}
.fab-home{left:20px;bottom:20px;background:var(--green);color:#fff}
.fab-parent{right:20px;bottom:20px;background:var(--gold);color:var(--bg)}
.fab-rabbity{right:20px;bottom:80px;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream)}
.bubble{position:fixed;bottom:138px;right:20px;z-index:99;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 14px;max-width:210px;font-size:.8rem;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.bubble.on{opacity:1}

/* Parent panel */
.ppanel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.ppanel.on{transform:translateY(0)}
.phan-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.phan-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.prow{margin-bottom:12px}
.prow-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .5s}
.pnote{font-size:.72rem;color:#666;line-height:1.5;margin-top:4px}

/* Confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.conf{position:absolute;width:9px;height:9px;border-radius:2px;animation:cf 2.5s ease-out forwards}
@keyframes cf{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen on" id="s-home">
  <div class="tbar">
    <div></div>
    <div class="tbar-title">Belajar Aya</div>
    <button class="tbar-btn" onclick="togglePanel()">&#128100;</button>
  </div>
  <div class="offline-banner" id="offline-banner">&#128269; Offline — learning continues!</div>

  <div class="hero">
    <div class="hero-emoji">&#128049;</div>
    <div class="hero-title">Belajar Aya</div>
    <div class="hero-sub" id="hero-sub">Your Montessori learning journey</div>
    <div class="hero-name" id="hero-name"></div>
  </div>

  <div class="scroll-area">

    <!-- Primary Curriculum -->
    <div class="section">
      <div class="section-label">Primary Curriculum</div>
      <div class="curriculum-grid" id="primary-grid"></div>
    </div>

    <!-- Cosmic Education Bridge -->
    <div class="section">
      <div class="section-label">Cosmic Education</div>
      <div class="section-title">The Story of Everything</div>
      <button class="cosmic-card" onclick="openApp('five-great-lessons.html')">
        <div class="cosmic-emoji">&#127756;</div>
        <div>
          <div class="cosmic-title">Five Great Lessons</div>
          <div class="cosmic-desc">The origin of the universe, life, humans, language, and numbers</div>
        </div>
      </button>
      <div class="missions-card" id="missions-card">
        <div class="missions-title">&#127754; Real-World Mission</div>
        <div id="missions-list"></div>
      </div>
    </div>

  </div>
</div>

<!-- MODALS -->
<div class="name-modal" id="name-modal">
  <div class="name-box">
    <div class="name-title">What is your name?</div>
    <div class="name-sub">Let's start your learning journey!</div>
    <input class="name-input" id="name-input" type="text" placeholder="Your name..." maxlength="30" autocomplete="off" autocorrect="off">
    <button class="name-btn" onclick="saveName()">Let's go!</button>
  </div>
</div>

<!-- FABs -->
<button class="fab fab-home" onclick="window.location='index.html'">&#127968;</button>
<button class="fab fab-parent" onclick="togglePanel()">&#128100;</button>
<button class="fab fab-rabbity" onclick="rabbitySpeak()">&#128049;</button>
<div class="bubble" id="bubble"></div>

<!-- Parent Panel -->
<div class="ppanel" id="ppanel">
  <div class="phan-handle"></div>
  <button onclick="togglePanel()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">&#10005;</button>
  <div class="phan-title">&#128202; Learning Journey</div>
  <div id="pcontent"></div>
</div>

<div class="confetti" id="confetti"></div>

<script>
// ─────────────────────────────────────────────
// PROFILE + STORAGE
// ─────────────────────────────────────────────
var profile = { name: "", avatar: "&#128049;" };

function lg(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function ls(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ─────────────────────────────────────────────
// CURRICULUM — Primary Montessori areas
// ─────────────────────────────────────────────
var PRIMARY = [
  {
    id:"prac", emoji:"&#129529;", color:"#E65100",
    name:"Practical Life",
    desc:"Care of self, environment, and others",
    file:"practical-life.html",
    progKey:"pl-progress"
  },
  {
    id:"sens", emoji:"&#128065;", color:"#F48FB1",
    name:"Sensorial",
    desc:"Refine senses through exploration",
    file:"sensorial.html",
    progKey:"sens-progress",
    locked:false
  },
  {
    id:"lang", emoji:"&#128292;", color:"#42A5F5",
    name:"Language",
    desc:"Letters, sounds, words, and expression",
    file:"language.html",
    progKey:"lang-progress"
  },
  {
    id:"math", emoji:"&#128200;", color:"#66BB6A",
    name:"Mathematics",
    desc:"Quantity, symbols, operations, and patterns",
    file:"math.html",
    progKey:"math-progress"
  },
  {
    id:"cult", emoji:"&#127759;", color:"#AB47BC",
    name:"Cultural Studies",
    desc:"Geography, science, nature, and history",
    file:"cultural.html",
    progKey:"culture-progress"
  },
  {
    id:"skip", emoji:"&#128279;", color:"#78909C",
    name:"Skip Counting",
    desc:"Jump patterns and equal groups",
    file:"skip-counting.html",
    progKey:"skip-progress"
  },
];

// ─────────────────────────────────────────────
// MISSIONS — offline real-world activities
// ─────────────────────────────────────────────
var MISSIONS = [
  "Sort objects by size, shape, or color",
  "Count steps from the bedroom to the kitchen",
  "Find three things that are longer than your hand",
  "Name the colors you see outside",
  "Pour water from one cup to another",
  "Pick up small objects using tongs",
  "Match socks from the laundry pile",
  "Water a plant and watch what happens",
  "Find a shape hidden in the room",
  "Set the table for two people",
];

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  genStars();
  loadProfile();
  renderPrimary();
  renderMissions();
  if(!profile.name){
    setTimeout(showNameModal, 500);
  }
}

function loadProfile(){
  profile = lg("aya-profile", {name:"",avatar:"&#128049;"});
  if(profile.name){
    var h = new Date().getHours();
    var time = h<12?"Good morning":h<17?"Good afternoon":"Good evening";
    document.getElementById("hero-sub").textContent = time + "!";
    document.getElementById("hero-name").textContent = profile.name + ", let's explore!";
  }
}

function showNameModal(){
  document.getElementById("name-modal").classList.add("show");
  var inp = document.getElementById("name-input");
  inp.focus();
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter") saveName();
  });
}

function saveName(){
  var inp = document.getElementById("name-input");
  profile.name = inp.value.trim() || "Learner";
  ls("aya-profile", profile);
  document.getElementById("name-modal").classList.remove("show");
  document.getElementById("hero-sub").textContent = "Welcome!";
  document.getElementById("hero-name").textContent = "Hello, " + profile.name + "!";
  say("Hello " + profile.name + "! Let's start exploring!");
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderPrimary(){
  var grid = document.getElementById("primary-grid");
  grid.innerHTML = "";
  PRIMARY.forEach(function(p){
    var prog = lg(p.progKey, {});
    var done = Object.keys(prog).length;
    var total = 5;
    var pct = Math.min(100, Math.round((done/total)*100));
    var banner = pct >= 100 ? "Done!" : (p.locked ? "Coming" : "");
    var card = document.createElement("button");
    card.className = "ccard" + (p.locked?" locked":"");
    card.style.background = p.color;
    card.innerHTML =
      '<div class="ccard-banner">'+banner+'</div>'+
      '<div class="ccard-emoji">'+p.emoji+'</div>'+
      '<div class="ccard-name">'+p.name+'</div>'+
      '<div class="ccard-desc">'+p.desc+'</div>'+
      '<div class="ccard-bar"><div class="ccard-fill" style="width:'+pct+'%;background:rgba(255,255,255,.4)"></div></div>';
    if(p.file && !p.locked){
      card.onclick = function(){ window.location = p.file; };
    }
    grid.appendChild(card);
  });
}

function renderMissions(){
  var list = document.getElementById("missions-list");
  var shuffled = MISSIONS.slice().sort(function(){return Math.random()-0.5;});
  var pick = shuffled.slice(0,2);
  list.innerHTML = pick.map(function(m){
    return '<div class="mission-item"><div class="mission-dot"></div>'+m+'</div>';
  }).join("");
}

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────
function openApp(file){
  window.location = file;
}

function rabbitySpeak(){
  var msgs = [
    "Every area of learning connects to everything else!",
    "Start with whatever feels most interesting today!",
    "Practical Life builds concentration first!",
    "Mathematics is about understanding, not memorising!",
    "You are capable of amazing focus!",
    "Language opens the door to all other knowledge!",
  ];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}

function say(text){
  var b = document.getElementById("bubble");
  if(b){ b.innerHTML = "🐱 " + text; b.classList.add("on"); }
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function(){ if(b) b.classList.remove("on"); }, 3500);
}

function togglePanel(){
  var p = document.getElementById("ppanel");
  if(!p) return;
  p.classList.toggle("on");
  if(p.classList.contains("on")) renderPanel();
}

function renderPanel(){
  var c = document.getElementById("pcontent");
  if(!c) return;
  var areas = [
    {name:"Practical Life", key:"pl-progress", color:"#E65100", file:"practical-life.html"},
    {name:"Sensorial", key:"sens-progress", color:"#F48FB1", file:null},
    {name:"Language", key:"lang-progress", color:"#42A5F5", file:"language.html"},
    {name:"Mathematics", key:"math-progress", color:"#66BB6A", file:"math.html"},
    {name:"Cultural Studies", key:"culture-progress", color:"#AB47BC", file:"cultural.html"},
    {name:"Skip Counting", key:"skip-progress", color:"#78909C", file:"skip-counting.html"},
    {name:"Five Great Lessons", key:"fgl-progress", color:"#6A1B9A", file:"five-great-lessons.html"},
  ];
  c.innerHTML = '<div style="font-size:.72rem;color:#999;margin-bottom:14px">Montessori Learning Journey</div>';
  areas.forEach(function(a){
    var prog = lg(a.key, {});
    var done = Object.keys(prog).length;
    var total = 5;
    var pct = Math.min(100, Math.round((done/total)*100));
    var status = pct >= 100 ? "Done" : (done === 0 ? "Not started" : "In progress");
    c.innerHTML += '<div class="prow"><div class="prow-label"><span>'+a.name+'</span><span style="font-size:.72rem;font-weight:400;opacity:.6">'+status+'</span></div><div class="pbar"><div class="pbar-fill" style="width:'+pct+'%;background:'+a.color+'"></div></div><div class="pnote">'+done+' of '+total+' activities completed</div></div>';
  });
  c.innerHTML += '<div style="margin-top:16px;padding:12px;background:#f5f5f5;border-radius:10px"><div style="font-family:var(--font-h);font-size:.8rem;color:#666;margin-bottom:6px">&#127754; Montessori Philosophy</div><div style="font-size:.72rem;color:#888;line-height:1.6">The five curriculum areas work together. Sensorial foundations support mathematical perception. Practical Life builds concentration for all other work. Language connects every subject. Cultural Studies and Cosmic Education give context to everything.</div></div>';
}

function genStars(){
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for(var i=0;i<60;i++){
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random()*2+1;
    s.style.cssText = "left:"+(Math.random()*100)+"%;top:"+(Math.random()*100)+"%;width:"+sz+"px;height:"+sz+"px;--d:"+(Math.random()*2+2).toFixed(1)+"s;--dl:"+(Math.random()*3).toFixed(1)+"s";
    el.appendChild(s);
  }
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    document.getElementById("ppanel").classList.remove("on");
    document.getElementById("name-modal").classList.remove("show");
  }
});
window.addEventListener("offline", function(){ document.getElementById("offline-banner").classList.add("show"); });
window.addEventListener("online", function(){ document.getElementById("offline-banner").classList.remove("show"); });
window.addEventListener("load", init);
</script>
</body>
</html>
