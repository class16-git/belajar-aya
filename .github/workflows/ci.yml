name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Synthetic data only. No real learner data or secrets are ever used in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
      ATLAS_ENV: preview
      ATLAS_CONTENT_MIN_REVIEW: agent_reviewed
      TURBO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Privacy scan (no real learner data tracked)
        run: pnpm privacy:scan
      - name: Curriculum schema + publication validation
        run: pnpm content:validate
      - name: Curriculum coverage report is current
        run: pnpm --filter @atlas/curriculum coverage --check
      - name: Content dashboard is current
        run: pnpm --filter @atlas/curriculum dashboard --check
      - run: pnpm --filter @atlas/database generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dependency audit, production dependencies (high+)
        run: pnpm audit --prod --audit-level high
      # ATL-11: dev and test tools run in CI with repository secrets, so the whole lockfile is gated too.
      - name: Dependency audit, full lockfile including dev tools (high+)
        run: pnpm audit --audit-level high
      - name: Dependency audit, full lockfile (moderate, report only)
        continue-on-error: true
        run: pnpm audit --audit-level moderate
      - run: pnpm db:migrate
      - name: Mark the disposable CI database as synthetic (E2E refuses unmarked databases, ATL-01)
        run: pnpm --filter @atlas/database db-role synthetic
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atlas_test
      - name: Build (preview)
        run: pnpm --filter @atlas/web build
        env:
          NODE_ENV: production
      - run: pnpm --filter @atlas/web exec playwright install --with-deps chromium
      - name: E2E + accessibility + visual QA
        run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidence
          path: |
            artifacts/screenshots
            apps/web/test-results
          retention-days: 14
