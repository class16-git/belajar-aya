<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Language & Letters — Learn Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;--cream:#FFF8F0;--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 16px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.6rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.8rem;opacity:.5}
.act-grid{display:flex;flex-direction:column;gap:10px;padding:0 16px 100px;position:relative;z-index:1}
.act-card{background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:0 4px 20px rgba(0,0,0,.3);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s;font-family:var(--font-b)}
.act-card:active{transform:scale(.97)}
.act-num{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);font-family:var(--font-h);font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-card.done .act-num{background:var(--green);border-color:var(--green);color:#fff}
.act-name{font-family:var(--font-h);font-size:1rem;margin-bottom:2px}
.act-desc{font-size:.75rem;opacity:.5;line-height:1.3}
.act-badge{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.15);font-size:.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.exp-header{padding:10px 16px 6px;position:relative;z-index:1}
.exp-title{font-family:var(--font-h);font-size:1.2rem;color:var(--gold);text-align:center;margin-bottom:4px}
.exp-prompt{font-size:.85rem;opacity:.7;text-align:center;margin-bottom:14px;padding:0 16px}
.exp-area{padding:0 16px 100px;flex:1;position:relative;z-index:1}
.exp-instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;margin:10px 0;font-size:.85rem;line-height:1.6;text-align:center;border:1px solid rgba(255,255,255,.08)}
.demo-box{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:10px 0}
.demo-label{font-size:.75rem;opacity:.5;margin-bottom:8px}
.btn{padding:12px 20px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s;display:inline-block}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12)}
.lesson-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;width:fit-content}
.lesson-back:active{transform:scale(.95)}
.letter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 0}
.letter-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;border:none;color:var(--cream);transition:all .15s;font-family:var(--font-h);font-size:1.6rem;min-height:60px;display:flex;align-items:center;justify-content:center}
.letter-card:active{transform:scale(.93)}
.letter-card.selected{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold);transform:scale(1.05)}
.word-area{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0;min-height:60px;align-items:center}
.word-letter{width:48px;height:56px;border-radius:10px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:2rem;color:var(--gold);cursor:pointer;transition:all .15s;text-transform:uppercase}
.word-letter:hover{background:rgba(255,215,0,.1);border-color:var(--gold)}
.word-letter.placed{background:rgba(255,215,0,.15);border-color:var(--gold)}
.word-letter.correct{background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green)}
.word-letter.wrong{background:rgba(239,83,80,.15);border-color:#EF5350;color:#EF5350}
.word-letter .slot-underline{font-size:.6rem;opacity:.3;position:absolute;bottom:4px}
.letter-bank{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;min-height:60px}
.bank-letter{width:48px;height:48px;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:1.6rem;cursor:pointer;transition:all .15s;color:var(--cream);border:none}
.bank-letter:active{transform:scale(.9);background:rgba(255,215,0,.15)}
.bank-letter.used{opacity:.3;cursor:default}
.picture-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:8px auto;max-width:280px}
.picture-emoji{font-size:4rem;margin:8px 0}
.canvas-wrap{position:relative;max-width:320px;margin:10px auto}
.trace-canvas{background:#1a1a2e;border-radius:12px;border:2px solid rgba(255,255,255,.1);touch-action:none;cursor:crosshair;width:100%;height:120px;display:block}
.trace-word{font-family:var(--font-h);font-size:1.4rem;color:var(--gold);margin-top:8px;text-transform:uppercase}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="top-bar">
    <div></div>
    <div style="font-family:var(--font-h);color:var(--gold);font-size:.9rem;">Language & Letters</div>
    <button class="top-btn" onclick="toggleParent()">👤</button>
  </div>
  <div class="hero">
    <div style="font-size:2.5rem;margin-bottom:4px;">🔤</div>
    <div class="hero-title">Language & Letters</div>
    <div class="hero-sub">Letters, words, dan tulisan</div>
  </div>
  <div class="act-grid" id="act-grid"></div>
</div>

<!-- ACTIVITY -->
<div class="screen" id="screen-act">
  <div class="exp-header">
    <button class="lesson-back" onclick="goBack()">← Back</button>
    <div class="exp-title" id="act-title"></div>
    <div class="exp-prompt" id="act-prompt"></div>
  </div>
  <div class="exp-area" id="act-area"></div>
</div>

<!-- FABs -->
<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<!-- Parent Panel -->
<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Progress Bahasa</div>
  <div id="parent-content"></div>
</div>

<!-- Confetti -->
<div class="confetti-container" id="confetti-container"></div>

<script>
const ACTIVITIES=[
  {id:'letters',name:'Letter Sounds',desc:'A, B, C — kenali huruf satu per satu',prompt:'Tap a letter untuk hear its sound!'},
  {id:'movable',name:'Movable Alphabet',desc:'Form words from shuffled letters',prompt:'Build the word from the letters!'},
  {id:'trace',name:'Trace Words',desc:'Write words on the dotted line',prompt:'Trace the word with your fingermu!'},
];

const WORDS=[
  {word:'Batu',hint:'Hard object from the ground',emoji:'🪨'},
  {word:'Rumah',hint:'Where we live',emoji:'🏠'},
  {word:'Kucing',hint:'Says meow meow',emoji:'🐱'},
  {word:'Anjing',hint:'Barks and wags tail',emoji:'🐕'},
  {word:'Bunga',hint:'Beautiful and smells nice',emoji:'🌸'},
  {word:'Hujan',hint:'Water falls from the sky',emoji:'🌧️'},
  {word:'Bintang',hint:'Glowing thing in the night sky',emoji:'⭐'},
  {word:'Kupu',hint:'Insect with beautiful wings',emoji:'🦋'},
  {word:'Ikan',hint:'Lives in water',emoji:'🐟'},
  {word:'Matahari',hint:'The very bright star in the morning',emoji:'☀️'},
];

let state={history:['home'],progress:{},currentWord:0,placedLetters:[],bankLetters:[]};

function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function init(){
  state.progress=lsGet('lang-progress',{});
  state.currentWord=lsGet('lang-current',0);
  genStars();
  renderHome();
  setTimeout(()=>say('Let's learn huruf dan kata!'),800);
}

function genStars(){
  const el=document.getElementById('stars');
  el.innerHTML='';
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+1;
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(Math.random()*2+2).toFixed(1)}s`;
    el.appendChild(s);
  }
}

function markDone(id){
  if(!state.progress[id]){
    state.progress[id]=true;
    lsSet('lang-progress',state.progress);
    confetti();
    say('Great! You're done!');
  }
}
function isDone(id){return !!state.progress[id]}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('screen-'+name);
  if(el)el.classList.add('active');
  if(name!=='home')state.history.push(name);
  if(name==='home')state.history=['home'];
  if(name==='home')closeParent();
}
function goBack(){
  if(state.history.length>1)state.history.pop();
  showScreen(state.history[state.history.length-1]||'home');
}

function renderHome(){
  const grid=document.getElementById('act-grid');
  grid.innerHTML='';
  ACTIVITIES.forEach((a,i)=>{
    const done=isDone(a.id);
    const card=document.createElement('button');
    card.className='act-card'+(done?' done':'');
    card.onclick=()=>openAct(a);
    card.innerHTML=`<div class="act-num">${done?'✓':(i+1)}</div><div><div class="act-name">${a.name}</div><div class="act-desc">${a.desc}</div></div><div class="act-badge ${done?'done':''}">${done?'✓':''}</div>`;
    grid.appendChild(card);
  });
}

function openAct(a){
  document.getElementById('act-title').textContent='🔤 '+a.name;
  document.getElementById('act-prompt').textContent=a.prompt;
  const area=document.getElementById('act-area');
  area.innerHTML='';
  switch(a.id){
    case'letters':renderLetters(area);break;
    case'movable':renderMovable(area);break;
    case'trace':renderTrace(area);break;
  }
  showScreen('act');
}

// ── LETTERS ──
function renderLetters(area){
  const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const colors=['#EF5350','#FF7043','#FFCA28','#66BB6A','#26C6DA','#5C6BC0','#AB47BC','#EC407A','#42A5F5','#FFD740'];
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Tap a letter untuk hear its sound!</div>
      <div class="letter-grid">
        ${letters.map((l,i)=>`
          <button class="letter-card" id="lc-${l}" onclick="tapLetter('${l}')" style="background:${colors[i%colors.length]}18;border-color:${colors[i%colors.length]}44;">
            ${l}
          </button>
        `).join('')}
      </div>
      <div class="exp-instruction" id="letter-msg">Tap a letter untuk hear its sound!</div>
    </div>
    <button class="btn btn-primary" onclick="markDone('letters');say('You know the letters!')" style="width:100%;max-width:320px;display:block;margin:10px auto;">✅ Done!</button>
  `;
}
function tapLetter(l){
  document.querySelectorAll('.letter-card').forEach(el=>el.classList.remove('selected'));
  const el=document.getElementById('lc-'+l);
  if(el)el.classList.add('selected');
  const msg=document.getElementById('letter-msg');
  if(msg)msg.textContent=`Huruf ${l}!`;
  say(l);
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(l);
    u.lang='id-ID';u.rate=.85;
    speechSynthesis.speak(u);
  }
}

// ── MOVABLE ──
function renderMovable(area){
  const word=WORDS[state.currentWord%WORDS.length];
  const letters=word.word.toUpperCase().split('');
  const bank=[...letters].sort(()=>Math.random()-.5);
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Build the word jadi kata!</div>
      <div style="font-size:2rem;margin:8px 0;">${word.emoji}</div>
      <div class="exp-instruction">${word.hint}</div>
      <div class="word-area" id="word-area">
        ${letters.map((l,i)=>`
          <div class="word-letter" id="slot-${i}" onclick="tapSlot(${i})">?</div>
        `).join('')}
      </div>
      <div class="letter-bank" id="letter-bank">
        ${bank.map((l,i)=>`
          <button class="bank-letter" id="bank-${i}" onclick="tapBank(${i},'${l}')">${l}</button>
        `).join('')}
      </div>
      <div class="exp-instruction" id="word-msg">Tap a letter dari bank, lalu tap slot!</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px;">
      <button class="btn btn-secondary" onclick="skipWord()">⏭️ Next word</button>
      <button class="btn btn-primary" onclick="checkWord('${word.word.toUpperCase()}')">✅ Check!</button>
    </div>
  `;
  window._currentWord=word.word.toUpperCase();
  window._bankLetters=bank;
  window._placedLetters=Array(letters.length).fill(null);
}
function tapBank(i,l){
  const el=document.getElementById('bank-'+i);
  if(!el||el.classList.contains('used'))return;
  // Find first empty slot
  const slotIdx=window._placedLetters.findIndex(p=>p===null);
  if(slotIdx===-1)return;
  el.classList.add('used');
  el.style.opacity='.3';
  window._placedLetters[slotIdx]=l;
  const slot=document.getElementById('slot-'+slotIdx);
  if(slot){slot.textContent=l;slot.classList.add('placed');}
  checkWordSilent();
}
function tapSlot(i){
  // Remove letter from slot
  if(window._placedLetters[i]===null)return;
  const l=window._placedLetters[i];
  window._placedLetters[i]=null;
  const slot=document.getElementById('slot-'+i);
  if(slot){slot.textContent='?';slot.classList.remove('placed','correct','wrong');}
  // Find and un-use the bank letter
  document.querySelectorAll('.bank-letter').forEach(el=>{
    if(el.textContent===l&&el.classList.contains('used')){
      el.classList.remove('used');
      el.style.opacity='';
    }
  });
  checkWordSilent();
}
function checkWordSilent(){
  const correct=window._currentWord;
  const placed=window._placedLetters.join('');
  let allFilled=window._placedLetters.every(p=>p!==null);
  if(!allFilled)return;
  let allCorrect=true;
  for(let i=0;i<correct.length;i++){
    const slot=document.getElementById('slot-'+i);
    if(window._placedLetters[i]===correct[i]){
      if(slot){slot.classList.add('correct');slot.classList.remove('wrong');}
    } else {
      if(slot){slot.classList.add('wrong');slot.classList.remove('correct');}
      allCorrect=false;
    }
  }
  if(allCorrect){
    const msg=document.getElementById('word-msg');
    if(msg)msg.innerHTML='<span style="color:var(--green)">Benar! '+correct.split('').join(' ')+'</span>';
    confetti();
    say('Hebat! '+WORDS[state.currentWord%WORDS.length].word+'!');
    state.currentWord++;
    lsSet('lang-current',state.currentWord);
  }
}
function checkWord(expected){
  checkWordSilent();
  const placed=window._placedLetters.join('');
  if(placed===expected){
    markDone('movable');
  } else {
    say('Coba susun lagi!');
  }
}
function skipWord(){
  state.currentWord=(state.currentWord+1)%WORDS.length;
  lsSet('lang-current',state.currentWord);
  renderMovable(document.getElementById('act-area'));
}

// ── TRACE ──
function renderTrace(area){
  const word=WORDS[state.currentWord%WORDS.length];
  area.innerHTML=`
    <div class="demo-box">
      <div class="demo-label">Trace the word with your finger!</div>
      <div class="picture-card" style="max-width:280px;margin:8px auto;">
        <div class="picture-emoji">${word.emoji}</div>
        <div class="trace-word" id="trace-word">${word.word}</div>
      </div>
      <div class="canvas-wrap">
        <canvas class="trace-canvas" id="trace-canvas"></canvas>
        <div id="trace-guide" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
          <span style="font-family:var(--font-h);font-size:3rem;color:rgba(255,215,0,.15);letter-spacing:8px;">${word.word}</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
        <button class="btn btn-secondary" onclick="clearTrace()">🗑️ Clear</button>
        <button class="btn btn-primary" onclick="finishTrace()">✅ Done</button>
      </div>
    </div>
    <div style="text-align:center;padding:0 16px;">
      <button class="btn btn-secondary" onclick="nextTrace()" style="margin-top:8px;">⏭️ Next word</button>
    </div>
  `;
  initCanvas();
  window._traceWord=word.word;
}
function initCanvas(){
  const canvas=document.getElementById('trace-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth;
  canvas.height=120;
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  let drawing=false,lastX=0,lastY=0;
  function getPos(e){
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left),y:(src.clientY-r.top)};
  }
  canvas.addEventListener('mousedown',e=>{drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;});
  canvas.addEventListener('mousemove',e=>{if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();lastX=p.x;lastY=p.y;});
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=getPos(e);lastX=p.x;lastY=p.y;},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=getPos(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#FFD700';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();lastX=p.x;lastY=p.y;},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
}
function clearTrace(){
  const canvas=document.getElementById('trace-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
function finishTrace(){
  clearTrace();
  confetti();
  markDone('trace');
  say('Great! You can write '+window._traceWord+'!');
  setTimeout(()=>{
    state.currentWord=(state.currentWord+1)%WORDS.length;
    lsSet('lang-current',state.currentWord);
    renderTrace(document.getElementById('act-area'));
  },1500);
}
function nextTrace(){
  state.currentWord=(state.currentWord+1)%WORDS.length;
  lsSet('lang-current',state.currentWord);
  renderTrace(document.getElementById('act-area'));
}

// ── RABBITY ──
function rabbitySpeak(){
  const msgs=['Let's learn huruf!','You're amazing!','Baca lagi!','Rabbity is so proud!'];
  say(msgs[Math.floor(Math.random()*msgs.length)]);
}
function say(text){
  const b=document.getElementById('rabbity-bubble');
  if(b){b.textContent='🐰 '+text;b.classList.add('show');}
  if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u);}
  setTimeout(()=>{if(b)b.classList.remove('show')},3500);
}

// ── CONFETTI ──
function confetti(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.getElementById('confetti-container');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#EF5350','#66BB6A','#42A5F5','#AB47BC','#FF9800'];
  for(let i=0;i<30;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=Math.random()*100+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=(Math.random()*.8)+'s';c.appendChild(p);}
  setTimeout(()=>c.innerHTML='',3500);
}

// ── PARENT PANEL ──
function toggleParent(){
  const p=document.getElementById('parent-panel');
  if(!p)return;
  p.classList.toggle('open');
  if(p.classList.contains('open'))renderParentPanel();
}
function closeParent(){
  const p=document.getElementById('parent-panel');
  if(p)p.classList.remove('open');
}
function renderParentPanel(){
  const c=document.getElementById('parent-content');
  if(!c)return;
  c.innerHTML='';
  const colors=['#FFD700','#4CAF50','#42A5F5'];
  ACTIVITIES.forEach((a,i)=>{
    const done=isDone(a.id);
    const pct=done?100:0;
    c.innerHTML+=`<div class="panel-row"><div class="panel-row-label">${a.name} <span>${pct}%</span></div><div class="panel-bar"><div class="panel-bar-fill" style="width:${pct}%;background:${colors[i%3]};"></div></div></div>`;
  });
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeParent();goBack();}});
window.addEventListener('load',init);
</script>
