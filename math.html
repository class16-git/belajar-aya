<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Garden — Belajar Aya</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07071A;--card:#12123A;--gold:#FFD700;--green:#4CAF50;--blue:#42A5F5;--red:#EF5350;--cream:#FFF8F0;--shadow:0 4px 24px rgba(0,0,0,.35);--font-h:'Fredoka One',cursive;--font-b:'Quicksand',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:var(--font-b);color:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.9}}
.top-bar{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;background:linear-gradient(to bottom,var(--bg) 70%,transparent)}
.top-title{font-family:var(--font-h);font-size:.9rem;color:var(--gold)}
.top-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-btn:active{transform:scale(.92)}
.hero{padding:8px 16px 20px;position:relative;z-index:1;text-align:center}
.hero-title{font-family:var(--font-h);font-size:1.8rem;color:var(--gold);margin-bottom:4px}
.hero-sub{font-size:.82rem;opacity:.5}
.act-grid{display:flex;flex-direction:column;gap:12px;padding:0 16px 100px;position:relative;z-index:1}
.act-card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);cursor:pointer;border:none;width:100%;text-align:left;color:var(--cream);display:flex;gap:14px;align-items:center;transition:transform .15s;font-family:var(--font-b)}
.act-card:active{transform:scale(.97)}
.act-icon{font-size:2.5rem;flex-shrink:0}
.act-name{font-family:var(--font-h);font-size:1rem;margin-bottom:2px}
.act-desc{font-size:.75rem;opacity:.5;line-height:1.3}
.act-badge{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:.8rem;margin-left:auto;flex-shrink:0}
.act-badge.done{background:var(--green);border-color:var(--green);color:#fff}
.work-area{padding:10px 16px 100px;flex:1;position:relative;z-index:1}
.instruction{background:rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;margin:8px 0;font-size:.85rem;text-align:center;line-height:1.6;border:1px solid rgba(255,255,255,.08)}
.demo-area{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;margin:10px 0;min-height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.rod-row{display:flex;align-items:flex-end;justify-content:center;gap:8px;flex-wrap:wrap}
.rod{background:var(--red);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-family:var(--font-h);cursor:pointer;transition:transform .2s}
.rod:active{transform:scaleY(.95)}
.rod.selected{box-shadow:0 0 0 3px var(--gold)}
.rod-label{font-size:.7rem;padding:2px 4px;opacity:.7}
.spindle{width:44px;min-height:50px;background:rgba(255,255,255,.06);border:2px dashed rgba(255,255,255,.2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px;gap:2px}
.spindle-count{font-family:var(--font-h);font-size:.8rem;color:var(--cream);opacity:.6}
.counter-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:360px;margin:0 auto}
.counter{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:.9rem;cursor:pointer;transition:all .2s;border:none}
.counter:active{transform:scale(.85)}
.counter.selected{box-shadow:0 0 0 3px var(--gold);transform:scale(1.1)}
.counter.used{opacity:.25;pointer-events:none}
.number-card{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:12px;min-width:70px;text-align:center;font-family:var(--font-h);font-size:1.4rem;cursor:pointer;transition:all .15s;color:var(--cream)}
.number-card:active{transform:scale(.93)}
.number-card.selected{background:rgba(255,215,0,.15);border-color:var(--gold);color:var(--gold)}
.number-card.correct{background:rgba(76,175,80,.15);border-color:var(--green);color:var(--green)}
.number-card.wrong{background:rgba(239,83,80,.15);border-color:var(--red);color:var(--red)}
.teen-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 0}
.teen-num{display:flex;align-items:center;gap:4px;font-family:var(--font-h);font-size:1.2rem}
.teen-digit{width:40px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06)}
.teen-digit.blue{background:rgba(33,150,243,.2);border-color:#2196F3;color:#64B5F6}
.teen-digit.red{background:rgba(239,83,80,.2);border-color:#EF5350;color:#EF9A9A;font-size:1.4rem;font-weight:700}
.teen-digit.done{border-color:var(--green);background:rgba(76,175,80,.15)}
.btn{padding:12px 20px;border-radius:14px;border:none;cursor:pointer;font-family:var(--font-b);font-weight:700;font-size:.88rem;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--gold);color:var(--bg);display:block;width:100%;max-width:320px;margin:10px auto}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid rgba(255,255,255,.12);display:block;width:100%;max-width:320px;margin:6px auto}
.act-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--cream);border-radius:12px;padding:8px 14px;font-family:var(--font-b);font-weight:600;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px;width:fit-content}
.act-back:active{transform:scale(.95)}
.success-msg{background:rgba(76,175,80,.15);border:2px solid rgba(76,175,80,.4);border-radius:16px;padding:16px;text-align:center;margin:10px 0;display:none}
.success-msg.show{display:block}
.success-msg .emoji{font-size:2.5rem;margin-bottom:8px}
.success-msg .text{font-family:var(--font-h);color:var(--green);font-size:1.1rem}
.home-fab{position:fixed;bottom:20px;left:20px;width:50px;height:50px;border-radius:50%;background:var(--green);color:#fff;font-size:1.3rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100;display:flex;align-items:center;justify-content:center;text-decoration:none}
.home-fab:active{transform:scale(.9)}
.parent-fab{position:fixed;bottom:20px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--gold);color:var(--bg);font-size:1.2rem;border:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:100}
.parent-fab:active{transform:scale(.9)}
.rabbity-fab{position:fixed;bottom:80px;right:20px;width:50px;height:50px;border-radius:50%;background:var(--card);border:2px solid rgba(255,255,255,.15);color:var(--cream);font-size:1.3rem;z-index:99;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rabbity-bubble{position:fixed;bottom:140px;right:20px;z-index:98;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;max-width:220px;font-size:.8rem;line-height:1.5;color:var(--cream);box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s}
.rabbity-bubble.show{opacity:1}
.parent-panel{position:fixed;bottom:0;left:0;right:0;background:var(--cream);color:#333;border-radius:20px 20px 0 0;padding:20px 16px 90px;box-shadow:0 -4px 24px rgba(0,0,0,.2);z-index:99;max-height:70vh;overflow-y:auto;transform:translateY(110%);transition:transform .3s}
.parent-panel.open{transform:translateY(0)}
.panel-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:0 auto 14px}
.panel-title{font-family:var(--font-h);font-size:1rem;color:#333;text-align:center;margin-bottom:14px}
.panel-row{margin-bottom:12px}
.panel-row-label{font-weight:700;font-size:.82rem;color:#333;display:flex;justify-content:space-between;margin-bottom:4px}
.panel-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.panel-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.confetti-container{position:fixed;inset:0;pointer-events:none;z-index:9999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 2.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="screen active" id="screen-home">
  <div class="top-bar">
    <a href="index.html" class="top-btn">←</a>
    <div class="top-title">Math Garden</div>
    <div style="width:44px"></div>
  </div>
  <div class="hero">
    <div style="font-size:2.5rem;margin-bottom:4px;">🔢</div>
    <div class="hero-title">Math Garden</div>
    <div class="hero-sub">Explore numbers with your hands!</div>
  </div>
  <div class="act-grid" id="act-grid"></div>
</div>

<div class="screen" id="screen-work">
  <div class="top-bar">
    <button class="act-back" onclick="goBack()">← Back</button>
    <div class="top-title" id="work-title">Activity</div>
    <button class="top-btn" onclick="toggleParent()">👤</button>
  </div>
  <div class="work-area" id="work-area"></div>
</div>

<a href="index.html" class="home-fab">🏠</a>
<button class="parent-fab" onclick="toggleParent()">👤</button>
<button class="rabbity-fab" onclick="rabbitySpeak()">🐰</button>
<div class="rabbity-bubble" id="rabbity-bubble"></div>

<div class="parent-panel" id="parent-panel">
  <div class="panel-handle"></div>
  <button onclick="toggleParent()" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:#999;">✕</button>
  <div class="panel-title">📊 Math Progress</div>
  <div id="parent-content"></div>
</div>

<div class="confetti-container" id="confetti-container"></div>

<script>
var ACTIVITIES = [
  { id: "rods", emoji: "🔴", name: "Number Rods", desc: "Compare lengths — longest to shortest", key: "math-rods" },
  { id: "spindle", emoji: "🪑", name: "Spindle Box", desc: "Match numbers to quantities", key: "math-spindle" },
  { id: "counters", emoji: "🔵", name: "Cards and Counters", desc: "Arrange odd and even numbers", key: "math-counters" },
  { id: "teen", emoji: "1️⃣", name: "Teen Board", desc: "Explore numbers 11 through 19", key: "math-teen" },
  { id: "tens", emoji: "🔟", name: "Tens Board", desc: "Build tens from 10 to 99", key: "math-tens" }
];

var state = { currentAct: null, history: ["home"], progress: {} };

function lsGet(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
}

function init() {
  state.progress = lsGet("math-progress", {});
  genStars();
  renderActGrid();
  setTimeout(function() { say("Welcome to the Math Garden!"); }, 600);
}

function genStars() {
  var el = document.getElementById("stars");
  el.innerHTML = "";
  for (var i = 0; i < 55; i++) {
    var s = document.createElement("div");
    s.className = "star";
    var sz = Math.random() * 2 + 1;
    s.style.cssText = "left:" + (Math.random() * 100) + "%;top:" + (Math.random() * 100) + "%;width:" + sz + "px;height:" + sz + "px;animation-delay:" + (Math.random() * 3).toFixed(1) + "s;animation-duration:" + (Math.random() * 2 + 2).toFixed(1) + "s";
    el.appendChild(s);
  }
}

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
  var el = document.getElementById("screen-" + name);
  if (el) el.classList.add("active");
  if (name !== "home") state.history.push(name);
  if (name === "home") { state.history = ["home"]; closeParent(); }
}

function goBack() {
  if (state.history.length > 1) state.history.pop();
  showScreen(state.history[state.history.length - 1] || "home");
}

function renderActGrid() {
  var grid = document.getElementById("act-grid");
  grid.innerHTML = "";
  ACTIVITIES.forEach(function(a) {
    var done = !!state.progress[a.id];
    var card = document.createElement("button");
    card.className = "act-card";
    card.onclick = function() { openAct(a); };
    card.innerHTML = '<div class="act-icon">' + a.emoji + '</div><div><div class="act-name">' + a.name + '</div><div class="act-desc">' + a.desc + '</div></div><div class="act-badge ' + (done ? "done" : "") + '">' + (done ? "✓" : "→") + "</div>";
    grid.appendChild(card);
  });
}

function openAct(a) {
  state.currentAct = a;
  document.getElementById("work-title").textContent = a.name;
  var area = document.getElementById("work-area");
  area.innerHTML = "";
  switch (a.id) {
    case "rods": renderRods(area); break;
    case "spindle": renderSpindle(area); break;
    case "counters": renderCounters(area); break;
    case "teen": renderTeen(area); break;
    case "tens": renderTens(area); break;
  }
  showScreen("work");
}

function markActDone(id) {
  if (!state.progress[id]) {
    state.progress[id] = true;
    lsSet("math-progress", state.progress);
    confetti();
    say("Wonderful! You completed this activity!");
  }
}

// NUMBER RODS
function renderRods(area) {
  var rods = [
    { len: 1, color: "#EF5350" },
    { len: 2, color: "#FF7043" },
    { len: 3, color: "#FFCA28" },
    { len: 4, color: "#66BB6A" },
    { len: 5, color: "#26A69A" },
    { len: 6, color: "#42A5F5" },
    { len: 7, color: "#5C6BC0" },
    { len: 8, color: "#AB47BC" },
    { len: 9, color: "#EC407A" }
  ];
  area.innerHTML = '<div class="instruction">Tap rods from shortest to longest! Start with the smallest.</div><div class="demo-area" id="rods-area"></div><div class="success-msg" id="rods-msg"><div class="emoji">🎉</div><div class="text">Perfect order! Longest to shortest!</div></div><button class="btn btn-secondary" onclick="resetRods()">Try Again</button>';
  state.rodOrder = [];
  var container = document.getElementById("rods-area");
  // Shuffle for display
  var shuffled = rods.slice().sort(function() { return Math.random() - 0.5; });
  shuffled.forEach(function(r, i) {
    var div = document.createElement("div");
    div.className = "rod";
    div.dataset.len = r.len;
    div.style.width = (r.len * 20 + 10) + "px";
    div.style.height = "44px";
    div.style.background = r.color;
    div.style.animationDelay = (i * 80) + "ms";
    div.onclick = function() {
      if (div.classList.contains("selected")) return;
      var expected = state.rodOrder.length === 0 ? 1 : state.rodOrder[state.rodOrder.length - 1] + 1;
      if (r.len === expected) {
        div.classList.add("selected");
        state.rodOrder.push(r.len);
        say("Length " + r.len + "! Keep going!");
        if (state.rodOrder.length === rods.length) {
          document.getElementById("rods-msg").classList.add("show");
          markActDone("rods");
        }
      } else {
        say("Try the shortest first!");
      }
    };
    container.appendChild(div);
  });
}

function resetRods() {
  var area = document.getElementById("rods-area");
  area.innerHTML = "";
  state.rodOrder = [];
  document.getElementById("rods-msg").classList.remove("show");
  renderRods(area);
}

// SPINDLE BOX
function renderSpindle(area) {
  var spindles = [
    { num: 1 }, { num: 2 }, { num: 3 }, { num: 4 },
    { num: 5 }, { num: 6 }, { num: 7 }, { num: 8 }, { num: 9 }
  ];
  area.innerHTML = '<div class="instruction">Drag the correct number of items into each slot!</div><div class="demo-area" id="spindle-area"></div><div class="success-msg" id="spindle-msg"><div class="emoji">🎉</div><div class="text">Perfect matching!</div></div>';
  var container = document.getElementById("spindle-area");
  state.spindleCounts = {};
  // Draw slots
  for (var i = 1; i <= 9; i++) {
    var slot = document.createElement("div");
    slot.className = "spindle";
    slot.id = "slot-" + i;
    slot.dataset.target = i;
    var lbl = document.createElement("div");
    lbl.className = "spindle-count";
    lbl.textContent = i;
    slot.appendChild(lbl);
    container.appendChild(slot);
  }
  // Draw items to drag
  var items = [];
  for (var j = 1; j <= 9; j++) {
    for (var k = 0; k < j; k++) {
      items.push(j);
    }
  }
  // Shuffle items
  items.sort(function() { return Math.random() - 0.5; });
  var itemRow = document.createElement("div");
  itemRow.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:12px 0";
  itemRow.id = "spindle-items";
  items.forEach(function(n) {
    var itm = document.createElement("div");
    itm.textContent = "●";
    itm.style.cssText = "width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:grab;user-select:none;touch-action:none";
    itm.dataset.num = n;
    itm.addEventListener("pointerdown", function(e) {
      e.preventDefault();
      var el = itm;
      var startX = e.clientX, startY = e.clientY;
      var clone = el.cloneNode(true);
      clone.style.cssText = "position:fixed;z-index:1000;pointer-events:none;left:" + startX + "px;top:" + startY + "px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1rem";
      document.body.appendChild(clone);
      function onMove(e) {
        clone.style.left = e.clientX + "px";
        clone.style.top = e.clientY + "px";
      }
      function onUp(e) {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        clone.remove();
        var target = document.elementFromPoint(e.clientX, e.clientY);
        if (target) {
          var slot = target.closest(".spindle");
          if (slot) {
            var targetNum = parseInt(slot.dataset.target);
            if (targetNum === parseInt(el.dataset.num)) {
              var count = (state.spindleCounts[slot.id] || 0) + 1;
              state.spindleCounts[slot.id] = count;
              if (count <= targetNum) {
                var dot = document.createElement("span");
                dot.textContent = "●";
                dot.style.cssText = "font-size:.9rem;color:#42A5F5;line-height:1";
                slot.appendChild(dot);
                say("Count " + count + " in slot " + targetNum);
                if (count === targetNum) {
                  slot.style.borderColor = "#4CAF50";
                  slot.style.borderStyle = "solid";
                  checkSpindleComplete();
                }
              }
            } else {
              say("This slot needs " + targetNum + " items!");
            }
          }
        }
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    });
    itemRow.appendChild(itm);
  });
  container.appendChild(itemRow);
}

function checkSpindleComplete() {
  var complete = true;
  for (var i = 1; i <= 9; i++) {
    if ((state.spindleCounts["slot-" + i] || 0) !== i) {
      complete = false;
      break;
    }
  }
  if (complete) {
    document.getElementById("spindle-msg").classList.add("show");
    markActDone("spindle");
  }
}

// CARDS AND COUNTERS
function renderCounters(area) {
  area.innerHTML = '<div class="instruction">Arrange the number cards and counters. Odd numbers have one extra!</div><div class="demo-area"><div style="margin-bottom:12px;font-size:.78rem;opacity:.6;">Tap a number to see how many counters it needs</div><div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;" id="counter-nums"></div><div class="counter-grid" id="counter-grid"></div></div><div class="success-msg" id="counter-msg"><div class="emoji">🎉</div><div class="text">Odd and even — you found the pattern!</div></div>';
  var nums = document.getElementById("counter-nums");
  var grid = document.getElementById("counter-grid");
  state.selectedNum = null;
  for (var i = 1; i <= 9; i++) {
    (function(n) {
      var btn = document.createElement("button");
      btn.className = "number-card";
      btn.textContent = n;
      btn.onclick = function() {
        document.querySelectorAll(".number-card").forEach(function(b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        state.selectedNum = n;
        renderCounterDots(n);
        if (n % 2 === 0) {
          say(n + " is even — it pairs perfectly!");
        } else {
          say(n + " is odd — one is left without a partner!");
        }
      };
      nums.appendChild(btn);
    })(i);
  }
  function renderCounterDots(n) {
    grid.innerHTML = "";
    for (var j = 0; j < n; j++) {
      var c = document.createElement("div");
      c.className = "counter";
      c.textContent = "●";
      c.style.background = j === n - 1 && n % 2 !== 0 ? "rgba(239,83,80,.3)" : "rgba(33,150,243,.3)";
      c.style.color = j === n - 1 && n % 2 !== 0 ? "#EF5350" : "#42A5F5";
      c.style.animation = "dotDrop 0.3s ease-out backwards";
      c.style.animationDelay = (j * 50) + "ms";
      c.onclick = function() {
        c.style.boxShadow = "0 0 0 3px #FFD700";
        if (state.selectedNum === 9) {
          document.getElementById("counter-msg").classList.add("show");
          markActDone("counters");
        }
      };
      grid.appendChild(c);
    }
  }
}

// TEEN BOARD
function renderTeen(area) {
  var teens = [11, 12, 13, 14, 15, 16, 17, 18, 19];
  area.innerHTML = '<div class="instruction">Tap each teen number. 10 (blue) + 1-9 (red) = teen number!</div><div class="demo-area"><div class="teen-row" id="teen-row"></div></div><div class="success-msg" id="teen-msg"><div class="emoji">🎉</div><div class="text">You understand teen numbers!</div></div>';
  var row = document.getElementById("teen-row");
  state.teensClicked = 0;
  teens.forEach(function(n) {
    (function(num) {
      var div = document.createElement("div");
      div.className = "teen-num";
      div.id = "teen-" + num;
      var tens = document.createElement("div");
      tens.className = "teen-digit blue";
      tens.textContent = "10";
      var ones = document.createElement("div");
      ones.className = "teen-digit red";
      ones.textContent = (num % 10);
      div.appendChild(tens);
      div.appendChild(ones);
      div.style.cursor = "pointer";
      div.onclick = function() {
        if (div.classList.contains("done")) return;
        div.classList.add("done");
        tens.classList.add("done");
        ones.classList.add("done");
        state.teensClicked++;
        say(num + " = 10 + " + (num % 10) + "!");
        if (state.teensClicked >= teens.length) {
          document.getElementById("teen-msg").classList.add("show");
          markActDone("teen");
        }
      };
      row.appendChild(div);
    })(n);
  });
}

// TENS BOARD
function renderTens(area) {
  area.innerHTML = '<div class="instruction">Build tens! Select a tens digit, then a ones digit.</div><div style="margin-bottom:14px;"><div style="font-size:.78rem;opacity:.6;margin-bottom:8px;">Step 1: Choose the tens digit</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;" id="tens-digits"></div></div><div style="margin-bottom:14px;"><div style="font-size:.78rem;opacity:.6;margin-bottom:8px;">Step 2: Choose the ones digit</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;" id="ones-digits"></div></div><div class="demo-area"><div style="font-family:var(--font-h);font-size:2rem;color:var(--gold);" id="tens-result">?</div></div><div class="success-msg" id="tens-msg"><div class="emoji">🎉</div><div class="text">You built a two-digit number!</div></div>';
  var tensDig = document.getElementById("tens-digits");
  var onesDig = document.getElementById("ones-digits");
  state.tensDigit = null;
  state.onesDigit = null;
  for (var t = 1; t <= 9; t++) {
    (function(tv) {
      var btn = document.createElement("button");
      btn.className = "number-card";
      btn.textContent = tv + "0";
      btn.onclick = function() {
        document.querySelectorAll("#tens-digits .number-card").forEach(function(b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        state.tensDigit = tv;
        updateTensResult();
      };
      tensDig.appendChild(btn);
    })(t);
  }
  for (var o = 0; o <= 9; o++) {
    (function(ov) {
      var btn = document.createElement("button");
      btn.className = "number-card";
      btn.textContent = ov;
      btn.onclick = function() {
        document.querySelectorAll("#ones-digits .number-card").forEach(function(b) { b.classList.remove("selected"); });
        btn.classList.add("selected");
        state.onesDigit = ov;
        updateTensResult();
      };
      onesDig.appendChild(btn);
    })(o);
  }
}

function updateTensResult() {
  var el = document.getElementById("tens-result");
  if (!el) return;
  if (state.tensDigit !== null && state.onesDigit !== null) {
    var num = state.tensDigit * 10 + state.onesDigit;
    el.textContent = state.tensDigit + "0 + " + state.onesDigit + " = " + num;
    document.getElementById("tens-msg").classList.add("show");
    markActDone("tens");
    say("You built the number " + num + "!");
  }
}

function rabbitySpeak() {
  var msgs = ["Math is fun!", "Numbers are everywhere!", "Keep going!", "You can do it!"];
  say(msgs[Math.floor(Math.random() * msgs.length)]);
}

function say(text) {
  var b = document.getElementById("rabbity-bubble");
  if (b) { b.textContent = "🐰 " + text; b.classList.add("show"); }
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 0.85;
    speechSynthesis.speak(u);
  }
  setTimeout(function() { if (b) b.classList.remove("show"); }, 3500);
}

function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var c = document.getElementById("confetti-container");
  if (!c) return;
  c.innerHTML = "";
  var colors = ["#FFD700", "#EF5350", "#66BB6A", "#42A5F5", "#AB47BC", "#FF9800"];
  for (var i = 0; i < 40; i++) {
    var p = document.createElement("div");
    p.className = "confetti-piece";
    p.style.left = Math.random() * 100 + "%";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.8) + "s";
    p.style.animationDuration = "2.5s";
    c.appendChild(p);
  }
  setTimeout(function() { c.innerHTML = ""; }, 3500);
}

function toggleParent() {
  var p = document.getElementById("parent-panel");
  if (!p) return;
  p.classList.toggle("open");
  if (p.classList.contains("open")) renderParentPanel();
}

function closeParent() {
  var p = document.getElementById("parent-panel");
  if (p) p.classList.remove("open");
}

function renderParentPanel() {
  var c = document.getElementById("parent-content");
  if (!c) return;
  c.innerHTML = "";
  ACTIVITIES.forEach(function(a, i) {
    var done = !!state.progress[a.id];
    var pct = done ? 100 : 0;
    c.innerHTML += "<div class=\"panel-row\"><div class=\"panel-row-label\">" + a.emoji + " " + a.name + " <span>" + pct + "%</span></div><div class=\"panel-bar\"><div class=\"panel-bar-fill\" style=\"width:" + pct + "%;background:#1B5E20;\"></div></div></div>";
  });
}

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape") { closeParent(); goBack(); }
});
window.addEventListener("load", init);
</script>
</body>
